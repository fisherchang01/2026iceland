<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>冰島芬蘭之旅 · 體驗內容編輯器 (DEBUG)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #3f6e7a;
      --accent: #4a8fa3;
      --bg: #f2ede4;
      --bg2: #e9e2d3;
      --card: #ffffff;
      --text: #2a2f2e;
      --sub: #6b756f;
      --border: #ddd3c2;
    }
    body {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .debug-panel {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .debug-panel h2 {
      color: #664d03;
      margin-bottom: 10px;
    }
    .debug-log {
      background: #fff;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
      line-height: 1.4;
    }
    .debug-log .log-entry {
      margin-bottom: 8px;
      padding: 5px;
      border-left: 3px solid #ccc;
      padding-left: 10px;
    }
    .debug-log .log-entry.error {
      border-left-color: #dc3545;
      background: #ffe5e5;
      color: #721c24;
    }
    .debug-log .log-entry.success {
      border-left-color: #28a745;
      background: #e5ffe5;
      color: #155724;
    }
    .debug-log .log-entry.info {
      border-left-color: #0066cc;
      background: #e5f0ff;
      color: #003d99;
    }
    button {
      padding: 10px 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 10px;
    }
    button:hover { opacity: 0.9; }
    input {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      width: 300px;
    }
  </style>
</head>
<body>

<div class="debug-panel">
  <h2>🐛 調試面板 (Debug Mode)</h2>
  
  <div style="margin-bottom: 15px;">
    <input type="password" id="githubPAT" placeholder="GitHub PAT" style="width: 300px; margin-right: 10px;">
    <button onclick="testLoadAndParse()">測試加載和解析</button>
    <button onclick="clearLog()">清除日誌</button>
  </div>

  <div class="debug-log" id="debugLog"></div>
</div>

<script>
const debugLog = document.getElementById('debugLog');

function log(message, type = 'info') {
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  
  const timestamp = new Date().toLocaleTimeString();
  entry.textContent = `[${timestamp}] ${message}`;
  
  debugLog.appendChild(entry);
  debugLog.scrollTop = debugLog.scrollHeight;
  console.log(`[${type.toUpperCase()}] ${message}`);
}

function clearLog() {
  debugLog.innerHTML = '';
  log('日誌已清除', 'info');
}

async function testLoadAndParse() {
  const pat = document.getElementById('githubPAT').value;
  
  if (!pat) {
    log('❌ 請先輸入 GitHub PAT', 'error');
    return;
  }

  log('開始測試...', 'info');

  try {
    // 第一步：從 GitHub 獲取文件
    log('Step 1: 從 GitHub 獲取 travel-content.js...', 'info');
    
    const response = await fetch('https://api.github.com/repos/fisherchang01/2026iceland/contents/data/travel-content.js', {
      headers: { 'Authorization': `token ${pat}` }
    });

    if (!response.ok) {
      log(`❌ GitHub API 錯誤: ${response.status}`, 'error');
      return;
    }

    const data = await response.json();
    const content = atob(data.content);
    
    log(`✓ 成功獲取文件 (${content.length} 字符)`, 'success');

    // 第二步：查找 TRAVEL_HTML
    log('Step 2: 查找 TRAVEL_HTML 字符串...', 'info');
    
    const match = content.match(/const TRAVEL_HTML = `([\s\S]*?)`;/);
    if (!match) {
      log('❌ 無法找到 TRAVEL_HTML', 'error');
      log(`文件內容前500字符: ${content.substring(0, 500)}`, 'error');
      return;
    }

    const htmlContent = match[1];
    log(`✓ 成功提取 HTML 內容 (${htmlContent.length} 字符)`, 'success');

    // 第三步：使用 DOMParser 解析
    log('Step 3: 使用 DOMParser 解析 HTML...', 'info');
    
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlContent, 'text/html');

    // 第四步：查找所有 travel-collapse
    log('Step 4: 查找所有 .travel-collapse 元素...', 'info');
    
    const collapses = doc.querySelectorAll('div.travel-collapse');
    log(`✓ 找到 ${collapses.length} 個分類`, 'success');

    // 第五步：解析每個分類
    log('Step 5: 解析每個分類的詳細信息...', 'info');
    
    collapses.forEach((collapse, idx) => {
      const cover = collapse.getAttribute('data-cover');
      const emojiEl = collapse.querySelector('.travel-collapse-emoji');
      const titleEl = collapse.querySelector('.travel-collapse-title');
      const bodyEl = collapse.querySelector('.travel-collapse-body');
      const cardElements = bodyEl ? bodyEl.querySelectorAll('div.item-card') : [];

      const emoji = emojiEl ? emojiEl.textContent.trim() : '❓';
      const title = titleEl ? titleEl.textContent.trim() : '(unknown)';
      const itemCount = cardElements.length;

      log(`分類 ${idx + 1}: ${emoji} ${title} (${itemCount} 項)`, itemCount > 0 ? 'success' : 'error');

      // 詳細信息
      if (itemCount > 0) {
        cardElements.forEach((card, itemIdx) => {
          const cardTitle = card.querySelector('.item-card-title');
          const cardDetail = card.querySelector('.item-detail');
          
          if (cardTitle && cardDetail) {
            const title = cardTitle.textContent.trim();
            const detailLength = cardDetail.textContent.length;
            log(`  └─ 項目 ${itemIdx + 1}: ${title} (${detailLength} 字)`, 'info');
          }
        });
      }
    });

    log('✅ 測試完成！', 'success');

  } catch (error) {
    log(`❌ 發生錯誤: ${error.message}`, 'error');
    log(`Stack: ${error.stack}`, 'error');
  }
}

// 頁面加載時的提示
window.addEventListener('load', () => {
  log('調試頁面已加載', 'info');
  log('1. 在上方輸入你的 GitHub PAT', 'info');
  log('2. 點擊「測試加載和解析」按鈕', 'info');
  log('3. 檢查下方日誌了解詳細過程', 'info');
  log('同時打開瀏覽器控制台 (F12) 查看 console 輸出', 'info');
});
</script>

</body>
</html>
