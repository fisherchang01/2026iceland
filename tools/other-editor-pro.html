<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ 工具編輯器 Pro - 簡化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .layout {
            display: grid;
            grid-template-columns: 240px 1fr 400px;
            height: 100vh;
            gap: 1px;
            background: #ddd;
        }

        .sidebar {
            background: white;
            overflow-y: auto;
            padding: 14px;
            border-right: 1px solid #e5e5e5;
        }

        .sidebar-title {
            font-size: 10px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .category-btn, .item-btn {
            display: block;
            width: 100%;
            padding: 9px 11px;
            margin-bottom: 4px;
            border: 1px solid #e5e5e5;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-btn:hover, .item-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .category-btn.active, .item-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
            font-weight: 600;
        }

        .item-btn.modified::after {
            content: ' ●';
            color: #ff6b6b;
            font-weight: 700;
        }

        .items-container {
            padding-left: 14px;
            margin-top: 5px;
            max-height: 400px;
            overflow-y: auto;
        }

        .editor {
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .editor-top-bar {
            position: fixed;
            top: 0;
            left: 241px;
            right: 401px;
            height: 50px;
            background: white;
            border-bottom: 2px solid #667eea;
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .editor-top-bar.has-unsaved {
            border-bottom-color: #ff6b6b;
            background: #fffbfb;
        }

        .draft-badge {
            background: #ff6b6b;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            min-width: 30px;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: #333;
            transition: all 0.2s;
        }

        button:hover {
            border-color: #667eea;
            color: #667eea;
        }

        button.primary {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        button.primary:hover {
            background: #5568d3;
        }

        .editor-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
            margin-top: 50px;
        }

        .editor-header h2 {
            font-size: 16px;
            color: #333;
        }

        .editor-header p {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .loading-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            min-height: 180px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 11px;
            line-height: 1.6;
        }

        .format-toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            padding: 10px;
            background: linear-gradient(180deg, #fafafa, #f5f5f5);
            border: 1px solid #e5e5e5;
            border-radius: 4px;
        }

        .format-btn-group {
            display: flex;
            gap: 3px;
            border-right: 1px solid #ddd;
            padding-right: 6px;
        }

        .format-btn-group:last-child {
            border-right: none;
            padding-right: 0;
        }

        .format-btn {
            padding: 6px 9px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            min-width: 32px;
            text-align: center;
        }

        .format-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .format-btn.color-btn {
            min-width: auto;
            padding: 6px 12px;
        }

        .right-panel {
            background: white;
            padding: 16px;
            overflow-y: auto;
            border-left: 1px solid #e5e5e5;
        }

        .right-panel-title {
            font-size: 12px;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
        }

        .preview {
            background: #f9f9f9;
            padding: 12px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 500px;
            overflow-y: auto;
        }

        .preview-label {
            font-size: 10px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .format-hint {
            font-size: 10px;
            color: #999;
            background: #f5f5f5;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .format-hint code {
            background: white;
            padding: 2px 4px;
            border-radius: 2px;
            font-family: monospace;
            font-size: 9px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-content h3 {
            margin-bottom: 16px;
            font-size: 14px;
        }

        .modal-content input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .modal-footer {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-title">📂 加載中...</div>
            <div id="categories"></div>
        </div>

        <!-- 编辑区域 -->
        <div class="editor">
            <div class="editor-top-bar" id="topBar">
                <div>
                    <span id="draftCount" class="draft-badge" style="display: none;">0</span>
                </div>
                <div class="button-group">
                    <button onclick="saveLocal()" class="primary">💾 本地保存</button>
                    <button onclick="showUploadModal()" class="primary">⬆️ 上傳到 GitHub</button>
                </div>
            </div>

            <div class="editor-header">
                <h2 id="editorTitle">加載中...</h2>
                <p id="editorSub"></p>
            </div>

            <div class="editor-content" id="editorContent">
                <div class="loading-state">正在從網站導入真實數據...</div>
            </div>
        </div>

        <!-- 右侧面板 -->
        <div class="right-panel">
            <div class="right-panel-title">📝 項目內容預覽</div>
            <div id="previewArea">
                <div class="preview" id="preview" style="display: none;"></div>
                <div class="format-hint" style="display: none;" id="formatHint">
                    <strong>格式化指南：</strong><br>
                    <code>{bold}文字{/bold}</code> 粗體<br>
                    <code>{italic}文字{/italic}</code> 斜體<br>
                    <code>{#ff6b6b}紅{/color}</code><br>
                    <code>{#0066cc}藍{/color}</code><br>
                    <code>{#00aa00}綠{/color}</code><br>
                    <code>/n</code> 換行
                </div>
            </div>
        </div>
    </div>

    <!-- 上传模态框 -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h3>輸入 GitHub PAT</h3>
            <p style="font-size: 11px; color: #999; margin-bottom: 12px;">
                首次使用請輸入 Personal Access Token
            </p>
            <input type="password" id="patInput" placeholder="粘貼你的 GitHub PAT">
            <div class="modal-footer">
                <button onclick="closeUploadModal()">取消</button>
                <button onclick="uploadToGithub()" class="primary">上傳</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 全局状态 =====
        let otherData = {};
        let currentCategory = null;
        let currentItem = null;
        let modifiedItems = new Set();
        let localData = {};

        // ===== 初始化 =====
        async function init() {
            console.log('开始导入工具数据...');
            loadLocalData();
            await importWebsiteData();
            renderCategories();
            updateStatus();
        }

        // ===== 加载本地修改 =====
        function loadLocalData() {
            const saved = localStorage.getItem('other-editor-modifications');
            if (saved) {
                try {
                    localData = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to load local data:', e);
                }
            }
        }

        // ===== 从网站导入真实数据 =====
        async function importWebsiteData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/fisherchang01/2026iceland/main/data/other-content.js');
                const jsContent = await response.text();

                const htmlMatch = jsContent.match(/const OTHER_HTML = `([\s\S]*)`/);
                if (!htmlMatch) {
                    throw new Error('无法提取 OTHER_HTML');
                }

                const htmlContent = htmlMatch[1];
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');

                const collapses = doc.querySelectorAll('.travel-collapse');

                collapses.forEach((collapse, index) => {
                    const emoji = collapse.querySelector('.travel-collapse-emoji')?.textContent || '📌';
                    const title = collapse.querySelector('.travel-collapse-title')?.textContent || '';
                    const sub = collapse.querySelector('.travel-collapse-sub')?.textContent || '';

                    const items = [];
                    const itemCards = collapse.querySelectorAll('.item-card');
                    const toolMiniCards = collapse.querySelectorAll('.tool-mini-card');
                    
                    if (itemCards.length > 0) {
                        itemCards.forEach((card) => {
                            const itemTitle = card.querySelector('.item-card-title')?.textContent || '';
                            const itemDetail = card.querySelector('.item-detail')?.innerHTML || '';
                            const itemText = card.querySelector('.item-detail')?.textContent || '';
                            
                            items.push({
                                title: itemTitle,
                                detail: itemDetail,
                                rawDetail: itemText
                            });
                        });
                    } else if (toolMiniCards.length > 0) {
                        toolMiniCards.forEach((card) => {
                            const itemTitle = card.querySelector('strong')?.textContent || '';
                            const itemText = card.querySelector('p')?.textContent || '';
                            
                            items.push({
                                title: itemTitle,
                                detail: itemText,
                                rawDetail: itemText
                            });
                        });
                    }

                    const catKey = `cat_${index}`;
                    otherData[catKey] = {
                        emoji,
                        title,
                        sub,
                        items
                    };
                });

                console.log('✅ 数据导入成功！');
                return true;
            } catch (error) {
                console.error('❌ 导入失败:', error);
                document.getElementById('editorContent').innerHTML = `<div class="error-message">❌ 导入失败：${error.message}</div>`;
                return false;
            }
        }

        // ===== 更新状态信息 =====
        function updateStatus() {
            document.getElementById('formatHint').style.display = 'block';
            document.getElementById('preview').style.display = 'none';
        }

        // ===== 渲染分类 =====
        function renderCategories() {
            const container = document.getElementById('categories');
            container.innerHTML = '<div class="sidebar-title">📂 分類</div>';

            const sortedKeys = Object.keys(otherData).sort((a, b) => {
                return parseInt(a.split('_')[1]) - parseInt(b.split('_')[1]);
            });

            sortedKeys.forEach(key => {
                const catData = otherData[key];
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.textContent = `${catData.emoji} ${catData.title}`;
                btn.onclick = () => selectCategory(key);
                container.appendChild(btn);
            });
        }

        // ===== 选择分类 =====
        function selectCategory(catKey) {
            currentCategory = catKey;
            currentItem = null;
            renderItems();
            clearForm();
        }

        // ===== 渲染项目 =====
        function renderItems() {
            const catData = otherData[currentCategory];
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.includes(catData.title)) {
                    btn.classList.add('active');
                }
            });

            const itemsContainer = document.querySelector('.items-container');
            if (itemsContainer) itemsContainer.remove();

            const newItemsContainer = document.createElement('div');
            newItemsContainer.className = 'items-container';

            catData.items.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'item-btn';
                btn.textContent = item.title;
                const key = `${currentCategory}-${index}`;
                if (modifiedItems.has(key)) {
                    btn.classList.add('modified');
                }
                btn.onclick = () => selectItem(index);
                newItemsContainer.appendChild(btn);
            });

            document.querySelector('.sidebar').appendChild(newItemsContainer);
        }

        // ===== 选择项目 =====
        function selectItem(index) {
            currentItem = index;
            renderForm();
        }

        // ===== 渲染编辑表单 =====
        function renderForm() {
            const catData = otherData[currentCategory];
            const item = catData.items[currentItem];
            const key = `${currentCategory}-${currentItem}`;
            const savedData = localData[key] || {};

            document.getElementById('editorTitle').textContent = item.title;
            document.getElementById('editorSub').textContent = catData.sub || '';

            const content = document.getElementById('editorContent');
            content.innerHTML = `
                <div class="form-group">
                    <label>所屬分類</label>
                    <input type="text" value="${catData.title}" readonly>
                </div>

                <div class="form-group">
                    <label>項目標題</label>
                    <input type="text" value="${item.title}" readonly>
                </div>

                <div class="form-group">
                    <label>格式化工具</label>
                    <div class="format-toolbar">
                        <div class="format-btn-group">
                            <button class="format-btn" title="粗體" onclick="insertFormat('{bold}', '{/bold}')"><b>B</b></button>
                            <button class="format-btn" title="斜體" onclick="insertFormat('{italic}', '{/italic}')"><i>I</i></button>
                        </div>
                        <div class="format-btn-group">
                            <button class="format-btn" title="換行" onclick="insertText('\\n')">↵</button>
                        </div>
                        <div class="format-btn-group">
                            <button class="format-btn color-btn" title="紅色" onclick="insertColor('#ff6b6b')" style="color: #ff6b6b;">🔴</button>
                            <button class="format-btn color-btn" title="藍色" onclick="insertColor('#0066cc')" style="color: #0066cc;">🔵</button>
                            <button class="format-btn color-btn" title="綠色" onclick="insertColor('#00aa00')" style="color: #00aa00;">🟢</button>
                        </div>
                        <div class="format-btn-group">
                            <button class="format-btn" title="清空" onclick="clearTextarea()">🗑️</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>項目內容</label>
                    <textarea id="detailInput" oninput="updatePreview()">${savedData.detail || item.rawDetail}</textarea>
                </div>
            `;

            updatePreview();
        }

        // ===== 插入格式 =====
        function insertFormat(openTag, closeTag) {
            const input = document.getElementById('detailInput');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const value = input.value;
            const selectedText = value.substring(start, end);

            if (selectedText) {
                const newText = openTag + selectedText + closeTag;
                input.value = value.substring(0, start) + newText + value.substring(end);
            } else {
                input.value = value.substring(0, start) + openTag + closeTag + value.substring(start);
            }
            input.focus();
            updatePreview();
        }

        // ===== 插入颜色 =====
        function insertColor(color) {
            const input = document.getElementById('detailInput');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const value = input.value;
            const selectedText = value.substring(start, end);

            if (selectedText) {
                const colorTag = `{${color}}${selectedText}{/color}`;
                input.value = value.substring(0, start) + colorTag + value.substring(end);
            } else {
                const colorTag = `{${color}}文字{/color}`;
                input.value = value.substring(0, start) + colorTag + value.substring(start);
            }
            input.focus();
            updatePreview();
        }

        // ===== 插入文本 =====
        function insertText(text) {
            const input = document.getElementById('detailInput');
            const start = input.selectionStart;
            const value = input.value;
            input.value = value.substring(0, start) + text + value.substring(start);
            input.focus();
            updatePreview();
        }

        // ===== 清空文本框 =====
        function clearTextarea() {
            if (confirm('確定要清空所有文本嗎？')) {
                document.getElementById('detailInput').value = '';
                updatePreview();
            }
        }

        // ===== 清空表单 =====
        function clearForm() {
            document.getElementById('editorContent').innerHTML = '<div class="empty-state">選擇左側的項目開始編輯</div>';
            document.getElementById('editorTitle').textContent = '選擇分類和項目開始編輯';
            document.getElementById('editorSub').textContent = '';
        }

        // ===== 更新预览 =====
        function updatePreview() {
            const detail = document.getElementById('detailInput')?.value || '';
            
            // 解析格式化代码
            let displayText = detail;
            
            // 处理换行
            displayText = displayText.replace(/\/n/g, '\n');
            
            // 处理粗体
            displayText = displayText.replace(/\{bold\}([\s\S]*?)\{\/bold\}/g, '<b>$1</b>');
            
            // 处理斜体
            displayText = displayText.replace(/\{italic\}([\s\S]*?)\{\/italic\}/g, '<i>$1</i>');
            
            // 处理颜色
            displayText = displayText.replace(/\{#ff6b6b\}([\s\S]*?)\{\/color\}/g, '<span style="color: #ff6b6b;">$1</span>');
            displayText = displayText.replace(/\{#0066cc\}([\s\S]*?)\{\/color\}/g, '<span style="color: #0066cc;">$1</span>');
            displayText = displayText.replace(/\{#00aa00\}([\s\S]*?)\{\/color\}/g, '<span style="color: #00aa00;">$1</span>');
            
            const previewArea = document.getElementById('previewArea');
            const previewDiv = document.getElementById('preview');
            const formatHint = document.getElementById('formatHint');
            
            if (detail.trim()) {
                previewDiv.innerHTML = displayText;
                previewDiv.style.display = 'block';
                formatHint.style.display = 'none';
            } else {
                previewDiv.style.display = 'none';
                formatHint.style.display = 'block';
            }
        }

        // ===== 保存本地 =====
        function saveLocal() {
            if (currentCategory === null || currentItem === null) {
                alert('請先選擇一個項目');
                return;
            }

            const key = `${currentCategory}-${currentItem}`;
            const detail = document.getElementById('detailInput')?.value || '';

            localData[key] = { detail };
            localStorage.setItem('other-editor-modifications', JSON.stringify(localData));
            modifiedItems.add(key);
            updateDraftBadge();
            alert('✅ 已保存到瀏覽器');
        }

        // ===== 更新草稿标记 =====
        function updateDraftBadge() {
            const count = modifiedItems.size;
            const badge = document.getElementById('draftCount');
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'block';
                document.getElementById('topBar').classList.add('has-unsaved');
            } else {
                badge.style.display = 'none';
                document.getElementById('topBar').classList.remove('has-unsaved');
            }
        }

        // ===== 上传模态框 =====
        function showUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            document.getElementById('patInput').value = '';
        }

        // ===== 上传到 GitHub =====
        async function uploadToGithub() {
            let pat = document.getElementById('patInput').value;
            if (!pat) {
                pat = localStorage.getItem('github-pat');
            }

            if (!pat) {
                alert('❌ 請輸入 GitHub PAT');
                return;
            }

            localStorage.setItem('github-pat', pat);
            alert('✅ PAT 已保存。上傳功能正在開發中。');
            closeUploadModal();
        }

        // 页面加载时初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
