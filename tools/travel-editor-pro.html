<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏔️ 體驗編輯器 - 簡化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }

        .top-bar {
            background: #fff;
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        button:hover {
            background: #0056b3;
        }

        .layout {
            display: grid;
            grid-template-columns: 200px 1fr 350px;
            gap: 1px;
            background: #ddd;
            overflow: hidden;
        }

        .sidebar {
            background: white;
            overflow-y: auto;
            padding: 12px;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .item {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 4px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s;
        }

        .item:hover {
            background: #f9f9f9;
            border-color: #bbb;
        }

        .item.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .editor {
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .editor-header h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .editor-header p {
            font-size: 12px;
            color: #999;
        }

        .editor-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: white;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .toolbar button {
            padding: 6px 10px;
            font-size: 12px;
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        .toolbar button:hover {
            background: #e0e0e0;
        }

        .right-panel {
            background: white;
            border-left: 1px solid #ddd;
            padding: 16px;
            overflow-y: auto;
        }

        .right-panel-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .preview {
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 8px 0;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }

        .nav-btn.active {
            color: #007bff;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 頂部導航 -->
        <div class="top-bar">
            <h1>📝 體驗編輯器 v3.0</h1>
            <div class="button-group">
                <button onclick="saveLocal()">💾 本地保存</button>
            </div>
        </div>

        <!-- 主編輯區域 -->
        <div style="display: flex; flex-direction: column; overflow: hidden;">
            <div class="layout">
                <!-- 左側：分類和項目 -->
                <div class="sidebar">
                    <div class="sidebar-title">📂 分類</div>
                    <div id="categoriesList">
                        <div class="item">載入中...</div>
                    </div>
                </div>

                <!-- 中間：編輯器 -->
                <div class="editor">
                    <div class="editor-header">
                        <h2 id="editorTitle">選擇一個項目開始編輯</h2>
                        <p id="editorSub"></p>
                    </div>
                    <div class="editor-content">
                        <div class="toolbar">
                            <button onclick="insertMarkup('{bold}', '{/bold}')">B 粗體</button>
                            <button onclick="insertMarkup('{italic}', '{/italic}')">I 斜體</button>
                            <button onclick="insertMarkup('\n', '')">/n 換行</button>
                            <button onclick="insertMarkup('{#ff6b6b}', '{/color}')">🔴 紅</button>
                            <button onclick="insertMarkup('{#0066cc}', '{/color}')">🔵 藍</button>
                            <button onclick="insertMarkup('{#00aa00}', '{/color}')">🟢 綠</button>
                        </div>
                        <textarea id="contentInput" placeholder="在這裡編輯..."></textarea>
                    </div>
                </div>

                <!-- 右側：預覽 -->
                <div class="right-panel">
                    <div class="right-panel-title">✨ 預覽</div>
                    <div class="preview" id="previewArea">
                        <p style="color: #999; font-size: 12px;">選擇項目後,預覽會顯示在這裡</p>
                    </div>
                </div>
            </div>

            <!-- 底部導航 -->
            <div class="bottom-nav">
                <button class="nav-btn active">行程</button>
                <button class="nav-btn">體驗</button>
                <button class="nav-btn">工具</button>
                <button class="nav-btn">費用</button>
                <button class="nav-btn">偏好</button>
            </div>
        </div>
    </div>

    <script>
        // 簡單的編輯器數據（不依賴外部文件）
        let editorData = {
            '分類1': ['項目1', '項目2', '項目3'],
            '分類2': ['項目A', '項目B'],
            '分類3': ['項目Ⅰ', '項目Ⅱ', '項目Ⅲ', '項目Ⅳ']
        };

        let itemContent = {};
        let currentCategory = null;
        let currentItem = null;

        // 初始化
        function init() {
            console.log('編輯器初始化...');
            renderCategories();
            loadContentFromStorage();
            document.getElementById('contentInput').addEventListener('input', updatePreview);
        }

        // 渲染分類列表
        function renderCategories() {
            const list = document.getElementById('categoriesList');
            list.innerHTML = '';
            
            Object.keys(editorData).forEach(cat => {
                const catDiv = document.createElement('div');
                catDiv.className = 'item';
                catDiv.textContent = `📁 ${cat}`;
                catDiv.onclick = () => selectCategory(cat);
                list.appendChild(catDiv);

                editorData[cat].forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item';
                    itemDiv.style.marginLeft = '10px';
                    itemDiv.style.fontSize = '12px';
                    itemDiv.textContent = `  📄 ${item}`;
                    itemDiv.onclick = (e) => {
                        e.stopPropagation();
                        selectItem(cat, item);
                    };
                    list.appendChild(itemDiv);
                });
            });
        }

        // 選擇分類
        function selectCategory(cat) {
            currentCategory = cat;
            currentItem = null;
            document.getElementById('editorTitle').textContent = `分類: ${cat}`;
            document.getElementById('editorSub').textContent = '';
            document.getElementById('contentInput').value = '';
            updatePreview();
        }

        // 選擇項目
        function selectItem(cat, item) {
            currentCategory = cat;
            currentItem = item;
            const key = `${cat}/${item}`;
            document.getElementById('editorTitle').textContent = item;
            document.getElementById('editorSub').textContent = `來自 ${cat}`;
            document.getElementById('contentInput').value = itemContent[key] || '';
            updatePreview();
        }

        // 更新預覽
        function updatePreview() {
            const content = document.getElementById('contentInput').value;
            if (currentItem) {
                const key = `${currentCategory}/${currentItem}`;
                itemContent[key] = content;
            }
            document.getElementById('previewArea').textContent = content;
        }

        // 插入標記
        function insertMarkup(start, end) {
            const textarea = document.getElementById('contentInput');
            const start_pos = textarea.selectionStart;
            const end_pos = textarea.selectionEnd;
            const text = textarea.value;
            const selected = text.substring(start_pos, end_pos);
            const before = text.substring(0, start_pos);
            const after = text.substring(end_pos);
            textarea.value = before + start + selected + end + after;
            updatePreview();
        }

        // 本地保存
        function saveLocal() {
            localStorage.setItem('travel-editor-data', JSON.stringify(itemContent));
            alert('✅ 已保存到瀏覽器！');
        }

        // 從存儲加載
        function loadContentFromStorage() {
            const saved = localStorage.getItem('travel-editor-data');
            if (saved) {
                itemContent = JSON.parse(saved);
            }
        }

        // 頁面加載時初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
