<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>體驗編輯器 Pro</title>
<!-- 版面與程式都在共用核心，本檔只是外殼。修 bug 請改 catalog-editor-core.js，
     不要再像 v1.0 那樣把同一份程式複製兩遍。 -->
<link rel="stylesheet" href="catalog-editor-core.css">
</head>
<body>
<div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="editor" id="editor">
        <div class="empty-state">請在左側選擇一個分類開始編輯</div>
    </div>
    <div class="preview-panel" id="previewPanel">
        <div class="preview-title">📝 即時預覽</div>
        <div id="previewContent" style="color:#999;font-size:12px;">（選擇分類查看預覽）</div>
    </div>
</div>

<div class="editor-top-bar" id="topBar" style="display:none;">
    <div class="editor-scope" id="scopeBadge">…</div>
    <div id="draftBadge" class="draft-badge" style="display:none;">0 個草稿</div>
    <button class="btn btn-secondary" onclick="discardChanges()">放棄</button>
    <button class="btn btn-primary" onclick="saveLocally()">💾 本地保存</button>
    <button class="btn btn-success" id="uploadBtn" onclick="startUpload()" style="display:none;">⬆️ 上傳到GitHub</button>
</div>

<!-- 照片上傳進度（固定在右下角，重繪編輯區不會清掉） -->
<div id="uploadProgress"></div>

<!-- 圖片挑選器 Modal -->
<div class="modal-overlay" id="imgModal">
    <div class="modal-box">
        <h3>
            選擇圖片（images/catalog/）
            <button class="btn btn-secondary btn-mini" onclick="refreshImageList()" style="margin-left:8px;">🔄 重新整理清單</button>
        </h3>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <div id="imgModalStatus" style="font-size:11px;color:#999;">載入中...</div>
            <div class="filter-seg" id="imgFilterSeg">
                <button data-mode="unused" class="active" onclick="setImgFilter('unused')">未使用</button>
                <button data-mode="here" onclick="setImgFilter('here')">本頁已用</button>
                <button data-mode="all" onclick="setImgFilter('all')">全部</button>
            </div>
        </div>
        <div class="modal-grid" id="imgModalGrid"></div>
        <div class="modal-manual" id="imgModalManual" style="display:none;">
            <input type="text" id="imgManualInput" placeholder="手動輸入檔名（例如 skyr-01.webp）">
            <button class="btn btn-primary btn-mini" onclick="confirmManualImage()">確定</button>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeImgModal()">取消</button>
        </div>
    </div>
</div>

<!-- 上傳前確認 Modal -->
<div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
        <h3>確認上傳</h3>
        <div class="diff-summary" id="diffSummary"></div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeUploadModal()">取消</button>
            <button class="btn btn-success" onclick="confirmUpload()">確認上傳</button>
        </div>
    </div>
</div>

<script>
    // 本編輯器與另一個編輯器的差異全部集中在這裡。
    window.EDITOR_CONFIG = {
        file:     'data/travel-content.js',
        varName:  'TRAVEL_CONTENT',
        draftKey: 'travel_content_drafts',
        label:    '體驗內容',
        scope:    '體驗頁',
        peer: {
            file:     'data/other-content.js',
            varName:  'OTHER_CONTENT',
            draftKey: 'other_content_drafts',
            scope:    '工具頁'
        }
    };
</script>
<script src="catalog-editor-core.js"></script>
</body>
</html>
