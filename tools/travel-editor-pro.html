<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏔️ 體驗編輯器 Pro - 導入真實網站數據</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .layout {
            display: grid;
            grid-template-columns: 240px 1fr 400px;
            height: 100vh;
            gap: 1px;
            background: #ddd;
        }

        .sidebar {
            background: white;
            overflow-y: auto;
            padding: 14px;
            border-right: 1px solid #e5e5e5;
        }

        .sidebar-title {
            font-size: 10px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .category-btn, .item-btn {
            display: block;
            width: 100%;
            padding: 9px 11px;
            margin-bottom: 4px;
            border: 1px solid #e5e5e5;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-btn:hover, .item-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .category-btn.active, .item-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
            font-weight: 600;
        }

        .item-btn.modified::after {
            content: ' ●';
            color: #ff6b6b;
            font-weight: 700;
        }

        .items-container {
            padding-left: 14px;
            margin-top: 5px;
            max-height: 400px;
            overflow-y: auto;
        }

        .editor {
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .editor-top-bar {
            position: fixed;
            top: 0;
            left: 241px;
            right: 401px;
            height: 50px;
            background: white;
            border-bottom: 2px solid #667eea;
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .editor-top-bar.has-unsaved {
            border-bottom-color: #ff6b6b;
            background: #fffbfb;
        }

        .draft-badge {
            background: #ff6b6b;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            min-width: 30px;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: #333;
            transition: all 0.2s;
        }

        button:hover {
            border-color: #667eea;
            color: #667eea;
        }

        button.primary {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        button.primary:hover {
            background: #5568d3;
        }

        .editor-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
            margin-top: 50px;
        }

        .editor-header h2 {
            font-size: 16px;
            color: #333;
        }

        .editor-header p {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .loading-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            min-height: 120px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
        }

        .format-toolbar {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            padding: 8px;
            background: #f9f9f9;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
        }

        .format-btn {
            padding: 6px 8px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            transition: all 0.2s;
            min-width: 32px;
        }

        .format-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .preview {
            background: #f9f9f9;
            padding: 12px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }

        .preview-label {
            font-size: 10px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .preview-content {
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .right-panel {
            background: white;
            padding: 16px;
            overflow-y: auto;
            border-left: 1px solid #e5e5e5;
        }

        .right-panel-title {
            font-size: 12px;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
        }

        .status-info {
            font-size: 11px;
            color: #666;
            line-height: 1.6;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .status-info strong {
            color: #333;
        }

        .error-message {
            background: #ffe5e5;
            color: #d32f2f;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .success-message {
            background: #e5ffe5;
            color: #1b8a1b;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-content h3 {
            margin-bottom: 16px;
            font-size: 14px;
        }

        .modal-content input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .modal-footer {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-title">📂 加載中...</div>
            <div id="categories"></div>
        </div>

        <!-- 编辑区域 -->
        <div class="editor">
            <div class="editor-top-bar" id="topBar">
                <div>
                    <span id="draftCount" class="draft-badge" style="display: none;">0</span>
                </div>
                <div class="button-group">
                    <button onclick="saveLocal()" class="primary">💾 本地保存</button>
                </div>
            </div>

            <div class="editor-header">
                <h2 id="editorTitle">加載中...</h2>
                <p id="editorSub"></p>
            </div>

            <div class="editor-content" id="editorContent">
                <div class="loading-state">正在從網站導入真實數據...</div>
            </div>
        </div>

        <!-- 右侧预览 -->
        <div class="right-panel">
            <div class="right-panel-title">ℹ️ 資訊</div>
            <div id="statusArea">
                <div class="loading-state">加載中...</div>
            </div>
        </div>
    </div>

    <script>
        // ===== 全局状态 =====
        let travelData = {}; // 从网站导入的真实数据
        let currentCategory = null;
        let currentItem = null;
        let modifiedItems = new Set();
        let localData = {};

        // ===== 初始化 =====
        async function init() {
            console.log('开始导入网站数据...');
            loadLocalData();
            await importWebsiteData();
            renderCategories();
            updateStatus();
        }

        // ===== 加载本地修改 =====
        function loadLocalData() {
            const saved = localStorage.getItem('travel-editor-modifications');
            if (saved) {
                try {
                    localData = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to load local data:', e);
                }
            }
        }

        // ===== 从网站导入真实数据 =====
        async function importWebsiteData() {
            try {
                // 获取网站的 travel-content.js
                const response = await fetch('https://raw.githubusercontent.com/fisherchang01/2026iceland/main/data/travel-content.js');
                const jsContent = await response.text();

                // 提取 HTML 内容
                const htmlMatch = jsContent.match(/const TRAVEL_HTML = `([\s\S]*)`/);
                if (!htmlMatch) {
                    throw new Error('无法提取 TRAVEL_HTML');
                }

                const htmlContent = htmlMatch[1];
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');

                // 解析所有分类
                const collapses = doc.querySelectorAll('.travel-collapse');
                console.log(`找到 ${collapses.length} 个分类`);

                collapses.forEach((collapse, index) => {
                    const emoji = collapse.querySelector('.travel-collapse-emoji')?.textContent || '📌';
                    const title = collapse.querySelector('.travel-collapse-title')?.textContent || '';
                    const sub = collapse.querySelector('.travel-collapse-sub')?.textContent || '';
                    const cover = collapse.getAttribute('data-cover') || '';

                    const items = [];
                    const itemCards = collapse.querySelectorAll('.item-card');
                    
                    itemCards.forEach((card) => {
                        const itemTitle = card.querySelector('.item-card-title')?.textContent || '';
                        const itemDetail = card.querySelector('.item-detail p')?.innerHTML || '';
                        
                        items.push({
                            title: itemTitle,
                            detail: itemDetail,
                            rawDetail: card.querySelector('.item-detail p')?.textContent || ''
                        });
                    });

                    // 使用 index 作为 key，因为分类没有 ID
                    const catKey = `cat_${index}`;
                    travelData[catKey] = {
                        emoji,
                        title,
                        sub,
                        cover,
                        items
                    };

                    console.log(`分类 ${index}: ${title} (${items.length} 项)`);
                });

                console.log('✅ 数据导入成功！');
                return true;
            } catch (error) {
                console.error('❌ 导入失败:', error);
                document.getElementById('editorContent').innerHTML = `<div class="error-message">❌ 导入网站数据失败：${error.message}</div>`;
                return false;
            }
        }

        // ===== 更新状态信息 =====
        function updateStatus() {
            const catCount = Object.keys(travelData).length;
            const itemCount = Object.values(travelData).reduce((sum, cat) => sum + cat.items.length, 0);
            const modCount = modifiedItems.size;

            document.getElementById('statusArea').innerHTML = `
                <div class="status-info">
                    <strong>✅ 數據已導入</strong><br>
                    分類數: ${catCount}<br>
                    項目總數: ${itemCount}<br>
                    已修改: ${modCount}
                </div>
                <div style="font-size: 11px; color: #666; line-height: 1.6;">
                    <p>📌 <strong>使用方式：</strong></p>
                    <p>1. 左側選擇分類</p>
                    <p>2. 選擇要編輯的項目</p>
                    <p>3. 在中間編輯項目詳情</p>
                    <p>4. 點擊「💾 本地保存」</p>
                    <p>5. 點擊「⬆️ 上傳到 GitHub」</p>
                </div>
            `;
        }

        // ===== 渲染分类 =====
        function renderCategories() {
            const container = document.getElementById('categories');
            container.innerHTML = '<div class="sidebar-title">📂 分類</div>';

            const sortedKeys = Object.keys(travelData).sort((a, b) => {
                return parseInt(a.split('_')[1]) - parseInt(b.split('_')[1]);
            });

            sortedKeys.forEach(key => {
                const catData = travelData[key];
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.textContent = `${catData.emoji} ${catData.title}`;
                btn.onclick = () => selectCategory(key);
                container.appendChild(btn);
            });
        }

        // ===== 选择分类 =====
        function selectCategory(catKey) {
            currentCategory = catKey;
            currentItem = null;
            renderItems();
            clearForm();
        }

        // ===== 渲染项目 =====
        function renderItems() {
            const catData = travelData[currentCategory];
            const container = document.getElementById('categories').parentElement;
            
            // 更新分类按钮样式
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.includes(catData.title)) {
                    btn.classList.add('active');
                }
            });

            // 清空并渲染项目
            const itemsContainer = document.querySelector('.items-container');
            if (itemsContainer) itemsContainer.remove();

            const newItemsContainer = document.createElement('div');
            newItemsContainer.className = 'items-container';

            catData.items.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'item-btn';
                btn.textContent = item.title;
                const key = `${currentCategory}-${index}`;
                if (modifiedItems.has(key)) {
                    btn.classList.add('modified');
                }
                btn.onclick = () => selectItem(index);
                newItemsContainer.appendChild(btn);
            });

            document.querySelector('.sidebar').appendChild(newItemsContainer);
        }

        // ===== 选择项目 =====
        function selectItem(index) {
            currentItem = index;
            renderForm();
        }

        // ===== 渲染编辑表单 =====
        function renderForm() {
            const catData = travelData[currentCategory];
            const item = catData.items[currentItem];
            const key = `${currentCategory}-${currentItem}`;
            const savedData = localData[key] || {};

            document.getElementById('editorTitle').textContent = item.title;
            document.getElementById('editorSub').textContent = catData.sub || '';

            const content = document.getElementById('editorContent');
            content.innerHTML = `
                <div class="form-group">
                    <label>所屬分類</label>
                    <input type="text" value="${catData.title}" readonly>
                </div>

                <div class="form-group">
                    <label>項目標題</label>
                    <input type="text" value="${item.title}" readonly>
                </div>

                <div class="form-group">
                    <label>項目詳情</label>
                    <div class="format-toolbar">
                        <button class="format-btn" onclick="insertText('detailInput', '\\n')">換行</button>
                        <button class="format-btn" onclick="insertText('detailInput', '\\n\\n')">分段</button>
                    </div>
                    <textarea id="detailInput" oninput="updatePreview()">${savedData.detail || item.rawDetail}</textarea>
                </div>
            `;

            updatePreview();
        }

        // ===== 清空表单 =====
        function clearForm() {
            document.getElementById('editorContent').innerHTML = '<div class="empty-state">選擇左側的項目開始編輯</div>';
            document.getElementById('editorTitle').textContent = '選擇分類和項目開始編輯';
            document.getElementById('editorSub').textContent = '';
        }

        // ===== 插入文本 =====
        function insertText(inputId, text) {
            const input = document.getElementById(inputId);
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const value = input.value;
            input.value = value.substring(0, start) + text + value.substring(end);
            input.focus();
            updatePreview();
        }

        // ===== 更新预览 =====
        function updatePreview() {
            const detail = document.getElementById('detailInput')?.value || '';
            const preview = `
                <div class="preview-label">項目詳情預覽</div>
                <div class="preview-content">${escapeHtml(detail)}</div>
            `;
            document.getElementById('statusArea').innerHTML = preview;
        }

        // ===== 转义 HTML =====
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // ===== 保存本地 =====
        function saveLocal() {
            if (currentCategory === null || currentItem === null) {
                alert('請先選擇一個項目');
                return;
            }

            const key = `${currentCategory}-${currentItem}`;
            const detail = document.getElementById('detailInput')?.value || '';

            localData[key] = { detail };
            localStorage.setItem('travel-editor-modifications', JSON.stringify(localData));
            modifiedItems.add(key);
            updateDraftBadge();
            updateStatus();
            alert('✅ 已保存到瀏覽器');
        }

        // ===== 更新草稿标记 =====
        function updateDraftBadge() {
            const count = modifiedItems.size;
            const badge = document.getElementById('draftCount');
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'block';
                document.getElementById('topBar').classList.add('has-unsaved');
            } else {
                badge.style.display = 'none';
                document.getElementById('topBar').classList.remove('has-unsaved');
            }
        }

        // 页面加载时初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
