<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>體驗編輯器 Pro</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        height: 100vh;
        overflow: hidden;
    }
    .layout {
        display: grid;
        grid-template-columns: 260px 1fr 340px;
        height: 100vh;
        gap: 1px;
        background: #ddd;
    }
    .sidebar { background: white; overflow-y: auto; padding: 12px; }
    .sidebar-title {
        font-size: 11px; font-weight: 700; color: #999;
        text-transform: uppercase; margin-bottom: 10px; letter-spacing: .5px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .cat-btn {
        display: block; width: 100%; padding: 8px 10px; margin-bottom: 4px;
        border: 1px solid #e5e5e5; background: white; border-radius: 4px;
        cursor: pointer; text-align: left; font-size: 12px; font-weight: 500;
        color: #333; transition: all .2s;
    }
    .cat-btn .cat-meta { font-size: 10px; color: #999; margin-top: 2px; }
    .cat-btn:hover { border-color: #667eea; background: #f5f7ff; }
    .cat-btn.active { background: #667eea; color: white; border-color: #667eea; }
    .cat-btn.active .cat-meta { color: #dde0ff; }
    .cat-btn.modified::after { content: ' ●'; color: #ff6b6b; font-weight: 700; }
    .cat-btn.empty-cat { opacity: .65; }
    .add-cat-btn {
        display: block; width: 100%; padding: 8px 10px; margin-top: 8px;
        border: 1px dashed #999; background: white; border-radius: 4px;
        cursor: pointer; font-size: 12px; color: #666;
    }
    .add-cat-btn:hover { border-color: #667eea; color: #667eea; }

    .editor { background: white; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .editor-top-bar {
        position: fixed; top: 0; left: 261px; right: 341px; height: 50px; background: white;
        border-bottom: 2px solid #667eea; display: flex; gap: 10px; justify-content: flex-end;
        align-items: center; padding: 8px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1); z-index: 100;
    }
    .editor-top-bar.has-unsaved { border-bottom-color: #ff6b6b; background: #fffbfb; }
    .draft-badge {
        background: #ff6b6b; color: white; padding: 4px 8px; border-radius: 12px;
        font-size: 10px; font-weight: 700; min-width: 30px; text-align: center;
    }
    .editor-header { padding: 12px 16px; border-bottom: 1px solid #e5e5e5; flex-shrink: 0; margin-top: 50px; }
    .editor-header h2 { font-size: 18px; color: #333; display: flex; align-items: center; gap: 10px; }
    .editor-content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field-group { flex: 1; }
    .field-label { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: .5px; }
    .field-group input, .field-group select, .field-group textarea {
        padding: 8px 10px; border: 1px solid #d0d0d0; border-radius: 4px;
        font-size: 12px; font-family: monospace;
    }
    .field-group textarea { min-height: 60px; resize: vertical; white-space: pre-wrap; }
    .field-group input:focus, .field-group select:focus, .field-group textarea:focus {
        outline: none; border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,.1);
    }

    .cover-picker { display: flex; align-items: center; gap: 10px; }
    .cover-thumb {
        width: 64px; height: 64px; border-radius: 4px; object-fit: cover;
        border: 1px solid #d0d0d0; background: #eee;
    }

    .section-title {
        font-size: 13px; font-weight: 700; color: #333; margin-top: 4px;
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid #eee; padding-bottom: 6px;
    }

    .item-block {
        border: 1px solid #d8d8d8; border-radius: 6px; padding: 10px; margin-bottom: 14px;
        box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .item-block:nth-of-type(odd) { background: #f4f6fc; border-left: 4px solid #a9b4ef; }
    .item-block:nth-of-type(even) { background: #fdf9f0; border-left: 4px solid #e8cf9a; }
    .item-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .item-block-title { font-size: 12px; font-weight: 700; color: #444; }
    .item-block-actions { display: flex; gap: 4px; }

    .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; transition: all .2s; white-space: nowrap; }
    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover { background: #5568d3; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #e5e5e5; color: #333; }
    .btn-secondary:hover { background: #d0d0d0; }
    .btn-success { background: #28a745; color: white; }
    .btn-success:hover { background: #218838; }
    .btn-danger { background: #ff6b6b; color: white; }
    .btn-danger:hover { background: #e85555; }
    .btn-mini { padding: 3px 7px; font-size: 10px; }

    .markup-toolbar { display: flex; gap: 4px; }
    .mini-btn {
        padding: 4px 8px; border: 1px solid #d0d0d0; background: white; border-radius: 3px;
        cursor: pointer; font-size: 11px; font-weight: 500; transition: all .2s;
    }
    .mini-btn:hover { background: #f5f5f5; border-color: #999; }
    .color-btn {
        padding: 4px 6px; border: 1px solid #d0d0d0; background: white; border-radius: 3px;
        cursor: pointer; font-size: 10px; font-weight: 700; color: white; width: 20px; height: 20px;
        display: flex; align-items: center; justify-content: center; transition: all .2s;
    }
    .color-btn.red { background: #ff0000; border-color: #cc0000; }
    .color-btn.blue { background: #0066cc; border-color: #0052a3; }
    .color-btn.green { background: #00aa00; border-color: #008800; }
    .color-btn:hover { transform: scale(1.1); box-shadow: 0 2px 4px rgba(0,0,0,.2); }

    .blocks-list { display: flex; flex-direction: column; gap: 8px; }
    .block-row {
        border: 1px solid #e0e0e0; border-radius: 4px; padding: 8px; background: white;
        display: flex; flex-direction: column; gap: 6px;
    }
    .block-row-head { display: flex; justify-content: space-between; align-items: center; }
    .block-type-badge {
        font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 10px;
        background: #eef; color: #556; letter-spacing: .5px;
    }
    .block-type-badge.raw { background: #f5e6c8; color: #8a6d1a; }
    .block-row textarea {
        width: 100%; min-height: 150px; padding: 8px 10px; border: 1px solid #d0d0d0;
        border-radius: 4px; font-size: 12px; font-family: monospace; resize: vertical;
    }
    .block-img-preview { display: flex; align-items: center; gap: 8px; }
    .block-img-preview img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
    .raw-block-note { font-size: 11px; color: #8a6d1a; font-style: italic; }

    .add-block-bar { display: flex; gap: 6px; margin-top: 6px; }

    .preview-panel { background: #f9f9f9; border-left: 1px solid #e5e5e5; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .preview-title { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: .5px; }
    .preview-card { background: white; border: 1px solid #e5e5e5; border-radius: 6px; padding: 10px; }
    .preview-card h4 { font-size: 12px; margin-bottom: 6px; }
    .preview-card p { font-size: 11px; line-height: 1.6; color: #333; white-space: pre-line; margin-bottom: 6px; }
    .preview-card img { max-width: 100%; border-radius: 4px; margin-bottom: 6px; }

    .empty-state { text-align: center; padding: 40px 20px; color: #999; font-size: 12px; }

    .notification {
        position: fixed; top: 80px; right: 20px; padding: 12px 16px; border-radius: 4px;
        font-size: 12px; background: #d4edda; color: #155724; box-shadow: 0 2px 8px rgba(0,0,0,.1); z-index: 999;
    }
    .notification.error { background: #f8d7da; color: #721c24; }

    .modal-overlay {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
        z-index: 500; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
        background: white; border-radius: 8px; padding: 16px; width: 640px; max-height: 80vh;
        overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-box h3 { font-size: 14px; }
    .modal-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .modal-grid .thumb-wrap { position: relative; }
    .modal-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; display: block; }
    .modal-grid img:hover { border-color: #667eea; }
    .modal-grid .fname { font-size: 9px; color: #666; text-align: center; word-break: break-all; }
    .used-badge {
        position: absolute; top: 3px; right: 3px; background: rgba(80,80,80,.85); color: white;
        font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; pointer-events: none;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-manual { display: flex; gap: 6px; }
    .modal-manual input { flex: 1; padding: 6px 8px; border: 1px solid #d0d0d0; border-radius: 4px; }

    .diff-summary { background: #f5f7ff; border: 1px solid #cdd4f5; border-radius: 6px; padding: 12px; font-size: 12px; line-height: 1.8; }
</style>
</head>
<body>
<div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="editor" id="editor">
        <div class="empty-state">請在左側選擇一個分類開始編輯</div>
    </div>
    <div class="preview-panel" id="previewPanel">
        <div class="preview-title">📝 即時預覽</div>
        <div id="previewContent" style="color:#999;font-size:12px;">（選擇分類查看預覽）</div>
    </div>
</div>

<div class="editor-top-bar" id="topBar" style="display:none;">
    <div id="draftBadge" class="draft-badge" style="display:none;">0 個草稿</div>
    <button class="btn btn-secondary" onclick="discardChanges()">放棄</button>
    <button class="btn btn-primary" onclick="saveLocally()">💾 本地保存</button>
    <button class="btn btn-success" id="uploadBtn" onclick="startUpload()" style="display:none;">⬆️ 上傳到GitHub</button>
</div>

<!-- 圖片挑選器 Modal -->
<div class="modal-overlay" id="imgModal">
    <div class="modal-box">
        <h3>
            選擇圖片（images/catalog/）
            <button class="btn btn-secondary btn-mini" onclick="refreshImageList()" style="margin-left:8px;">🔄 重新整理清單</button>
        </h3>
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div id="imgModalStatus" style="font-size:11px;color:#999;">載入中...</div>
            <label style="font-size:11px;color:#666;display:flex;align-items:center;gap:4px;cursor:pointer;">
                <input type="checkbox" id="imgOnlyUnused" onchange="renderImgGrid(imageListCache)"> 只看未使用
            </label>
        </div>
        <div class="modal-grid" id="imgModalGrid"></div>
        <div class="modal-manual" id="imgModalManual" style="display:none;">
            <input type="text" id="imgManualInput" placeholder="手動輸入檔名（例如 item-01.webp）">
            <button class="btn btn-primary btn-mini" onclick="confirmManualImage()">確定</button>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeImgModal()">取消</button>
        </div>
    </div>
</div>

<!-- 上傳前確認 Modal -->
<div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
        <h3>確認上傳</h3>
        <div class="diff-summary" id="diffSummary"></div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeUploadModal()">取消</button>
            <button class="btn btn-success" onclick="confirmUpload()">確認上傳</button>
        </div>
    </div>
</div>

<script>
    const GITHUB_OWNER = 'fisherchang01';
    const GITHUB_REPO = '2026iceland';
    const GITHUB_FILE = 'data/travel-content.js';
    const VAR_NAME = 'TRAVEL_CONTENT';
    const DRAFT_KEY = 'travel_content_drafts';
    const IMAGE_DIR = 'images/catalog/';
    const LABEL = '體驗內容';

    let travelData = null;      // 從 GitHub 載入的原始資料（未套用草稿）
    let originalCategoryCount = 0;
    let drafts = {};            // { [categoryKey]: 完整分類物件（草稿版本） }
    let currentKey = null;
    let imgModalTargetSetter = null; // 目前 modal 要填入哪個欄位的 callback
    let imageListCache = null;

    // ---------- 工具函式 ----------

    function utf8ToBase64(str) {
        try {
            return btoa(unescape(encodeURIComponent(str)));
        } catch (e) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            let binary = '';
            for (let i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
            return btoa(binary);
        }
    }

    // 與 js/render-travel.js 的 parseMarkup 同步實作（供編輯器預覽使用，htmlEscape 已內建）
    function parseMarkup(str) {
        if (!str) return '';
        let html = String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/\/n/g, '<br>')
            .replace(/\{#([0-9a-fA-F]{6})\}([\s\S]*?)\{\/color\}/g, '<span style="color:#$1">$2</span>')
            .replace(/\{bold\}([\s\S]*?)\{\/bold\}/g, '<strong>$1</strong>')
            .replace(/\{italic\}([\s\S]*?)\{\/italic\}/g, '<em>$1</em>');
        return html;
    }

    function escapeAttr(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function showNotif(msg, type = 'success') {
        const notif = document.createElement('div');
        notif.className = `notification ${type}`;
        notif.textContent = msg;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 4000);
    }

    function getPAT() {
        let pat = localStorage.getItem('github_pat');
        if (!pat) {
            pat = prompt('🔑 輸入 GitHub Personal Access Token');
            if (pat) localStorage.setItem('github_pat', pat);
            else throw new Error('需要 PAT');
        }
        return pat;
    }

    // ---------- 資料載入 ----------

    async function init() {
        await loadTravelData();
        loadDrafts();
        renderSidebar();
        updateDraftBadge();
    }

    async function loadTravelData() {
        try {
            const resp = await fetch(`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_FILE}`);
            if (!resp.ok) throw new Error('無法讀取 ' + GITHUB_FILE);
            const content = await resp.text();
            const marker = `const ${VAR_NAME} = `;
            const startIdx = content.indexOf(marker);
            if (startIdx < 0) throw new Error('找不到資料標記');
            const jsonStart = startIdx + marker.length;
            const endIdx = content.lastIndexOf('};'); // 必須是 lastIndexOf，不是 indexOf
            if (endIdx < jsonStart) throw new Error('檔案結構異常');
            const jsonStr = content.substring(jsonStart, endIdx + 1);
            travelData = JSON.parse(jsonStr);
            originalCategoryCount = travelData.categories.length;
        } catch (e) {
            console.error('載入失敗:', e);
            showNotif('載入失敗: ' + e.message, 'error');
        }
    }

    function loadDrafts() {
        const saved = localStorage.getItem(DRAFT_KEY);
        drafts = saved ? JSON.parse(saved) : {};
    }

    function saveDrafts() {
        localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts));
        updateDraftBadge();
    }

    function updateDraftBadge() {
        const count = Object.keys(drafts).length;
        const badge = document.getElementById('draftBadge');
        const uploadBtn = document.getElementById('uploadBtn');
        if (count > 0) {
            badge.textContent = `${count} 個草稿`;
            badge.style.display = 'block';
            uploadBtn.style.display = 'block';
            document.getElementById('topBar').classList.add('has-unsaved');
        } else {
            badge.style.display = 'none';
            uploadBtn.style.display = 'none';
            document.getElementById('topBar').classList.remove('has-unsaved');
        }
        document.getElementById('topBar').style.display = currentKey ? 'flex' : (count > 0 ? 'flex' : 'none');
    }

    // 取得某分類目前應顯示的資料（草稿優先，否則原始）
    function getCategory(key) {
        if (drafts[key]) return drafts[key];
        return travelData.categories.find(c => c.key === key);
    }

    function allCategoryKeysInOrder() {
        // 保留原始順序；新增的分類（不在 travelData 裡）附加在最後
        const orig = travelData.categories.map(c => c.key);
        const extra = Object.keys(drafts).filter(k => !orig.includes(k));
        return orig.concat(extra);
    }

    // ---------- Sidebar ----------

    function renderSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.innerHTML = '<div class="sidebar-title">📁 分類（共 ' + allCategoryKeysInOrder().length + ' 個）</div>';

        allCategoryKeysInOrder().forEach(key => {
            const cat = getCategory(key);
            const btn = document.createElement('button');
            btn.className = 'cat-btn';
            if (key === currentKey) btn.classList.add('active');
            if (drafts[key]) btn.classList.add('modified');
            if (!cat.items || cat.items.length === 0) btn.classList.add('empty-cat');
            btn.dataset.key = key;
            btn.innerHTML = `<span class="cat-label">${cat.emoji || ''} ${escapeAttr(cat.title || '(未命名)')}</span><div class="cat-meta">${(cat.items || []).length} 個項目 · ${cat.size || '2x2'}</div>`;
            btn.onclick = () => selectCategory(key);
            sidebar.appendChild(btn);
        });

        const addBtn = document.createElement('button');
        addBtn.className = 'add-cat-btn';
        addBtn.textContent = '+ 新增分類';
        addBtn.onclick = addCategory;
        sidebar.appendChild(addBtn);
    }

    function addCategory() {
        const key = prompt('輸入分類 key（英數，唯一，一旦建立不得更改）：');
        if (!key) return;
        if (allCategoryKeysInOrder().includes(key)) {
            showNotif('key 已存在，請換一個', 'error');
            return;
        }
        const title = prompt('輸入分類標題：') || key;
        drafts[key] = {
            key: key,
            emoji: '🆕',
            title: title,
            sub: '',
            cover: '',
            size: '2x2',
            items: []
        };
        saveDrafts();
        renderSidebar();
        selectCategory(key);
        showNotif('已新增分類（尚未上傳）', 'success');
    }

    function deleteCategory(key) {
        if (!confirm(`確定刪除分類「${key}」？此動作在上傳前皆可用「放棄」復原。`)) return;
        // 用一個特殊標記表示「已刪除」，上傳時會被過濾掉
        drafts[key] = { __deleted: true, key: key };
        saveDrafts();
        if (currentKey === key) clearEditor();
        renderSidebar();
    }

    // ---------- Editor：分類欄位 + 項目 + Block ----------

    function selectCategory(key) {
        currentKey = key;
        renderSidebar();
        renderEditor();
    }

    function clearEditor() {
        currentKey = null;
        document.getElementById('editor').innerHTML = '<div class="empty-state">請選擇一個分類開始編輯</div>';
        document.getElementById('previewContent').innerHTML = '（選擇分類查看預覽）';
        updateDraftBadge();
    }

    function mutateCurrentCategory(mutator) {
        const cat = JSON.parse(JSON.stringify(getCategory(currentKey))); // deep clone
        mutator(cat);
        drafts[currentKey] = cat;
        saveDrafts();
        renderSidebar();
        renderEditor();
    }

    // 輕量更新：只改資料 + localStorage + 側欄／預覽的局部更新，
    // 不重繪輸入欄位本身的 DOM，避免打字或按標記按鈕時游標、捲動位置被重置。
    // 用於「連續輸入」的欄位（分類 emoji/title/sub、項目 name、文字段內容）；
    // 結構性變動（新增/刪除/搬移項目或 block、分類 CRUD）仍走 mutateCurrentCategory 整體重繪。
    function updateDraftField(mutator) {
        if (!drafts[currentKey]) {
            drafts[currentKey] = JSON.parse(JSON.stringify(getCategory(currentKey)));
        }
        mutator(drafts[currentKey]);
        localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts));
        updateDraftBadge();
        refreshSidebarEntry(currentKey);
        updateFullPreview();
    }

    function refreshSidebarEntry(key) {
        const cat = getCategory(key);
        if (!cat) return;
        const btn = document.querySelector(`.cat-btn[data-key="${CSS.escape(key)}"]`);
        if (!btn) return;
        btn.classList.toggle('modified', !!drafts[key]);
        btn.classList.toggle('empty-cat', !(cat.items && cat.items.length));
        const label = btn.querySelector('.cat-label');
        if (label) label.textContent = `${cat.emoji || ''} ${cat.title || '(未命名)'}`;
        const meta = btn.querySelector('.cat-meta');
        if (meta) meta.textContent = `${(cat.items || []).length} 個項目 · ${cat.size || '2x2'}`;
    }

    function updateHeaderLive() {
        const cat = getCategory(currentKey);
        if (!cat) return;
        const emojiEl = document.getElementById('hdr_emoji');
        const titleEl = document.getElementById('hdr_title');
        if (emojiEl) emojiEl.textContent = cat.emoji || '';
        if (titleEl) titleEl.textContent = cat.title || '';
    }

    function renderEditor() {
        const cat = getCategory(currentKey);
        if (!cat) { clearEditor(); return; }

        const editor = document.getElementById('editor');
        editor.innerHTML = `
            <div class="editor-header">

    function moveItem(idx, dir) {
        mutateCurrentCategory(cat => {
            const j = idx + dir;
            if (j < 0 || j >= cat.items.length) return;
            const tmp = cat.items[idx];
            cat.items[idx] = cat.items[j];
            cat.items[j] = tmp;
        });

        updateDraftField(cat => { cat.items[idx][field] = value; });

    function addBlock(itemIdx, type) {
        mutateCurrentCategory(cat => {
            const item = cat.items[itemIdx];
            if (!item.blocks) item.blocks = [];
            if (type === 'text') item.blocks.push({ type: 'text', value: '' });
            else if (type === 'img') item.blocks.push({ type: 'img', src: '' });
        });
    }

    function deleteBlock(itemIdx, bIdx) {
        mutateCurrentCategory(cat => { cat.items[itemIdx].blocks.splice(bIdx, 1); });
    }

    function moveBlock(itemIdx, bIdx, dir) {
        mutateCurrentCategory(cat => {
            const blocks = cat.items[itemIdx].blocks;
            const j = bIdx + dir;
            if (j < 0 || j >= blocks.length) return;
            const tmp = blocks[bIdx];
            blocks[bIdx] = blocks[j];
            blocks[j] = tmp;
        });
    }

    function onBlockTextInput(itemIdx, bIdx, value) {
        updateDraftField(cat => { cat.items[itemIdx].blocks[bIdx].value = value; });
    }

    // 文字標記格式（§8.6）：/n 換行、{bold}/{italic}/{#RRGGBB} color。
    // 插入邏輯與 trip-editor-pro.html 的 insertToField() 一致：以游標選取範圍為準，
    // 有選取文字時前後包住，沒有選取時在游標處插入空白標記。
    // onBlockTextInput 現在只做輕量資料更新（不重繪 DOM），所以這裡可以直接在原本的
    // textarea 節點上設定游標位置，插入後游標會停在剛插入內容之後，不會被搬到別處。
    function insertMarkup(fieldId, before, after, itemIdx, bIdx) {
        const field = document.getElementById(fieldId);
        if (!field) return;
        const start = field.selectionStart;
        const end = field.selectionEnd;
        const text = field.value;
        const selected = text.substring(start, end);
        const newValue = text.substring(0, start) + before + selected + after + text.substring(end);
        field.value = newValue;
        const cursorPos = start + before.length + selected.length + after.length;
        field.focus();
        field.setSelectionRange(cursorPos, cursorPos);
        onBlockTextInput(itemIdx, bIdx, newValue);
    }

    function applyColorMarkup(fieldId, hexColor, itemIdx, bIdx) {
        const hex = hexColor.replace('#', '');
        insertMarkup(fieldId, `{#${hex}}`, '{/color}', itemIdx, bIdx);
    }

    function setBlockImage(itemIdx, bIdx, filename) {
        mutateCurrentCategory(cat => { cat.items[itemIdx].blocks[bIdx].src = filename; });
    }

    // ---------- 圖片挑選器 ----------

    function openImgModal(setter) {
        imgModalTargetSetter = setter;
        document.getElementById('imgModal').classList.add('open');
        document.getElementById('imgModalGrid').innerHTML = '';
        document.getElementById('imgModalManual').style.display = 'none';
        document.getElementById('imgModalStatus').textContent = '載入中...';
        document.getElementById('imgOnlyUnused').checked = false;
        loadImageList();
    }

    function closeImgModal() {
        document.getElementById('imgModal').classList.remove('open');
        imgModalTargetSetter = null;
    }

    function refreshImageList() {
        imageListCache = null;
        document.getElementById('imgModalStatus').textContent = '重新載入中...';
        loadImageList();
    }

    // B-1：掃描目前記憶體中的資料（含未上傳的草稿，透過 buildFinalData() 取得草稿覆蓋後的有效狀態）
    // 找出所有正在被使用的圖片檔名：分類封面、img block、raw block（用正規式從 HTML 裡抓 images/catalog/xxx）
    function computeUsedImages() {
        const used = new Set();
        if (!travelData) return used;
        const effective = buildFinalData();
        effective.categories.forEach(cat => {
            if (cat.cover) used.add(cat.cover);
            (cat.items || []).forEach(it => {
                (it.blocks || []).forEach(b => {
                    if (b.type === 'img' && b.src) {
                        used.add(b.src);
                    } else if (b.type === 'raw' && b.html) {
                        const matches = b.html.match(/images\/catalog\/([^"'\s)]+)/g) || [];
                        matches.forEach(m => used.add(m.replace('images/catalog/', '')));
                    }
                });
            });
        });
        return used;
    }

    async function loadImageList() {
        if (imageListCache) {
            renderImgGrid(imageListCache);
            return;
        }
        try {
            const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${IMAGE_DIR.replace(/\/$/, '')}`);
            if (!r.ok) throw new Error('API 讀取失敗（可能達到每小時 60 次上限）');
            const files = (await r.json())
                .filter(f => /\.(webp|png|jpe?g)$/i.test(f.name))
                .map(f => f.name);
            imageListCache = files;
            renderImgGrid(files);
        } catch (e) {
            document.getElementById('imgModalStatus').textContent = '無法載入圖片清單：' + e.message + '（請改用手動輸入檔名）';
            document.getElementById('imgModalManual').style.display = 'flex';
        }
    }

    function renderImgGrid(files) {
        if (!files) return;
        const used = computeUsedImages();
        const onlyUnused = document.getElementById('imgOnlyUnused').checked;
        const unusedCount = files.filter(f => !used.has(f)).length;
        document.getElementById('imgModalStatus').textContent =
            `共 ${files.length} 張圖片（其中 ${unusedCount} 張尚未使用），點選即套用`;
        const grid = document.getElementById('imgModalGrid');
        grid.innerHTML = '';
        const displayFiles = onlyUnused ? files.filter(f => !used.has(f)) : files;
        displayFiles.forEach(name => {
            const wrap = document.createElement('div');
            wrap.className = 'thumb-wrap';
            const img = document.createElement('img');
            img.src = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${IMAGE_DIR}${name}`;
            img.onclick = () => {
                if (imgModalTargetSetter) imgModalTargetSetter(name);
                closeImgModal();
            };
            wrap.appendChild(img);
            if (used.has(name)) {
                const badge = document.createElement('div');
                badge.className = 'used-badge';
                badge.textContent = '已用';
                wrap.appendChild(badge);
            }
            const fname = document.createElement('div');
            fname.className = 'fname';
            fname.textContent = name;
            wrap.appendChild(fname);
            grid.appendChild(wrap);
        });
        document.getElementById('imgModalManual').style.display = 'flex';
    }

    function confirmManualImage() {
        const val = document.getElementById('imgManualInput').value.trim();
        if (!val) return;
        if (imgModalTargetSetter) imgModalTargetSetter(val);
        closeImgModal();
    }

    // ---------- 即時預覽 ----------

    function updateFullPreview() {
        const cat = getCategory(currentKey);
        const el = document.getElementById('previewContent');
        let html = `<div class="preview-card"><strong>${cat.emoji || ''} ${escapeAttr(cat.title || '')}</strong>
            <p style="margin-top:6px;">${parseMarkup(cat.sub || '')}</p></div>`;
        (cat.items || []).forEach(item => {
            html += `<div class="preview-card">`;
            if (item.name) html += `<h4>${escapeAttr(item.name)}</h4>`;
            (item.blocks || []).forEach(b => {
                if (b.type === 'text') {
                    html += `<p>${parseMarkup(b.value)}</p>`;
                } else if (b.type === 'img') {

                    html += `<img src="${src}" onerror="this.style.opacity=0.2">`;

    // ---------- 保存 / 上傳 ----------

    function discardChanges() {
        if (!confirm('放棄目前分類未上傳的變更？')) return;
        delete drafts[currentKey];
        saveDrafts();
        renderSidebar();
        renderEditor();
    }

    function saveLocally() {
        // mutateCurrentCategory 已經即時寫入 drafts + localStorage，這裡只是明確提示使用者
        showNotif('✅ 已本地保存（草稿）', 'success');
    }

    // ---- 上傳前 Guard（§8.5）----

    function buildFinalData() {
        // 套用 drafts 到 travelData：保留原始順序，drafts 覆蓋同 key 分類；
        // __deleted 標記的分類過濾掉；drafts 裡新增（不在原始）的分類附加在最後
        const origKeys = travelData.categories.map(c => c.key);
        const merged = [];
        origKeys.forEach(key => {
            const d = drafts[key];
            if (d && d.__deleted) return; // 刪除
            merged.push(d ? d : travelData.categories.find(c => c.key === key));
        });
        Object.keys(drafts).forEach(key => {
            if (!origKeys.includes(key) && !drafts[key].__deleted) {
                merged.push(drafts[key]);
            }
        });
        return { categories: merged };
    }

    function countStats(data) {
        let items = 0, imgs = 0;
        data.categories.forEach(c => {
            (c.items || []).forEach(it => {
                items++;
                (it.blocks || []).forEach(b => { if (b.type === 'img') imgs++; });
            });
        });
        return { categories: data.categories.length, items, imgs };
    }

    function startUpload() {
        const draftCount = Object.keys(drafts).length;
        if (draftCount === 0) { showNotif('沒有未上傳的修改', 'error'); return; }

        let finalData;
        try {
            finalData = buildFinalData();
            JSON.stringify(finalData); // guard 1: 不拋錯
        } catch (e) {
            showNotif('❌ 資料序列化失敗：' + e.message, 'error');
            return;
        }

        // guard 2
        if (!Array.isArray(finalData.categories) || finalData.categories.length < 1) {
            showNotif('❌ 分類陣列為空，中止上傳', 'error');
            return;
        }
        // guard 3
        const seenKeys = new Set();
        for (const c of finalData.categories) {
            if (!c.key || !c.title) {
                showNotif('❌ 有分類缺少 key 或 title，中止上傳', 'error');
                return;
            }
            if (seenKeys.has(c.key)) {
                showNotif('❌ key 重複：' + c.key + '，中止上傳', 'error');
                return;
            }
            seenKeys.add(c.key);
        }
        // guard 4
        if (finalData.categories.length < originalCategoryCount) {
            if (!confirm(`分類數從 ${originalCategoryCount} 減少為 ${finalData.categories.length}，確定要刪除分類嗎？`)) {
                return;
            }
        }

        const before = countStats(travelData);
        const after = countStats(finalData);
        document.getElementById('diffSummary').innerHTML =
            `分類 ${before.categories} → ${after.categories}<br>` +
            `項目 ${before.items} → ${after.items}<br>` +
            `圖片 ${before.imgs} → ${after.imgs}`;
        window.__pendingUploadData = finalData;
        document.getElementById('uploadModal').classList.add('open');
    }

    function closeUploadModal() {
        document.getElementById('uploadModal').classList.remove('open');
    }

    async function confirmUpload() {
        closeUploadModal();
        const finalData = window.__pendingUploadData;
        if (!finalData) return;

        const uploadBtn = document.getElementById('uploadBtn');
        uploadBtn.disabled = true;
        uploadBtn.textContent = '⏳ 上傳中...';

        try {
            const pat = getPAT();

            const getResp = await fetch(`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_FILE}`);
            const oldContent = await getResp.text();

            const marker = `const ${VAR_NAME} = `;
            const startIdx = oldContent.indexOf(marker);
            if (startIdx < 0) throw new Error('找不到資料標記，中止上傳');

            const header = oldContent.substring(0, startIdx);
            const endIdx = oldContent.lastIndexOf('};'); // guard: 必須是 lastIndexOf
            if (endIdx < startIdx) throw new Error('檔案結構異常，中止上傳');
            const footer = oldContent.substring(endIdx + 2);

            // guard 5：header 非空，且確認舊檔案本身確實包含 const TRAVEL_CONTENT 宣告
            // （雙重防呆：即使前面 indexOf(marker) 已隱含此條件，仍依規格書字面要求明確檢查一次）
            if (header.trim().length === 0) throw new Error('header 異常，中止上傳');
            if (oldContent.indexOf(`const ${VAR_NAME}`) === -1) throw new Error('舊檔案缺少 const ' + VAR_NAME + ' 宣告，中止上傳');

            const newContent = header + marker + JSON.stringify(finalData, null, 2) + ';\n' + footer;

            const shaResp = await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                { headers: { 'Authorization': `token ${pat}` } }
            );
            const fileData = await shaResp.json();

            const updateResp = await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${pat}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `📝 編輯${LABEL}：${finalData.categories.length} 個分類 | ${GITHUB_FILE.split('/').pop()}`,
                        content: utf8ToBase64(newContent),
                        sha: fileData.sha
                    })
                }
            );
            if (!updateResp.ok) throw new Error('更新失敗');

            // 上傳成功：清空草稿、更新記憶體資料
            travelData = finalData;
            originalCategoryCount = finalData.categories.length;
            drafts = {};
            saveDrafts();

            showNotif('✅ 已上傳到 GitHub！', 'success');
            renderSidebar();
            if (currentKey && !travelData.categories.find(c => c.key === currentKey)) {
                clearEditor();
            } else {
                renderEditor();
            }
        } catch (e) {
            showNotif('❌ 錯誤: ' + e.message, 'error');
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = '⬆️ 上傳到GitHub';
        }
    }

    window.addEventListener('load', init);
</script>
</body>
</html>
