<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>體驗編輯器 Phase 2.1 | 2026 冰島芬蘭之旅</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* ========== 頂部欄 ========== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #2c3e50;
            color: white;
            height: auto;
            z-index: 100;
        }

        .top-bar h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .top-bar-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .draft-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
        }

        /* ========== 工具欄（Sticky） ========== */
        .toolbar-container {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 98;
            background: white;
            border-bottom: 2px solid #3498db;
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            flex-wrap: wrap;
        }

        .toolbar-title {
            font-size: 12px;
            font-weight: 600;
            color: #2c3e50;
            margin-right: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .component-btn {
            padding: 10px 16px;
            background: white;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            cursor: grab;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            user-select: none;
            draggable: true;
        }

        .component-btn:hover {
            background: #ecf0f1;
            border-color: #3498db;
            box-shadow: 0 2px 6px rgba(52, 152, 219, 0.2);
        }

        .component-btn:active {
            cursor: grabbing;
        }

        /* ========== 主佈局 ========== */
        .layout {
            display: grid;
            grid-template-columns: 120px 1fr 30%;
            gap: 1px;
            background: #ddd;
            height: calc(100vh - 100px);
        }

        /* ========== 左側：分類 ========== */
        .sidebar-left {
            background: white;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        .sidebar-title {
            padding: 12px;
            background: #34495e;
            color: white;
            font-weight: 600;
            font-size: 13px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .category-item {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .category-item:hover {
            background: #f8f9fa;
        }

        .category-item.active {
            background: #e8f4f8;
            border-left: 3px solid #3498db;
            padding-left: 9px;
            font-weight: 600;
        }

        .item-list {
            padding: 8px 0;
            display: none;
            max-height: 150px;
            overflow-y: auto;
        }

        .item-list.show {
            display: block;
        }

        .item-name {
            padding: 6px 20px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 2px solid transparent;
        }

        .item-name:hover {
            background: #f0f0f0;
            border-left-color: #3498db;
        }

        .item-name.active {
            background: #e8f4f8;
            border-left-color: #3498db;
            font-weight: 600;
        }

        /* ========== 中間：編輯區 ========== */
        .editor-main {
            background: white;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
            margin-bottom: 20px;
        }

        .editor-header h2 {
            font-size: 18px;
            color: #2c3e50;
        }

        .editor-header p {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .blocks-container {
            min-height: 200px;
            border: 2px dashed #bdc3c7;
            border-radius: 6px;
            padding: 15px;
            margin: 20px 0;
            background: #fafafa;
            flex: 1;
            overflow-y: auto;
        }

        .blocks-container.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #95a5a6;
            font-size: 14px;
        }

        .block {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: move;
            transition: all 0.2s;
            position: relative;
        }

        .block:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-color: #3498db;
        }

        .block.sortable-ghost {
            opacity: 0.4;
            background: #ecf0f1;
        }

        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ecf0f1;
        }

        .block-type {
            font-size: 12px;
            font-weight: 600;
            color: #3498db;
            text-transform: uppercase;
        }

        .block-actions {
            display: flex;
            gap: 6px;
        }

        .block-btn {
            padding: 4px 8px;
            font-size: 11px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .block-btn:hover {
            background: #ecf0f1;
            border-color: #95a5a6;
        }

        .block-btn.delete {
            color: #e74c3c;
            border-color: #e74c3c;
        }

        .block-btn.delete:hover {
            background: #fadbd8;
        }

        .block-content {
            padding: 10px;
            background: #fafafa;
            border-radius: 3px;
            font-size: 13px;
            line-height: 1.5;
            max-height: 100px;
            overflow-y: auto;
            word-break: break-word;
        }

        .block-content.text {
            font-family: 'Monaco', 'Courier New', monospace;
            white-space: pre-wrap;
        }

        .block-content.image {
            text-align: center;
            padding: 20px;
        }

        .block-content.image img {
            max-width: 100%;
            max-height: 80px;
            border-radius: 3px;
        }

        /* ========== 右側：預覽區 ========== */
        .preview-panel {
            background: white;
            overflow-y: auto;
            padding: 20px;
            border-left: 2px solid #ddd;
            position: relative;
            display: flex;
            flex-direction: column;
            resize: horizontal;
        }

        .preview-resizer {
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: #ddd;
            cursor: col-resize;
            transition: background 0.2s;
            user-select: none;
            z-index: 10;
        }

        .preview-resizer:hover {
            background: #3498db;
        }

        .preview-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #27ae60;
            color: #2c3e50;
        }

        .preview-content {
            font-size: 13px;
            line-height: 1.6;
            flex: 1;
            overflow-y: auto;
        }

        .preview-block {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ecf0f1;
        }

        .preview-block:last-child {
            border-bottom: none;
        }

        .preview-text {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Segoe UI', Roboto;
        }

        .preview-image {
            text-align: center;
            margin: 10px 0;
        }

        .preview-image img {
            max-width: 100%;
            max-height: 120px;
            border-radius: 4px;
        }

        /* ========== 編輯模態框 ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 6px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ecf0f1;
        }

        .modal-body {
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2c3e50;
        }

        .form-group textarea,
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 13px;
        }

        .form-group textarea {
            font-family: 'Monaco', 'Courier New', monospace;
            min-height: 150px;
            resize: vertical;
        }

        .form-group input {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
        }

        .field-toolbar {
            margin-bottom: 8px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .mini-btn {
            padding: 6px 12px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .mini-btn:hover {
            background: #ecf0f1;
            border-color: #3498db;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-footer .btn {
            flex: 0;
        }

        /* ========== 通知 ========== */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #27ae60;
            color: white;
            border-radius: 4px;
            font-size: 13px;
            z-index: 2000;
            animation: slideIn 0.3s ease-out;
        }

        .notification.error {
            background: #e74c3c;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ========== 響應式 ========== */
        @media (max-width: 1200px) {
            .layout {
                grid-template-columns: 100px 1fr 25%;
            }
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .preview-panel {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- 頂部欄 -->
<div class="top-bar">
    <h1>📝 體驗編輯器 Phase 2.1</h1>
    <div class="top-bar-right">
        <div class="draft-count">草稿: <span id="draftCount">0</span></div>
        <button class="btn btn-primary" onclick="saveProject()">💾 本地保存</button>
        <button class="btn btn-success" onclick="uploadToGitHub()">⬆️ 上傳GitHub</button>
        <button class="btn btn-danger" onclick="discardChanges()">❌ 放棄</button>
    </div>
</div>

<!-- 工具欄（固定頂部） -->
<div class="toolbar-container">
    <span class="toolbar-title">📦 拖拽或點擊添加區塊：</span>
    <button class="component-btn" draggable="true" ondragstart="dragStart(event, 'text')" onclick="addBlock('text')">
        📄 文字
    </button>
    <button class="component-btn" draggable="true" ondragstart="dragStart(event, 'image')" onclick="addBlock('image')">
        🖼️ 圖片
    </button>
    <button class="component-btn" draggable="true" ondragstart="dragStart(event, 'divider')" onclick="addBlock('divider')">
        ─ 分隔線
    </button>
</div>

<!-- 主內容區 -->
<div class="layout">
    <!-- 左側：分類 -->
    <div class="sidebar-left">
        <div class="sidebar-title">📂 分類</div>
        <div id="categoryList"></div>
    </div>

    <!-- 中間：編輯區 -->
    <div class="editor-main">
        <div id="editorHeader"></div>
        <div class="blocks-container empty" id="blocksContainer" ondragover="dragOver(event)" ondrop="dropBlock(event)" ondragleave="dragLeave(event)">
            <div>選擇項目後，拖拽或點擊添加區塊</div>
        </div>
    </div>

    <!-- 右側：預覽區 -->
    <div class="preview-panel">
        <div class="preview-resizer" id="previewResizer"></div>
        <div class="preview-title">✨ 實時預覽</div>
        <div id="previewContent" class="preview-content">
            <p style="color: #95a5a6; font-size: 13px;">選擇項目後預覽</p>
        </div>
    </div>
</div>

<!-- 編輯模態框 -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <div class="modal-header" id="modalTitle"></div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn btn-primary" onclick="saveBlockEdit()">保存</button>
            <button class="btn" onclick="closeEditModal()">取消</button>
        </div>
    </div>
</div>

<script>
    // ========== 全局變數 ==========
    let travelData = {};
    let currentCategory = null;
    let currentItem = null;
    let drafts = {};
    let sortableInstance = null;
    let editingBlockIndex = -1;
    let draggedBlockType = null;
    let previewWidth = 30;
    let isResizingPreview = false;

    // ========== 初始化 ==========
    window.addEventListener('load', () => {
        loadDrafts();
        loadPreviewWidth();
        loadTravelData().then(() => {
            renderCategories();
        });
        initializePreviewResizer();
    });

    // ========== 數據管理 ==========
    async function loadTravelData() {
        try {
            const resp = await fetch('https://raw.githubusercontent.com/fisherchang01/2026iceland/main/data/travel-data-v2.js');
            if (!resp.ok) throw new Error('無法讀取數據');
            
            const content = await resp.text();
            const match = content.match(/const TRAVEL_DATA_V2 = ({[\s\S]*?});/);
            if (!match) throw new Error('無法解析數據');
            
            eval(`travelData = ${match[1]}`);
            showNotif('✅ 數據加載成功（' + Object.keys(travelData).length + ' 個分類）', 'success');
            return true;
        } catch (err) {
            showNotif('❌ 數據加載失敗：' + err.message, 'error');
            return false;
        }
    }

    function loadDrafts() {
        const stored = localStorage.getItem('travel_editor_v3_drafts');
        drafts = stored ? JSON.parse(stored) : {};
        updateDraftCount();
    }

    function saveDrafts() {
        localStorage.setItem('travel_editor_v3_drafts', JSON.stringify(drafts));
        updateDraftCount();
    }

    function updateDraftCount() {
        const count = Object.values(drafts).reduce((sum, item) => sum + (item.blocks ? item.blocks.length : 0), 0);
        document.getElementById('draftCount').textContent = count;
    }

    function saveProject() {
        saveDrafts();
        showNotif('✅ 已本地保存', 'success');
    }

    function loadPreviewWidth() {
        const saved = localStorage.getItem('preview_width');
        if (saved) previewWidth = parseFloat(saved);
        updatePreviewWidth();
    }

    function savePreviewWidth() {
        localStorage.setItem('preview_width', previewWidth.toString());
    }

    function updatePreviewWidth() {
        const layout = document.querySelector('.layout');
        layout.style.gridTemplateColumns = `120px 1fr ${previewWidth}%`;
    }

    // ========== 預覽區拖拽調整 ==========
    function initializePreviewResizer() {
        const resizer = document.getElementById('previewResizer');
        
        resizer.addEventListener('mousedown', startResize);
        resizer.addEventListener('touchstart', startResize);
    }

    function startResize(e) {
        isResizingPreview = true;
        const startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const startWidth = previewWidth;
        const viewportWidth = window.innerWidth;

        function resize(e) {
            if (!isResizingPreview) return;

            const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const diff = startX - currentX;
            const percentDiff = (diff / viewportWidth) * 100;
            let newWidth = startWidth + percentDiff;

            // 限制範圍：20% - 60%
            newWidth = Math.max(20, Math.min(60, newWidth));
            
            previewWidth = newWidth;
            updatePreviewWidth();
        }

        function stopResize() {
            isResizingPreview = false;
            savePreviewWidth();
            document.removeEventListener('mousemove', resize);
            document.removeEventListener('touchmove', resize);
            document.removeEventListener('mouseup', stopResize);
            document.removeEventListener('touchend', stopResize);
        }

        document.addEventListener('mousemove', resize);
        document.addEventListener('touchmove', resize);
        document.addEventListener('mouseup', stopResize);
        document.addEventListener('touchend', stopResize);
    }

    // ========== UI 渲染 ==========
    function renderCategories() {
        const list = document.getElementById('categoryList');
        list.innerHTML = '';

        for (const [catKey, category] of Object.entries(travelData)) {
            const catDiv = document.createElement('div');
            catDiv.className = currentCategory === catKey ? 'category-item active' : 'category-item';
            catDiv.textContent = `${category.emoji} ${category.title}`;
            catDiv.onclick = () => selectCategory(catKey);
            list.appendChild(catDiv);

            const itemList = document.createElement('div');
            itemList.className = 'item-list' + (currentCategory === catKey ? ' show' : '');
            itemList.id = `items-${catKey}`;

            if (category.items) {
                category.items.forEach((item, idx) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = (currentCategory === catKey && currentItem === idx) ? 'item-name active' : 'item-name';
                    itemDiv.textContent = item.name;
                    itemDiv.onclick = () => selectItem(catKey, idx);
                    itemList.appendChild(itemDiv);
                });
            }

            list.appendChild(itemList);
        }
    }

    function selectCategory(catKey) {
        currentCategory = catKey;
        currentItem = null;
        renderCategories();
        renderEditor();
    }

    function selectItem(catKey, itemIdx) {
        currentCategory = catKey;
        currentItem = itemIdx;
        renderCategories();
        renderEditor();
    }

    function renderEditor() {
        if (!currentCategory || currentItem === null) {
            document.getElementById('editorHeader').innerHTML = '<p>選擇項目開始編輯</p>';
            document.getElementById('blocksContainer').className = 'blocks-container empty';
            document.getElementById('blocksContainer').innerHTML = '<div>選擇項目後，拖拽或點擊添加區塊</div>';
            document.getElementById('previewContent').innerHTML = '<p style="color: #95a5a6;">選擇項目後預覽</p>';
            return;
        }

        const category = travelData[currentCategory];
        const item = category.items[currentItem];
        const draftKey = `${currentCategory}_${currentItem}`;
        const draft = drafts[draftKey] || { blocks: item.blocks || [] };

        document.getElementById('editorHeader').innerHTML = `
            <h2>${category.emoji} ${category.title}</h2>
            <p>${item.name}</p>
        `;

        const container = document.getElementById('blocksContainer');
        container.className = 'blocks-container';
        container.innerHTML = '';

        if (draft.blocks && draft.blocks.length > 0) {
            draft.blocks.forEach((block, idx) => {
                const blockEl = createBlockElement(block, idx);
                container.appendChild(blockEl);
            });

            if (sortableInstance) sortableInstance.destroy();
            sortableInstance = Sortable.create(container, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: updateBlocksPreview
            });
        } else {
            container.innerHTML = '<div style="padding: 30px; text-align: center; color: #95a5a6;">選擇項目後，拖拽或點擊添加區塊</div>';
        }

        drafts[draftKey] = { ...item, blocks: draft.blocks };
        saveDrafts();

        updateBlocksPreview();
    }

    function createBlockElement(block, idx) {
        const el = document.createElement('div');
        el.className = 'block';
        el.dataset.index = idx;

        let content = '';
        if (block.type === 'text') {
            content = `<div class="block-content text">${escapeHtml(block.content)}</div>`;
        } else if (block.type === 'image') {
            content = `<div class="block-content image">${block.imageUrl ? `<img src="${block.imageUrl}" alt="">` : '(無圖片)'}</div>`;
        } else if (block.type === 'divider') {
            content = '<div class="block-content">─────────────────</div>';
        }

        el.innerHTML = `
            <div class="block-header">
                <span class="block-type">${getBlockTypeLabel(block.type)}</span>
                <div class="block-actions">
                    <button class="block-btn" onclick="editBlock(${idx})">編輯</button>
                    <button class="block-btn delete" onclick="deleteBlock(${idx})">刪除</button>
                </div>
            </div>
            ${content}
        `;

        return el;
    }

    function getBlockTypeLabel(type) {
        const labels = { text: '📄 文字', image: '🖼️ 圖片', divider: '─ 分隔線' };
        return labels[type] || type;
    }

    // ========== 拖拽函數 ==========
    function dragStart(event, blockType) {
        draggedBlockType = blockType;
        event.dataTransfer.effectAllowed = 'copy';
        event.dataTransfer.setData('blockType', blockType);
    }

    function dragOver(event) {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
        const container = document.getElementById('blocksContainer');
        container.style.background = '#e8f4f8';
        container.style.borderColor = '#3498db';
    }

    function dragLeave(event) {
        const container = document.getElementById('blocksContainer');
        container.style.background = '#fafafa';
        container.style.borderColor = '#bdc3c7';
    }

    function dropBlock(event) {
        event.preventDefault();
        const blockType = event.dataTransfer.getData('blockType') || draggedBlockType;
        dragLeave(event);
        
        if (!currentCategory || currentItem === null) {
            showNotif('❌ 請先選擇項目', 'error');
            return;
        }

        addBlock(blockType);
    }

    function addBlock(type) {
        if (!currentCategory || currentItem === null) {
            showNotif('❌ 請先選擇項目', 'error');
            return;
        }

        const draftKey = `${currentCategory}_${currentItem}`;
        if (!drafts[draftKey]) {
            drafts[draftKey] = { blocks: [] };
        }

        const newBlock = { type };
        if (type === 'text') newBlock.content = '';
        if (type === 'image') {
            newBlock.imageUrl = '';
            newBlock.caption = '';
            newBlock.layout = 'small';
            newBlock.filename = '';
        }

        drafts[draftKey].blocks.push(newBlock);
        saveDrafts();
        renderEditor();
        showNotif(`✅ 已添加${getBlockTypeLabel(type)}`, 'success');
    }

    function deleteBlock(idx) {
        if (confirm('確定要刪除這個區塊嗎？')) {
            const draftKey = `${currentCategory}_${currentItem}`;
            drafts[draftKey].blocks.splice(idx, 1);
            saveDrafts();
            renderEditor();
            showNotif('✅ 已刪除', 'success');
        }
    }

    function editBlock(idx) {
        editingBlockIndex = idx;
        const draftKey = `${currentCategory}_${currentItem}`;
        const block = drafts[draftKey].blocks[idx];

        document.getElementById('modalTitle').textContent = `編輯 ${getBlockTypeLabel(block.type)}`;

        let bodyHtml = '';
        if (block.type === 'text') {
            bodyHtml = `
                <div class="form-group">
                    <label>文字內容（支持格式化）</label>
                    <div class="field-toolbar">
                        <button class="mini-btn" onclick="insertToTextarea('blockContent', '{bold}', '{/bold}')" title="加粗"><strong>B</strong></button>
                        <button class="mini-btn" onclick="insertToTextarea('blockContent', '{italic}', '{/italic}')" title="斜體"><em>I</em></button>
                        <button class="mini-btn" onclick="insertToTextarea('blockContent', '/n')" title="分段">¶</button>
                        <button class="mini-btn" onclick="insertToTextarea('blockContent', '{#ff6b6b}', '{/color}')" title="紅色" style="background: #fadbd8;">R</button>
                        <button class="mini-btn" onclick="insertToTextarea('blockContent', '{#3498db}', '{/color}')" title="藍色" style="background: #d6eaf8;">B</button>
                        <button class="mini-btn" onclick="insertToTextarea('blockContent', '{#51cf66}', '{/color}')" title="綠色" style="background: #d4edda;">G</button>
                    </div>
                    <textarea id="blockContent">${escapeHtml(block.content)}</textarea>
                </div>
            `;
        } else if (block.type === 'image') {
            bodyHtml = `
                <div class="form-group">
                    <label>圖片文件名（不含副檔名，如：skyr-01）</label>
                    <input type="text" id="filename" value="${escapeHtml(block.filename)}" placeholder="skyr-01">
                    <small style="color: #7f8c8d; display: block; margin-top: 4px;">完整路徑：images/travel/${document.getElementById('filename')?.value || 'skyr-01'}.jpg</small>
                </div>
                <div class="form-group">
                    <label>圖片 URL</label>
                    <input type="text" id="imageUrl" value="${escapeHtml(block.imageUrl)}" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>圖片說明</label>
                    <input type="text" id="caption" value="${escapeHtml(block.caption || '')}">
                </div>
                <div class="form-group">
                    <label>圖片布局</label>
                    <select id="layout">
                        <option value="small" ${block.layout === 'small' ? 'selected' : ''}>小圖（一行兩個，正方形）</option>
                        <option value="large" ${block.layout === 'large' ? 'selected' : ''}>大圖（一行一個，橫式）</option>
                    </select>
                </div>
                <div style="text-align: center; margin: 15px 0;">
                    <button class="btn btn-primary" onclick="uploadImage()">📤 上傳圖片到 GitHub</button>
                </div>
            `;
        }

        document.getElementById('modalBody').innerHTML = bodyHtml;
        document.getElementById('editModal').classList.add('show');
    }

    function saveBlockEdit() {
        const draftKey = `${currentCategory}_${currentItem}`;
        const block = drafts[draftKey].blocks[editingBlockIndex];

        if (block.type === 'text') {
            block.content = document.getElementById('blockContent').value;
        } else if (block.type === 'image') {
            block.filename = document.getElementById('filename').value;
            block.imageUrl = document.getElementById('imageUrl').value;
            block.caption = document.getElementById('caption').value;
            block.layout = document.getElementById('layout').value;
        }

        saveDrafts();
        closeEditModal();
        renderEditor();
        showNotif('✅ 已保存區塊', 'success');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('show');
        editingBlockIndex = -1;
    }

    function updateBlocksPreview() {
        if (!currentCategory || currentItem === null) return;

        const draftKey = `${currentCategory}_${currentItem}`;
        const item = drafts[draftKey];

        let preview = '<div class="preview-content">';
        
        if (item.blocks && item.blocks.length > 0) {
            item.blocks.forEach(block => {
                if (block.type === 'text') {
                    preview += `<div class="preview-block"><div class="preview-text">${escapeHtml(block.content)}</div></div>`;
                } else if (block.type === 'image') {
                    if (block.imageUrl) {
                        preview += `
                            <div class="preview-block">
                                <div class="preview-image"><img src="${block.imageUrl}" alt=""></div>
                                ${block.caption ? `<div style="font-size: 12px; color: #7f8c8d; text-align: center;">${escapeHtml(block.caption)}</div>` : ''}
                            </div>
                        `;
                    }
                } else if (block.type === 'divider') {
                    preview += '<div class="preview-block" style="padding: 10px 0;"><div style="border-top: 1px solid #ddd;"></div></div>';
                }
            });
        }

        preview += '</div>';
        document.getElementById('previewContent').innerHTML = preview;
    }

    // ========== 圖片上傳 ==========
    async function uploadImage() {
        const filename = document.getElementById('filename').value;
        if (!filename) {
            showNotif('❌ 請輸入圖片文件名', 'error');
            return;
        }

        const file = document.createElement('input');
        file.type = 'file';
        file.accept = 'image/*';
        file.onchange = async (e) => {
            const img = e.target.files[0];
            if (!img) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const base64 = event.target.result.split(',')[1];
                    const imagePath = `images/travel/${filename}.jpg`;
                    
                    const pat = prompt('請輸入 GitHub PAT 以上傳圖片：');
                    if (!pat) return;

                    const response = await fetch(`https://api.github.com/repos/fisherchang01/2026iceland/contents/${imagePath}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${pat}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `📸 上傳體驗圖片 | ${filename}`,
                            content: base64
                        })
                    });

                    if (!response.ok) throw new Error('圖片上傳失敗');

                    const imageUrl = `https://raw.githubusercontent.com/fisherchang01/2026iceland/main/${imagePath}`;
                    document.getElementById('imageUrl').value = imageUrl;
                    updateBlocksPreview();
                    showNotif('✅ 圖片已上傳', 'success');
                } catch (err) {
                    showNotif('❌ 上傳失敗：' + err.message, 'error');
                }
            };
            reader.readAsDataURL(img);
        };
        file.click();
    }

    // ========== GitHub 上傳 ==========
    async function uploadToGitHub() {
        const pat = prompt('請輸入 GitHub Personal Access Token：');
        if (!pat) return;

        try {
            showNotif('⏳ 上傳中...', 'success');

            const newData = { ...travelData };
            for (const [catKey, category] of Object.entries(newData)) {
                category.items.forEach((item, idx) => {
                    const draftKey = `${catKey}_${idx}`;
                    if (drafts[draftKey]) {
                        item.blocks = drafts[draftKey].blocks || [];
                    }
                });
            }

            const getResp = await fetch('https://api.github.com/repos/fisherchang01/2026iceland/contents/data/travel-data-v2.js', {
                headers: { 'Authorization': `token ${pat}` }
            });

            const fileData = await getResp.json();
            
            const newContent = `/**
 * 2026冰島芬蘭旅遊 - 體驗內容數據 V2
 */

const TRAVEL_DATA_V2 = ${JSON.stringify(newData, null, 2)};

if (typeof module !== 'undefined' && module.exports) {
  module.exports = TRAVEL_DATA_V2;
}
`;

            const uploadResp = await fetch('https://api.github.com/repos/fisherchang01/2026iceland/contents/data/travel-data-v2.js', {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${pat}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `📝 更新體驗內容 | ${new Date().toLocaleString('zh-Hant')}`,
                    content: btoa(unescape(encodeURIComponent(newContent))),
                    sha: fileData.sha
                })
            });

            if (!uploadResp.ok) throw new Error('上傳失敗');

            drafts = {};
            localStorage.removeItem('travel_editor_v3_drafts');
            
            showNotif('✅ 已成功上傳到 GitHub！', 'success');
            setTimeout(() => location.reload(), 2000);
        } catch (err) {
            showNotif('❌ 上傳失敗：' + err.message, 'error');
        }
    }

    function discardChanges() {
        if (confirm('確定要放棄所有修改嗎？')) {
            localStorage.removeItem('travel_editor_v3_drafts');
            drafts = {};
            loadDrafts();
            renderEditor();
            showNotif('✅ 已清空草稿', 'success');
        }
    }

    // ========== 工具函數 ==========
    function insertToTextarea(textareaId, prefix, suffix = '') {
        const textarea = document.getElementById(textareaId);
        if (!textarea) return;

        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selectedText = textarea.value.substring(start, end);
        const before = textarea.value.substring(0, start);
        const after = textarea.value.substring(end);

        if (selectedText) {
            textarea.value = before + prefix + selectedText + suffix + after;
        } else {
            textarea.value = before + prefix + suffix + after;
            textarea.selectionStart = start + prefix.length;
        }

        textarea.focus();
        updateBlocksPreview();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, ch => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[ch]));
    }

    function showNotif(msg, type = 'success') {
        const notif = document.createElement('div');
        notif.className = 'notification' + (type === 'error' ? ' error' : '');
        notif.textContent = msg;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    }
</script>
