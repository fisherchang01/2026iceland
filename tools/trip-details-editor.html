<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Details Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
        }

        .editor-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .editor-container {
            background: white;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e5e5;
        }

        .editor-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 4px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            border-bottom: 1px solid #e5e5e5;
            flex-wrap: wrap;
            background: #fafafa;
        }

        .toolbar-btn {
            padding: 8px 12px;
            border: 1px solid #d0d0d0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn:hover {
            background: #f0f0f0;
            border-color: #999;
        }

        .toolbar-btn.color-btn {
            padding: 6px 10px;
        }

        .color-picker {
            width: 32px;
            height: 32px;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            cursor: pointer;
        }

        .editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .editor-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .editor-section label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 10px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .preview-section {
            border-top: 1px solid #e5e5e5;
            padding-top: 12px;
        }

        .preview-label {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .preview-box {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            border: 1px solid #e5e5e5;
        }

        .editor-footer {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid #e5e5e5;
            justify-content: flex-end;
        }

        .action-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4a90e2;
            color: white;
        }

        .btn-primary:hover {
            background: #357abd;
        }

        .btn-secondary {
            background: #e5e5e5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        /* 預覽中的顏色文本 */
        .colored-text {
            font-weight: 500;
        }

        /* 複製按鈕 */
        .copy-btn {
            padding: 6px 10px;
            font-size: 12px;
            background: #f0f0f0;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="editor-overlay" id="editorOverlay">
        <div class="editor-container">
            <!-- Header with close button -->
            <div class="editor-header">
                <h2>編輯行程細節</h2>
                <button class="close-btn" id="closeBtn" title="關閉編輯器">✕</button>
            </div>

            <!-- Toolbar -->
            <div class="editor-toolbar">
                <button class="toolbar-btn" id="boldBtn" title="粗體">
                    <strong>B</strong>
                </button>
                <button class="toolbar-btn" id="italicBtn" title="斜體">
                    <em>I</em>
                </button>
                <button class="toolbar-btn" id="linebreakBtn" title="插入換行">
                    ↵ 換行
                </button>
                <button class="toolbar-btn color-btn" title="選擇顏色">
                    <span>顏色</span>
                    <input type="color" class="color-picker" id="colorPicker" value="#ff0000">
                </button>
                <button class="toolbar-btn" id="copyBtn" title="複製標記代碼">
                    📋 複製
                </button>
            </div>

            <!-- Content area -->
            <div class="editor-content">
                <div class="editor-section">
                    <label for="contentTextarea">內容文本</label>
                    <textarea id="contentTextarea" placeholder="輸入內容...&#10;&#10;使用工具列來格式化文本"></textarea>
                </div>

                <div class="editor-section preview-section">
                    <div class="preview-label">預覽</div>
                    <div class="preview-box" id="previewBox">
                        (預覽會即時更新)
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="editor-footer">
                <button class="action-btn btn-secondary" id="cancelBtn">取消</button>
                <button class="action-btn btn-primary" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 工具集合
        class MarkupParser {
            // 將 markup 轉換為 HTML 以供預覽
            static toHTML(text) {
                let html = text;

                // 將 /n 轉換為 <br>
                html = html.replace(/\/n/g, '<br>');

                // 處理顏色標記：{#color}text{/color} → <span style="color: #color">text</span>
                html = html.replace(/\{#([0-9a-fA-F]{6})\}([^{]*?)\{\/color\}/g, 
                    '<span class="colored-text" style="color: #$1">$2</span>');

                // 處理粗體：{bold}text{/bold} → <strong>text</strong>
                html = html.replace(/\{bold\}([^{]*?)\{\/bold\}/g, '<strong>$1</strong>');

                // 處理斜體：{italic}text{/italic} → <em>text</em>
                html = html.replace(/\{italic\}([^{]*?)\{\/italic\}/g, '<em>$1</em>');

                return html;
            }

            // 在光標位置插入標記
            static insertMarkup(textarea, before, after = '') {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const text = textarea.value;
                const selectedText = text.substring(start, end) || '文本';

                const newText = text.substring(0, start) + before + selectedText + after + text.substring(end);
                textarea.value = newText;

                // 重新定位光標
                setTimeout(() => {
                    textarea.focus();
                    textarea.selectionStart = start + before.length;
                    textarea.selectionEnd = start + before.length + selectedText.length;
                }, 0);

                // 觸發預覽更新
                updatePreview();
            }
        }

        // 獲取 DOM 元素
        const contentTextarea = document.getElementById('contentTextarea');
        const previewBox = document.getElementById('previewBox');
        const closeBtn = document.getElementById('closeBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveBtn = document.getElementById('saveBtn');
        const boldBtn = document.getElementById('boldBtn');
        const italicBtn = document.getElementById('italicBtn');
        const linebreakBtn = document.getElementById('linebreakBtn');
        const colorPicker = document.getElementById('colorPicker');
        const copyBtn = document.getElementById('copyBtn');
        const editorOverlay = document.getElementById('editorOverlay');

        // 預覽更新函數
        function updatePreview() {
            const content = contentTextarea.value;
            previewBox.innerHTML = MarkupParser.toHTML(content);
        }

        // 按鈕事件綁定
        boldBtn.addEventListener('click', () => {
            MarkupParser.insertMarkup(contentTextarea, '{bold}', '{/bold}');
        });

        italicBtn.addEventListener('click', () => {
            MarkupParser.insertMarkup(contentTextarea, '{italic}', '{/italic}');
        });

        linebreakBtn.addEventListener('click', () => {
            const start = contentTextarea.selectionStart;
            const text = contentTextarea.value;
            contentTextarea.value = text.substring(0, start) + '/n' + text.substring(start);
            contentTextarea.selectionStart = contentTextarea.selectionEnd = start + 2;
            updatePreview();
        });

        colorPicker.addEventListener('change', () => {
            const color = colorPicker.value;
            MarkupParser.insertMarkup(contentTextarea, `{${color}}`, '{/color}');
        });

        copyBtn.addEventListener('click', () => {
            const text = contentTextarea.value;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✓ 已複製';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
        });

        // 關閉編輯器
        function closeEditor() {
            editorOverlay.style.display = 'none';
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closeEditor);
        cancelBtn.addEventListener('click', closeEditor);

        // 保存編輯
        saveBtn.addEventListener('click', () => {
            const content = contentTextarea.value;
            console.log('保存內容:', content);
            // 這裡可以發送到伺服器或存儲到本地存儲
            alert('內容已保存！\n\n' + content);
            closeEditor();
        });

        // 文本輸入時更新預覽
        contentTextarea.addEventListener('input', updatePreview);

        // 初始化預覽
        updatePreview();

        // 防止編輯器外層點擊關閉
        editorOverlay.addEventListener('click', (e) => {
            if (e.target === editorOverlay) {
                closeEditor();
            }
        });

        // ESC 鍵關閉
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && editorOverlay.style.display !== 'none') {
                closeEditor();
            }
        });

        // 頁面加載時允許滾動
        document.body.style.overflow = 'hidden';
    </script>
</body>
</html>
