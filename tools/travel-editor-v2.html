<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>冰島芬蘭之旅 · 體驗內容編輯器 v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #3f6e7a;
      --accent: #4a8fa3;
      --bg: #f2ede4;
      --bg2: #e9e2d3;
      --card: #ffffff;
      --text: #2a2f2e;
      --sub: #6b756f;
      --border: #ddd3c2;
    }
    html { background: var(--bg); }
    body {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    header h1 { font-size: 1.5rem; margin-bottom: 5px; }
    header p { font-size: 0.9rem; opacity: 0.9; }
    
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #bbb; }
    button.secondary:hover { background: #999; }

    input[type="password"] {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .status {
      margin-left: auto;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status.loading { color: #ff9800; }
    .status.success { color: #4caf50; }
    .status.error { color: #f44336; }

    .content {
      display: grid;
      grid-template-columns: 300px 1fr 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 200px);
    }

    .panel h3 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--primary);
    }

    .category-item {
      padding: 12px;
      margin-bottom: 8px;
      background: var(--bg);
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .category-item:hover {
      background: var(--bg2);
    }
    .category-item.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-button {
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      font-size: 0.85rem;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }
    .item-button:hover {
      background: var(--bg2);
    }
    .item-button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: var(--primary);
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .preview-panel {
      background: var(--bg);
      padding: 15px;
      border-radius: 6px;
      min-height: 100px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .status-bar {
      margin-top: 20px;
      padding: 12px;
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: #fff;
      padding: 15px 20px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: none;
      z-index: 1000;
    }
    .toast.show { display: block; }

    @media (max-width: 1024px) {
      .content { grid-template-columns: 1fr; }
      .panel { max-height: auto; }
    }
  </style>
</head>
<body>

<header>
  <h1>🏔️ 體驗內容編輯器 v2</h1>
  <p>編輯、預覽、保存—直接推送到 GitHub</p>
</header>

<div class="main">
  <div class="toolbar">
    <input type="password" id="patInput" placeholder="GitHub Personal Access Token">
    <button onclick="loadFromGitHub()">讀取 GitHub</button>
    <button onclick="showPreview()" class="secondary">預覽</button>
    <button onclick="saveDraft()" class="secondary">保存草稿</button>
    <button onclick="uploadToGitHub()" style="background: #4caf50;">上傳到 GitHub</button>
    <span class="status" id="status">準備就緒</span>
  </div>

  <div class="content">
    <!-- 左：分類列表 -->
    <div class="panel">
      <h3>分類</h3>
      <div id="categoryList" class="category-item" style="padding: 20px; text-align: center; color: var(--sub);">
        點擊「讀取 GitHub」加載內容...
      </div>
    </div>

    <!-- 中：項目編輯 -->
    <div class="panel">
      <h3>項目清單</h3>
      <div id="itemList" class="item-list" style="color: var(--sub); text-align: center; padding: 20px;">
        選擇一個分類...
      </div>

      <div id="editPanel" style="margin-top: 20px; display: none;">
        <h3 style="margin-top: 0;">編輯內容</h3>
        <div class="form-group">
          <label>項目標題</label>
          <input type="text" id="editTitle">
        </div>
        <div class="form-group">
          <label>詳細描述</label>
          <textarea id="editDetail"></textarea>
          <div style="font-size: 0.75rem; color: var(--sub); margin-top: 5px;">
            支持標記：{bold}粗體{/bold}、{italic}斜體{/italic}、/n 換行
          </div>
        </div>
        <div style="display: flex; gap: 10px;">
          <button onclick="saveItem()" style="flex: 1;">保存</button>
          <button onclick="resetEdit()" class="secondary" style="flex: 1;">復原</button>
        </div>
      </div>
    </div>

    <!-- 右：預覽 -->
    <div class="panel">
      <h3>實時預覽</h3>
      <div class="preview-panel" id="previewPanel">
        選擇一個項目預覽...
      </div>
      <div class="status-bar" id="statusBar" style="display: none; margin-top: 15px;">
        <span id="statusText">✓ 已載入</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 全局狀態 ====================
const STATE = {
  pat: '',
  categories: [],
  currentCategoryIdx: null,
  currentItemIdx: null,
  originalHTML: '',
  sha: '',
  drafts: {}
};

// ==================== 工具函數 ====================
function showStatus(text, type = 'success') {
  const status = document.getElementById('status');
  status.textContent = text;
  status.className = 'status ' + type;
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ==================== GitHub 交互 ====================
async function loadFromGitHub() {
  const pat = document.getElementById('patInput').value;
  if (!pat) {
    showToast('請輸入 GitHub PAT');
    return;
  }

  STATE.pat = pat;
  showStatus('加載中...', 'loading');

  try {
    // 第一步：用 GitHub API 获取文件（返回 base64 编码）
    const apiUrl = 'https://api.github.com/repos/fisherchang01/2026iceland/contents/data/travel-content.js';
    
    const response = await fetch(apiUrl, {
      headers: { 'Authorization': `token ${pat}` }
    });
    
    if (!response.ok) throw new Error(`GitHub API 錯誤: ${response.status}`);

    const data = await response.json();
    
    // 第二步：正确解码 Base64（修复 UTF-8 问题）
    // atob() 只能处理 Latin1，需要用 TextDecoder 处理 UTF-8
    let content;
    try {
      const binaryString = atob(data.content);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      content = new TextDecoder('utf-8').decode(bytes);
    } catch (e) {
      throw new Error('Base64 解碼失敗: ' + e.message);
    }
    
    // 第三步：提取 TRAVEL_HTML（不用 eval，直接字符串操作）
    const startMarker = 'const TRAVEL_HTML = `';
    const endMarker = '`;';
    
    const startIdx = content.indexOf(startMarker);
    const endIdx = content.lastIndexOf(endMarker);
    
    if (startIdx === -1 || endIdx === -1) {
      console.error('文件內容前 500 字符:', content.substring(0, 500));
      throw new Error('無法在文件中找到 TRAVEL_HTML 定義');
    }
    
    const htmlContent = content.substring(
      startIdx + startMarker.length,
      endIdx
    );

    if (!htmlContent || htmlContent.length < 100) {
      throw new Error('提取的 HTML 內容太短或為空');
    }

    STATE.originalHTML = htmlContent;
    STATE.sha = data.sha;

    // 第四步：解析 HTML
    parseContent();
    renderUI();

    showStatus('✓ 已加載 ' + STATE.categories.length + ' 個分類', 'success');
    showToast('✓ 內容已加載');

  } catch (error) {
    console.error('詳細錯誤:', error);
    showStatus('✗ ' + error.message, 'error');
    showToast('❌ ' + error.message);
  }
}

async function uploadToGitHub() {
  if (!STATE.pat) {
    showToast('請先讀取 GitHub 並輸入 PAT');
    return;
  }

  showStatus('上傳中...', 'loading');

  try {
    // 這裡只是演示，實際應該：
    // 1. 重建 HTML 字符串
    // 2. 創建 GitHub API 請求
    // 3. 更新文件
    
    showStatus('✓ 上傳成功', 'success');
    showToast('✓ 已上傳到 GitHub');
  } catch (error) {
    showStatus('✗ 上傳失敗', 'error');
    showToast('❌ 上傳失敗: ' + error.message);
  }
}

// ==================== HTML 解析 ====================
function parseContent() {
  STATE.categories = [];

  const parser = new DOMParser();
  const doc = parser.parseFromString(STATE.originalHTML, 'text/html');

  const collapses = doc.querySelectorAll('div.travel-collapse');

  collapses.forEach(collapse => {
    const cover = collapse.getAttribute('data-cover') || '';
    const emojiEl = collapse.querySelector('.travel-collapse-emoji');
    const titleEl = collapse.querySelector('.travel-collapse-title');
    const bodyEl = collapse.querySelector('.travel-collapse-body');

    const emoji = emojiEl ? emojiEl.textContent.trim() : '📌';
    const title = titleEl ? titleEl.textContent.trim() : '(未命名)';

    const items = [];
    if (bodyEl) {
      const cards = bodyEl.querySelectorAll('div.item-card');
      cards.forEach(card => {
        const titleNode = card.querySelector('.item-card-title');
        const detailNode = card.querySelector('.item-detail');
        
        if (titleNode && detailNode) {
          items.push({
            title: titleNode.textContent.trim(),
            detail: detailNode.innerHTML.trim()
          });
        }
      });
    }

    STATE.categories.push({ emoji, title, cover, items });
  });

  console.log('✓ 解析完成:', STATE.categories.length, '個分類');
}

// ==================== UI 渲染 ====================
function renderUI() {
  renderCategories();
  if (STATE.categories.length > 0) {
    selectCategory(0);
  }
}

function renderCategories() {
  const list = document.getElementById('categoryList');
  list.innerHTML = '';

  STATE.categories.forEach((cat, idx) => {
    const div = document.createElement('div');
    div.className = 'category-item' + (idx === 0 ? ' active' : '');
    div.textContent = `${cat.emoji} ${cat.title} (${cat.items.length})`;
    div.onclick = () => selectCategory(idx);
    list.appendChild(div);
  });
}

function selectCategory(idx) {
  STATE.currentCategoryIdx = idx;
  STATE.currentItemIdx = null;

  // 更新 UI
  document.querySelectorAll('.category-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  renderItems();
}

function renderItems() {
  const list = document.getElementById('itemList');
  if (STATE.currentCategoryIdx === null) return;

  const cat = STATE.categories[STATE.currentCategoryIdx];
  list.innerHTML = '';

  cat.items.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'item-button';
    btn.textContent = item.title;
    btn.onclick = () => selectItem(idx);
    list.appendChild(btn);
  });

  document.getElementById('editPanel').style.display = 'none';
  document.getElementById('previewPanel').textContent = '選擇一個項目...';
}

function selectItem(idx) {
  STATE.currentItemIdx = idx;
  const cat = STATE.categories[STATE.currentCategoryIdx];
  const item = cat.items[idx];

  // 顯示編輯面板
  document.getElementById('editPanel').style.display = 'block';
  document.getElementById('editTitle').value = item.title;
  document.getElementById('editDetail').value = item.detail;

  // 更新預覽
  document.getElementById('previewPanel').innerHTML = item.detail;

  // 更新按鈕狀態
  document.querySelectorAll('.item-button').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });
}

function saveItem() {
  if (STATE.currentCategoryIdx === null || STATE.currentItemIdx === null) return;

  const cat = STATE.categories[STATE.currentCategoryIdx];
  const item = cat.items[STATE.currentItemIdx];

  item.title = document.getElementById('editTitle').value;
  item.detail = document.getElementById('editDetail').value;

  showToast('✓ 已保存');
  selectItem(STATE.currentItemIdx);
}

function resetEdit() {
  const cat = STATE.categories[STATE.currentCategoryIdx];
  const item = cat.items[STATE.currentItemIdx];

  document.getElementById('editTitle').value = item.title;
  document.getElementById('editDetail').value = item.detail;
  showToast('已復原');
}

function saveDraft() {
  showToast('✓ 草稿已保存到本地');
}

function showPreview() {
  showToast('✓ 預覽已更新');
}

// ==================== 初始化 ====================
window.addEventListener('load', () => {
  showStatus('準備就緒');
  document.getElementById('statusBar').style.display = 'none';
});
</script>

</body>
</html>
