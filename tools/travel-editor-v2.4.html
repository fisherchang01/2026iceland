<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>冰島芬蘭之旅 · 體驗內容編輯器 v2.4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #3f6e7a;
      --accent: #4a8fa3;
      --bg: #f2ede4;
      --bg2: #e9e2d3;
      --card: #ffffff;
      --text: #2a2f2e;
      --sub: #6b756f;
      --border: #ddd3c2;
    }
    html { background: var(--bg); }
    body {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 12px 20px;
      text-align: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.3rem; margin-bottom: 3px; }
    header p { font-size: 0.85rem; opacity: 0.9; }
    
    .main {
      display: flex;
      gap: 0;
      flex: 1;
      overflow: hidden;
    }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--primary);
    }

    button {
      padding: 8px 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #bbb; }
    button.secondary:hover { background: #999; }
    
    button.color-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 50%;
    }
    button.red { background: #e74c3c; }
    button.red:hover { background: #c0392b; }
    button.blue { background: #3498db; }
    button.blue:hover { background: #2980b9; }
    button.green { background: #27ae60; }
    button.green:hover { background: #229954; }

    input[type="password"] {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-family: monospace;
      font-size: 0.8rem;
      width: 200px;
    }

    .status {
      margin-left: auto;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status.loading { color: #ff9800; }
    .status.success { color: #4caf50; }
    .status.error { color: #f44336; }

    /* 三列布局 */
    .panel-left {
      width: 260px;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-right {
      width: 280px;
      background: var(--card);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 15px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--primary);
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .category-item {
      padding: 10px;
      margin-bottom: 8px;
      background: var(--bg);
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
      word-break: break-word;
    }
    .category-item:hover {
      background: var(--bg2);
    }
    .category-item.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-button {
      padding: 8px 10px;
      background: #f5f1e8;
      border: 1px solid #e0d7c8;
      border-radius: 5px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      font-size: 0.8rem;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      color: #2a2f2e;
      font-weight: 500;
    }
    .item-button:hover {
      background: #ede5da;
      border-color: #d0c5b5;
    }
    .item-button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .edit-section {
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 0.8rem;
      color: var(--primary);
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-family: inherit;
      font-size: 0.85rem;
      resize: vertical;
    }
    .form-group textarea {
      min-height: 150px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      padding: 10px;
    }

    .tools-row {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tools-label {
      font-size: 0.75rem;
      color: var(--sub);
      font-weight: 600;
      width: 100%;
    }

    .preview-panel {
      background: var(--bg);
      padding: 12px;
      border-radius: 5px;
      min-height: 80px;
      font-size: 0.85rem;
      line-height: 1.7;
      word-break: break-word;
      overflow-y: auto;
      max-height: 100%;
    }

    .preview-panel p {
      margin-bottom: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .preview-panel img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 8px 0;
    }

    .preview-panel strong {
      font-weight: 700;
      color: #e74c3c;
    }

    .preview-panel em {
      font-style: italic;
      color: #3498db;
    }

    .status-bar {
      padding: 8px 12px;
      background: #e8f5e9;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: #2e7d32;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: #fff;
      padding: 12px 16px;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: none;
      z-index: 1000;
      font-size: 0.85rem;
    }
    .toast.show { display: block; }

    /* 滚动条美化 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--sub);
    }
  </style>
</head>
<body>

<header>
  <h1>🏔️ 體驗內容編輯器 v2.4</h1>
  <p>編輯、預覽、保存—直接推送到 GitHub</p>
</header>

<div class="toolbar">
  <input type="password" id="patInput" placeholder="GitHub Personal Access Token">
  <button onclick="loadFromGitHub()">讀取 GitHub</button>
  <button onclick="resetEdit()" class="secondary">復原</button>
  <button onclick="uploadToGitHub()" style="background: #4caf50;">上傳到 GitHub</button>
  <span class="status" id="status">準備就緒</span>
</div>

<div class="main">
  <!-- 左：分類列表 -->
  <div class="panel-left">
    <div class="panel-header">分類</div>
    <div class="panel-content" id="categoryList" style="text-align: center; color: var(--sub);">
      點擊「讀取 GitHub」加載內容...
    </div>
  </div>

  <!-- 中：編輯區 -->
  <div class="panel-center">
    <div class="panel-content" id="editContainer">
      <!-- 項目選擇 -->
      <div class="edit-section">
        <div class="panel-header" style="margin: -12px -12px 8px -12px;">項目清單</div>
        <div id="itemList" class="item-list" style="max-height: 100px; overflow-y: auto;"></div>
      </div>

      <!-- 編輯工具（總是顯示） -->
      <div class="edit-section">
        <div class="tools-label">格式工具</div>
        <div class="tools-row">
          <button onclick="insertMarkup('', '{bold}', '{/bold}')" title="粗體">B</button>
          <button onclick="insertMarkup('', '{italic}', '{/italic}')" title="斜體">I</button>
          <button onclick="insertMarkup('/n', '', '')" title="換行"style="font-size: 0.7rem;">⏎</button>
          <button onclick="insertMarkup('', '{#ff0000}', '{/color}')" class="color-btn red" title="紅色">R</button>
          <button onclick="insertMarkup('', '{#0066cc}', '{/color}')" class="color-btn blue" title="藍色">B</button>
          <button onclick="insertMarkup('', '{#00aa00}', '{/color}')" class="color-btn green" title="綠色">G</button>
        </div>
      </div>

      <!-- 標題 -->
      <div class="form-group">
        <label>項目標題</label>
        <input type="text" id="editTitle" placeholder="例：Skyr 優格">
      </div>

      <!-- 詳細描述 -->
      <div class="form-group">
        <label>詳細描述（支持標記）</label>
        <textarea id="editDetail" placeholder="詳細描述，支持 {bold}粗體{/bold}、/n 換行、顏色等" oninput="updatePreview()"></textarea>
      </div>

      <!-- 保存按鈕 -->
      <div style="display: flex; gap: 8px;">
        <button onclick="saveItem()" style="flex: 1;">保存此項目</button>
        <button onclick="resetEdit()" class="secondary" style="flex: 1;">復原</button>
      </div>
    </div>
  </div>

  <!-- 右：預覽 -->
  <div class="panel-right">
    <div class="panel-header">實時預覽</div>
    <div class="panel-content">
      <div class="preview-panel" id="previewPanel">
        選擇一個項目預覽...
      </div>
    </div>
    <div class="status-bar">
      <span id="statusText">✓ 就緒</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 全局狀態 ====================
const STATE = {
  pat: '',
  categories: [],
  currentCategoryIdx: null,
  currentItemIdx: null,
  originalHTML: ''
};

// ==================== 工具函數 ====================
function showStatus(text, type = 'success') {
  const status = document.getElementById('status');
  status.textContent = text;
  status.className = 'status ' + type;
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ==================== GitHub 交互 ====================
async function loadFromGitHub() {
  const pat = document.getElementById('patInput').value;
  if (!pat) {
    showToast('請輸入 GitHub PAT');
    return;
  }

  STATE.pat = pat;
  // 保存PAT到localStorage
  localStorage.setItem('travel_editor_pat', pat);
  
  showStatus('加載中...', 'loading');

  try {
    const fileUrl = 'https://raw.githubusercontent.com/fisherchang01/2026iceland/main/data/travel-content.js';
    
    const response = await fetch(fileUrl);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const content = await response.text();
    const match = content.match(/const TRAVEL_HTML = `([\s\S]*?)`;/);
    if (!match) throw new Error('無法找到 TRAVEL_HTML');
    
    STATE.originalHTML = match[1];
    parseContent();
    renderUI();

    showStatus('✓ 已加載 ' + STATE.categories.length + ' 個分類（PAT 已保存）', 'success');
    showToast('✓ 內容已加載，PAT 已保存');

  } catch (error) {
    console.error(error);
    showStatus('✗ ' + error.message, 'error');
    showToast('❌ ' + error.message);
  }
}

async function uploadToGitHub() {
  showToast('✓ 上傳功能開發中...');
}

// ==================== HTML 解析 ====================
function parseContent() {
  STATE.categories = [];

  console.log('📝 開始解析 HTML...');
  console.log('  原始 HTML 長度:', STATE.originalHTML.length);
  console.log('  包含 travel-collapse:', STATE.originalHTML.includes('travel-collapse'));

  // 方法1：用 DOMParser 的替代方案 - 創建 DOM 容器並直接操作
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = STATE.originalHTML;

  const collapses = tempDiv.querySelectorAll('div.travel-collapse');
  console.log('  找到分類數:', collapses.length);

  collapses.forEach((collapse, idx) => {
    const cover = collapse.getAttribute('data-cover') || '';
    const emojiEl = collapse.querySelector('.travel-collapse-emoji');
    const titleEl = collapse.querySelector('.travel-collapse-title');
    const bodyEl = collapse.querySelector('.travel-collapse-body');

    const emoji = emojiEl ? emojiEl.textContent.trim() : '📌';
    const title = titleEl ? titleEl.textContent.trim() : '(未命名)';

    const items = [];
    
    if (bodyEl) {
      // 遍歷所有 item-card
      const itemRows = bodyEl.querySelectorAll('div.item-row, div');
      let cardCount = 0;

      itemRows.forEach(row => {
        // 如果這個元素包含 item-card，提取所有卡片
        const cards = row.querySelectorAll('div.item-card');
        cards.forEach(card => {
          const titleNode = card.querySelector('.item-card-title');
          const detailNode = card.querySelector('.item-detail');
          
          if (titleNode && detailNode) {
            // 保留原始 innerHTML，這樣包含所有 HTML 標籤
            items.push({
              title: titleNode.textContent.trim(),
              detail: detailNode.innerHTML
            });
            cardCount++;
          }
        });
      });

      // 如果上面沒找到，直接在 bodyEl 中找 item-card
      if (cardCount === 0) {
        const cards = bodyEl.querySelectorAll('div.item-card');
        cards.forEach(card => {
          const titleNode = card.querySelector('.item-card-title');
          const detailNode = card.querySelector('.item-detail');
          
          if (titleNode && detailNode) {
            items.push({
              title: titleNode.textContent.trim(),
              detail: detailNode.innerHTML
            });
          }
        });
      }
    }

    STATE.categories.push({ emoji, title, cover, items });
  });

  console.log('✓ 解析完成:', STATE.categories.length, '個分類');
  STATE.categories.forEach((cat, idx) => {
    console.log(`  分類 ${idx}: ${cat.emoji} ${cat.title} (${cat.items.length} 項)`);
  });
}

// ==================== UI 渲染 ====================
function renderUI() {
  renderCategories();
  if (STATE.categories.length > 0) {
    selectCategory(0);
  }
}

function renderCategories() {
  const list = document.getElementById('categoryList');
  list.innerHTML = '';

  STATE.categories.forEach((cat, idx) => {
    const div = document.createElement('div');
    div.className = 'category-item' + (idx === 0 ? ' active' : '');
    div.textContent = `${cat.emoji} ${cat.title} (${cat.items.length})`;
    div.onclick = () => selectCategory(idx);
    list.appendChild(div);
  });
}

function selectCategory(idx) {
  STATE.currentCategoryIdx = idx;
  STATE.currentItemIdx = null;

  document.querySelectorAll('.category-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  renderItems();
}

function renderItems() {
  const list = document.getElementById('itemList');
  if (STATE.currentCategoryIdx === null) return;

  const cat = STATE.categories[STATE.currentCategoryIdx];
  list.innerHTML = '';

  if (cat.items.length === 0) {
    list.innerHTML = '<div style="padding: 10px; text-align: center; color: var(--sub);">此分類無項目</div>';
    return;
  }

  cat.items.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'item-button';
    btn.textContent = item.title;
    btn.style.marginBottom = '4px';
    btn.onclick = () => selectItem(idx);
    list.appendChild(btn);
  });

  // 如果有項目，自動選擇第一個
  if (cat.items.length > 0) {
    selectItem(0);
  }
}

function selectItem(idx) {
  STATE.currentItemIdx = idx;
  const cat = STATE.categories[STATE.currentCategoryIdx];
  const item = cat.items[idx];

  // textarea 显示原始 HTML 源码
  document.getElementById('editTitle').value = item.title;
  document.getElementById('editDetail').value = item.detail;  // 显示原始 HTML

  // 调试：显示实际长度
  console.log('📝 项目详情信息：');
  console.log('  标题:', item.title);
  console.log('  HTML长度:', item.detail.length, '字符');
  console.log('  首100字:', item.detail.substring(0, 100));
  console.log('  包含\\n:', item.detail.includes('\n'));
  console.log('  包含<p>:', item.detail.includes('<p>'));

  // 预览区用 innerHTML 渲染（这样才能显示分段、图片、格式等）
  const previewPanel = document.getElementById('previewPanel');
  previewPanel.innerHTML = item.detail || '（無內容）';

  document.querySelectorAll('.item-button').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });
}

function insertMarkup(before, open, close) {
  const textarea = document.getElementById('editDetail');
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const text = textarea.value;
  const selected = text.substring(start, end);

  const newText = text.substring(0, start) + before + open + selected + close + text.substring(end);
  textarea.value = newText;

  textarea.focus();
  textarea.selectionStart = start + before.length + open.length;
  textarea.selectionEnd = start + before.length + open.length + selected.length;
}

function saveItem() {
  if (STATE.currentCategoryIdx === null || STATE.currentItemIdx === null) return;

  const cat = STATE.categories[STATE.currentCategoryIdx];
  const item = cat.items[STATE.currentItemIdx];

  item.title = document.getElementById('editTitle').value;
  item.detail = document.getElementById('editDetail').value;

  // 保存后立即用 innerHTML 更新预览，这样才能显示分段、图片等
  document.getElementById('previewPanel').innerHTML = item.detail || '（無內容）';

  showToast('✓ 已保存');
}

function resetEdit() {
  if (STATE.currentItemIdx !== null) {
    selectItem(STATE.currentItemIdx);
  }
}

// 实时预览
function updatePreview() {
  const content = document.getElementById('editDetail').value;
  // 用 innerHTML 渲染，这样才能显示 HTML 格式、分段、图片等
  document.getElementById('previewPanel').innerHTML = content || '（無內容）';
}

// ==================== 初始化 ====================
window.addEventListener('load', () => {
  // 從 localStorage 恢復 PAT
  const savedPAT = localStorage.getItem('travel_editor_pat');
  if (savedPAT) {
    document.getElementById('patInput').value = savedPAT;
  }
  showStatus('準備就緒');
});
</script>

</body>
</html>
