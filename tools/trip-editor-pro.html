<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程編輯器 Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .layout {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            height: 100vh;
            gap: 1px;
            background: #ddd;
        }

        /* ===== 左邊：景點列表 ===== */
        .sidebar {
            background: white;
            overflow-y: auto;
            padding: 12px;
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .day-btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 4px;
            border: 1px solid #e5e5e5;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 11px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .day-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .day-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .spot-btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 3px;
            border: 1px solid #e5e5e5;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 11px;
            color: #555;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spot-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .spot-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
            font-weight: 600;
        }

        /* ===== 中間：編輯器 ===== */
        .editor {
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
        }

        .editor-header h2 {
            font-size: 18px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spot-icon {
            font-size: 28px;
        }

        .editor-toolbar {
            padding: 10px 16px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .toolbar-btn {
            padding: 6px 10px;
            border: 1px solid #d0d0d0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        .color-picker {
            width: 24px;
            height: 24px;
            border: 1px solid #d0d0d0;
            cursor: pointer;
            padding: 2px;
        }

        .editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* desc - 單行 */
        .field-group.desc input {
            padding: 8px 10px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
        }

        .field-group.desc input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        /* deepDesc - 5 行 textarea */
        .field-group.deepdesc {
            flex: 1;
            min-height: 0;
        }

        .field-group.deepdesc textarea {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            resize: none;
            min-height: 120px;
        }

        .field-group.deepdesc textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .editor-footer {
            padding: 10px 16px;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e5e5e5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        /* ===== 右邊：實時預覽 ===== */
        .preview-panel {
            background: #f9f9f9;
            border-left: 1px solid #e5e5e5;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .preview-title {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preview-box {
            background: white;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #e5e5e5;
            font-size: 12px;
            line-height: 1.6;
            color: #333;
            max-height: 200px;
            overflow-y: auto;
        }

        .preview-box em {
            color: #999;
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 12px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 12px;
            background: #d4edda;
            color: #155724;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 999;
        }

        .notification.error {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 1200px) {
            .layout {
                grid-template-columns: 200px 1fr;
            }

            .preview-panel {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 150px;
                border-bottom: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 左邊：景點列表 -->
        <div class="sidebar" id="sidebar"></div>

        <!-- 中間：編輯器 -->
        <div class="editor" id="editor">
            <div class="empty-state">請在左側選擇一個景點開始編輯</div>
        </div>

        <!-- 右邊：預覽 -->
        <div class="preview-panel" id="previewPanel">
            <div class="preview-title">📝 實時預覽</div>
            <div id="previewContent" style="color: #999; font-size: 12px;">（選擇景點查看預覽）</div>
        </div>
    </div>

    <script>
        // ===== 配置 =====
        const GITHUB_OWNER = 'fisherchang01';
        const GITHUB_REPO = '2026iceland';
        const GITHUB_FILE = 'data/trip-details.js';

        // ===== 狀態 =====
        let tripData = null;
        let currentDay = null;
        let currentSpotIndex = null;

        // ===== UTF-8 Base64 編碼 =====
        function utf8ToBase64(str) {
            try {
                return btoa(unescape(encodeURIComponent(str)));
            } catch(e) {
                const encoder = new TextEncoder();
                const data = encoder.encode(str);
                let binary = '';
                for (let i = 0; i < data.length; i++) {
                    binary += String.fromCharCode(data[i]);
                }
                return btoa(binary);
            }
        }

        // ===== 標記解析 =====
        function parseMarkup(str) {
            if (!str) return '<em>（空）</em>';
            let html = str
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/\/n/g, '<br>')
                .replace(/\{#([0-9a-fA-F]{6})\}([^{]*?)\{\/color\}/g, '<span style="color: #$1;">$2</span>')
                .replace(/\{bold\}([^{]*?)\{\/bold\}/g, '<strong>$1</strong>')
                .replace(/\{italic\}([^{]*?)\{\/italic\}/g, '<em>$1</em>');
            return html;
        }

        // ===== 初始化 =====
        async function init() {
            await loadTripData();
            renderSidebar();
        }

        // ===== 加載數據 =====
        async function loadTripData() {
            try {
                const response = await fetch(
                    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_FILE}`
                );
                const content = await response.text();
                const match = content.match(/const TRIP = ({[\s\S]*?});/);
                if (!match) throw new Error('無法解析數據');
                eval(`tripData = ${match[1]}`);
            } catch(e) {
                console.error('加載失敗:', e);
                showNotif('加載失敗: ' + e.message, 'error');
            }
        }

        // ===== 渲染側邊欄 =====
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';

            const daysSection = document.createElement('div');
            daysSection.innerHTML = '<div class="sidebar-title">📅 日期</div>';

            Object.keys(tripData).forEach((dayKey, idx) => {
                const day = tripData[dayKey];
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.textContent = `Day ${day.num}: ${day.title}`;
                btn.onclick = () => selectDay(dayKey);
                daysSection.appendChild(btn);
            });

            sidebar.appendChild(daysSection);

            const spotsSection = document.createElement('div');
            spotsSection.id = 'spotsSection';
            sidebar.appendChild(spotsSection);
        }

        // ===== 選擇日期 =====
        function selectDay(dayKey) {
            currentDay = dayKey;
            currentSpotIndex = null;

            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(`Day ${tripData[dayKey].num}:`));
            });

            renderSpots();
            clearEditor();
        }

        // ===== 渲染景點列表 =====
        function renderSpots() {
            const section = document.getElementById('spotsSection');
            section.innerHTML = `<div class="sidebar-title">🏔️ 景點</div>`;

            const day = tripData[currentDay];
            if (!day.spots) return;

            day.spots.forEach((spot, idx) => {
                const btn = document.createElement('button');
                btn.className = 'spot-btn';
                btn.textContent = `${spot.icon} ${spot.name}`;
                btn.title = spot.name;
                btn.onclick = () => selectSpot(idx);
                section.appendChild(btn);
            });
        }

        // ===== 選擇景點 =====
        function selectSpot(idx) {
            currentSpotIndex = idx;

            document.querySelectorAll('.spot-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === idx);
            });

            renderEditor();
        }

        // ===== 清空編輯器 =====
        function clearEditor() {
            const editor = document.getElementById('editor');
            editor.innerHTML = '<div class="empty-state">請選擇一個景點開始編輯</div>';
            updatePreview('', '');
        }

        // ===== 渲染編輯器 =====
        function renderEditor() {
            const day = tripData[currentDay];
            const spot = day.spots[currentSpotIndex];
            const editor = document.getElementById('editor');

            editor.innerHTML = `
                <div class="editor-header">
                    <h2><span class="spot-icon">${spot.icon}</span>${spot.name}</h2>
                </div>

                <div class="editor-toolbar">
                    <button class="toolbar-btn" onclick="insertFormatDeep('{bold}', '{/bold}')"><strong>B</strong></button>
                    <button class="toolbar-btn" onclick="insertFormatDeep('{italic}', '{/italic}')"><em>I</em></button>
                    <button class="toolbar-btn" onclick="insertFormatDeep('/n', '')">↵ 換行</button>
                    <button class="toolbar-btn" style="display:flex; align-items:center; gap:4px; padding: 6px 8px;">
                        🎨 <input type="color" class="color-picker" id="colorPicker" value="#ff0000" onchange="insertColorDeep(this.value)">
                    </button>
                </div>

                <div class="editor-content">
                    <div class="field-group desc">
                        <label>簡短介紹 (desc)</label>
                        <input type="text" id="descInput" value="${escapeAttr(spot.desc || '')}" oninput="updatePreview()">
                    </div>

                    <div class="field-group deepdesc">
                        <label>詳細描述 (deepDesc)</label>
                        <textarea id="deepDescInput" oninput="updatePreview()">${escapeAttr(spot.deepDesc || '')}</textarea>
                    </div>

                    <div class="field-group">
                        <label>衛生間 (toilet)</label>
                        <input type="text" id="toiletInput" value="${escapeAttr(spot.toilet || '')}" onchange="updateSpotField('toilet', this.value)">
                    </div>

                    <div class="field-group">
                        <label>地圖 (map)</label>
                        <input type="text" id="mapInput" value="${escapeAttr(spot.map || '')}" onchange="updateSpotField('map', this.value)">
                    </div>
                </div>

                <div class="editor-footer">
                    <button class="btn btn-secondary" onclick="discardChanges()">放棄</button>
                    <button class="btn btn-primary" id="saveBtn" onclick="saveToGitHub()">💾 保存</button>
                </div>
            `;

            updatePreview();
        }

        // ===== 更新景點字段 =====
        function updateSpotField(field, value) {
            if (!currentDay || currentSpotIndex === null) return;
            tripData[currentDay].spots[currentSpotIndex][field] = value;
        }

        // ===== 更新預覽 =====
        function updatePreview() {
            const descInput = document.getElementById('descInput');
            const deepDescInput = document.getElementById('deepDescInput');
            
            if (!descInput || !deepDescInput) return;

            const previewContent = document.getElementById('previewContent');
            previewContent.innerHTML = `
                <div class="preview-box">
                    <div style="margin-bottom: 10px;">
                        <div style="font-size: 10px; color: #999; margin-bottom: 4px;">簡短介紹</div>
                        ${parseMarkup(descInput.value)}
                    </div>
                </div>

                <div class="preview-box">
                    <div style="font-size: 10px; color: #999; margin-bottom: 4px;">詳細描述</div>
                    ${parseMarkup(deepDescInput.value)}
                </div>
            `;
        }

        // ===== 插入格式到 desc =====
        function insertFormatDesc(before, after) {
            const input = document.getElementById('descInput');
            if (!input) return;
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            const selected = text.substring(start, end) || '文本';
            input.value = text.substring(0, start) + before + selected + after + text.substring(end);
            input.focus();
            updatePreview();
        }

        // ===== 插入格式到 deepDesc =====
        function insertFormatDeep(before, after) {
            const input = document.getElementById('deepDescInput');
            if (!input) return;
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            const selected = text.substring(start, end) || '文本';
            input.value = text.substring(0, start) + before + selected + after + text.substring(end);
            input.focus();
            updatePreview();
        }

        // ===== 应用颜色到 desc =====
        function insertColorDesc(color) {
            console.log('颜色选择:', color);
            const hex = color.substring(1);
            insertFormatDesc(`{#${hex}}`, '{/color}');
        }

        // ===== 应用颜色到 deepDesc =====
        function insertColorDeep(color) {
            console.log('颜色选择:', color);
            const hex = color.substring(1);
            insertFormatDeep(`{#${hex}}`, '{/color}');
        }

        function discardChanges() {
            if (confirm('放棄未保存的變更？')) {
                renderEditor();
            }
        }

        // ===== 保存到 GitHub =====
        async function saveToGitHub() {
            if (!currentDay || currentSpotIndex === null) return;

            const descInput = document.getElementById('descInput');
            const deepDescInput = document.getElementById('deepDescInput');
            const toiletInput = document.getElementById('toiletInput');
            const mapInput = document.getElementById('mapInput');
            const saveBtn = document.getElementById('saveBtn');

            const spot = tripData[currentDay].spots[currentSpotIndex];
            spot.desc = descInput.value.trim();
            spot.deepDesc = deepDescInput.value.trim();
            if (toiletInput) spot.toilet = toiletInput.value.trim();
            if (mapInput) spot.map = mapInput.value.trim();

            saveBtn.disabled = true;
            saveBtn.textContent = '⏳ 保存中...';

            try {
                const pat = getPAT();

                // 獲取最新的文件
                const getResp = await fetch(
                    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_FILE}`
                );
                const oldContent = await getResp.text();
                const header = oldContent.substring(0, oldContent.indexOf('const TRIP = {'));
                const footer = oldContent.substring(oldContent.indexOf('};') + 2);
                const newContent = header + 'const TRIP = ' + JSON.stringify(tripData, null, 2) + ';\n' + footer;

                // 獲取 SHA
                const shaResp = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                    { headers: { 'Authorization': `token ${pat}` } }
                );
                const fileData = await shaResp.json();

                // 更新文件
                const updateResp = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${pat}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `✏️ 編輯景點: ${spot.name}`,
                            content: utf8ToBase64(newContent),
                            sha: fileData.sha
                        })
                    }
                );

                if (!updateResp.ok) throw new Error('更新失敗');

                showNotif('✅ 已保存到 GitHub！網站將在 30 秒內更新', 'success');

            } catch(e) {
                showNotif('❌ 錯誤: ' + e.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 保存';
            }
        }

        function getPAT() {
            let pat = localStorage.getItem('github_pat');
            if (!pat) {
                pat = prompt('🔑 輸入 GitHub Personal Access Token\n(https://github.com/settings/tokens → Generate new token → repo)');
                if (pat) {
                    localStorage.setItem('github_pat', pat);
                } else {
                    throw new Error('需要 PAT');
                }
            }
            return pat;
        }

        function showNotif(msg, type = 'success') {
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = msg;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 4000);
        }

        // 啟動
        window.addEventListener('load', init);
    </script>
</body>
</html>
