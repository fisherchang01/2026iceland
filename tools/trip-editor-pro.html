<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程編輯器 Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }

        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: white;
            padding: 16px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 4px;
        }

        .header p {
            color: #666;
            font-size: 12px;
        }

        .main {
            display: grid;
            grid-template-columns: 300px 1fr;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        .sidebar {
            background: white;
            overflow-y: auto;
            padding: 16px;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
            border-right: 1px solid #e5e5e5;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .day-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #e5e5e5;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }

        .day-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .day-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .spot-btn {
            display: block;
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 6px;
            border: 1px solid #e5e5e5;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 12px;
            color: #555;
            transition: all 0.2s;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        .spot-btn:hover {
            background: #f0f0f0;
            border-color: #ccc;
        }

        .spot-btn.active {
            background: #e3e7ff;
            border-color: #667eea;
            color: #667eea;
            font-weight: 600;
        }

        .editor-panel {
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
        }

        .editor-header h2 {
            font-size: 18px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spot-icon {
            font-size: 28px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-badge.unsaved {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.saved {
            background: #d4edda;
            color: #155724;
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 8px 12px;
            border: 1px solid #d0d0d0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        .toolbar-btn:active {
            background: #e5e5e5;
        }

        .color-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
        }

        .color-picker {
            width: 28px;
            height: 28px;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            cursor: pointer;
            padding: 2px;
        }

        .editor-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 24px;
            overflow-y: auto;
        }

        .editor-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-height: 0;
        }

        .editor-field label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: none;
            transition: border-color 0.2s;
            min-height: 100px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .preview-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 8px;
        }

        .preview-box {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
            color: #333;
            border: 1px solid #e5e5e5;
            max-height: 80px;
            overflow-y: auto;
        }

        .colored-text {
            font-weight: 500;
        }

        .editor-footer {
            display: flex;
            gap: 12px;
            padding: 16px 24px;
            border-top: 1px solid #e5e5e5;
            flex-shrink: 0;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            background: #e5e5e5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .notification {
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .notification.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .notification.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .main {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #e5e5e5;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 行程編輯器 Pro</h1>
            <p>選擇景點 → 編輯內容 → 直接保存到 GitHub</p>
        </div>

        <div class="main">
            <!-- Sidebar -->
            <div class="sidebar">
                <div id="daysContainer"></div>
            </div>

            <!-- Editor Panel -->
            <div class="editor-panel" id="editorPanel">
                <div class="empty-state">
                    請在左側選擇一個景點開始編輯
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 配置 =====
        const GITHUB_OWNER = 'fisherchang01';
        const GITHUB_REPO = '2026iceland';
        const GITHUB_FILE = 'data/trip-details.js';

        // ===== 狀態 =====
        let tripData = null;
        let currentDay = null;
        let currentSpotIndex = null;
        let hasChanges = false;
        let tripDataContent = '';

        // ===== UTF-8 Base64 編碼 =====
        function utf8ToBase64(str) {
            try {
                return btoa(unescape(encodeURIComponent(str)));
            } catch(e) {
                // 備用方案：使用 TextEncoder
                const encoder = new TextEncoder();
                const data = encoder.encode(str);
                let binary = '';
                for (let i = 0; i < data.length; i++) {
                    binary += String.fromCharCode(data[i]);
                }
                return btoa(binary);
            }
        }

        // ===== 初始化 =====
        async function init() {
            await loadTripData();
            renderDaysList();
        }

        // ===== 加載數據 =====
        async function loadTripData() {
            try {
                const response = await fetch(
                    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_FILE}`
                );
                tripDataContent = await response.text();
                
                const tripMatch = tripDataContent.match(/const TRIP = ({[\s\S]*?});/);
                if (!tripMatch) throw new Error('無法解析 TRIP 數據');
                
                eval(`tripData = ${tripMatch[1]}`);
            } catch(error) {
                console.error('❌ 加載失敗:', error);
                showNotification('加載數據失敗', 'error');
            }
        }

        // ===== 渲染日期列表 =====
        function renderDaysList() {
            const container = document.getElementById('daysContainer');
            container.innerHTML = '';

            const section = document.createElement('div');
            section.className = 'sidebar-section';

            const title = document.createElement('div');
            title.className = 'sidebar-title';
            title.textContent = '📅 日期';
            section.appendChild(title);

            Object.keys(tripData).forEach((dayKey, idx) => {
                const day = tripData[dayKey];
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.textContent = `Day ${day.num}: ${day.title}`;
                btn.onclick = () => selectDay(dayKey);
                section.appendChild(btn);
            });

            container.appendChild(section);
        }

        // ===== 選擇日期 =====
        function selectDay(dayKey) {
            currentDay = dayKey;
            currentSpotIndex = null;

            document.querySelectorAll('.day-btn').forEach((btn, i) => {
                btn.classList.toggle('active', Object.keys(tripData)[i] === dayKey);
            });

            renderSpotsList();
            clearEditor();
        }

        // ===== 渲染景點列表 =====
        function renderSpotsList() {
            const container = document.getElementById('daysContainer');
            let spotsSection = container.querySelector('[data-spots]');
            
            if (!spotsSection) {
                spotsSection = document.createElement('div');
                spotsSection.className = 'sidebar-section';
                spotsSection.setAttribute('data-spots', 'true');
                container.appendChild(spotsSection);
            }

            const day = tripData[currentDay];
            spotsSection.innerHTML = `<div class="sidebar-title">🏔️ 景點</div>`;

            if (!day.spots || day.spots.length === 0) {
                spotsSection.innerHTML += '<p style="color: #999; font-size: 12px;">此日期無景點</p>';
                return;
            }

            day.spots.forEach((spot, index) => {
                const btn = document.createElement('button');
                btn.className = 'spot-btn';
                btn.textContent = `${spot.icon || '📍'} ${spot.name}`;
                btn.onclick = () => selectSpot(index);
                btn.title = spot.name; // 懸停時顯示完整名稱
                spotsSection.appendChild(btn);
            });
        }

        // ===== 選擇景點 =====
        function selectSpot(spotIndex) {
            currentSpotIndex = spotIndex;

            document.querySelectorAll('.spot-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === spotIndex);
            });

            renderEditor();
        }

        // ===== 渲染編輯器 =====
        function renderEditor() {
            const day = tripData[currentDay];
            const spot = day.spots[currentSpotIndex];

            const panel = document.getElementById('editorPanel');
            panel.innerHTML = `
                <div class="editor-header">
                    <h2>
                        <span class="spot-icon">${spot.icon || '📍'}</span>
                        <span>${spot.name}</span>
                    </h2>
                    <span class="status-badge saved" id="statusBadge">✅ 已保存</span>
                </div>

                <div class="editor-toolbar">
                    <button class="toolbar-btn" onclick="insertMarkup('desc', '{bold}', '{/bold}')" title="粗體"><strong>B</strong></button>
                    <button class="toolbar-btn" onclick="insertMarkup('desc', '{italic}', '{/italic}')" title="斜體"><em>I</em></button>
                    <button class="toolbar-btn" onclick="insertMarkup('desc', '/n', '')" title="換行">↵ 換行</button>
                    <button class="toolbar-btn color-btn" title="選擇顏色">
                        🎨 顏色
                        <input type="color" class="color-picker" id="colorPicker" value="#ff0000" onchange="applyColor()">
                    </button>
                </div>

                <div class="editor-content">
                    <div class="editor-field">
                        <label>簡短介紹 (desc) - 顯示在行程列表</label>
                        <textarea id="descField" placeholder="輸入簡短介紹...">${escapeHtml(spot.desc || '')}</textarea>
                        <div class="preview-label">預覽</div>
                        <div class="preview-box" id="descPreview"></div>
                    </div>

                    <div class="editor-field">
                        <label>詳細描述 (deepDesc) - 點擊景點後顯示</label>
                        <textarea id="deepDescField" placeholder="輸入詳細描述...">${escapeHtml(spot.deepDesc || '')}</textarea>
                        <div class="preview-label">預覽</div>
                        <div class="preview-box" id="deepDescPreview"></div>
                    </div>
                </div>

                <div class="editor-footer">
                    <button class="btn btn-secondary" onclick="discardChanges()">放棄變更</button>
                    <button class="btn btn-primary" id="saveBtn" onclick="saveToGitHub()">💾 保存到 GitHub</button>
                </div>
            `;

            // 綁定事件
            document.getElementById('descField').addEventListener('input', () => {
                updatePreview('desc');
                markAsChanged();
            });

            document.getElementById('deepDescField').addEventListener('input', () => {
                updatePreview('deep');
                markAsChanged();
            });

            updatePreview('desc');
            updatePreview('deep');
            markAsSaved();
        }

        // ===== HTML 轉義 =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== 應用顏色 =====
        function applyColor() {
            const colorPicker = document.getElementById('colorPicker');
            const color = colorPicker.value.substring(1);
            insertMarkup('desc', `{#${color}}`, '{/color}');
        }

        // ===== 插入標記 =====
        function insertMarkup(field, before, after) {
            const fieldId = field === 'desc' ? 'descField' : 'deepDescField';
            const textarea = document.getElementById(fieldId);
            if (!textarea) return;

            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const selected = text.substring(start, end) || '文本';

            const newText = text.substring(0, start) + before + selected + after + text.substring(end);
            textarea.value = newText;
            textarea.selectionStart = start + before.length;
            textarea.selectionEnd = start + before.length + selected.length;
            
            updatePreview(field);
            markAsChanged();
            textarea.focus();
        }

        // ===== 更新預覽 =====
        function updatePreview(field) {
            const textarea = document.getElementById(field === 'desc' ? 'descField' : 'deepDescField');
            const preview = document.getElementById(field === 'desc' ? 'descPreview' : 'deepDescPreview');
            if (!textarea) return;
            preview.innerHTML = parseMarkup(textarea.value);
        }

        // ===== 解析標記 =====
        function parseMarkup(text) {
            if (!text) return '<em style="color: #999;">（空）</em>';
            let html = escapeHtml(text)
                .replace(/\/n/g, '<br>')
                .replace(/\{#([0-9a-fA-F]{6})\}([^{]*?)\{\/color\}/g, 
                    '<span class="colored-text" style="color: #$1">$2</span>')
                .replace(/\{bold\}([^{]*?)\{\/bold\}/g, '<strong>$1</strong>')
                .replace(/\{italic\}([^{]*?)\{\/italic\}/g, '<em>$1</em>');
            return html;
        }

        // ===== 標記為已變更 =====
        function markAsChanged() {
            hasChanges = true;
            const badge = document.getElementById('statusBadge');
            if (badge) {
                badge.className = 'status-badge unsaved';
                badge.textContent = '✏️ 未保存';
            }
        }

        // ===== 標記為已保存 =====
        function markAsSaved() {
            hasChanges = false;
            const badge = document.getElementById('statusBadge');
            if (badge) {
                badge.className = 'status-badge saved';
                badge.textContent = '✅ 已保存';
            }
        }

        // ===== 清空編輯器 =====
        function clearEditor() {
            const panel = document.getElementById('editorPanel');
            panel.innerHTML = '<div class="empty-state">選擇一個景點開始編輯</div>';
        }

        // ===== 放棄變更 =====
        function discardChanges() {
            if (hasChanges && !confirm('確定放棄未保存的變更？')) return;
            renderEditor();
        }

        // ===== 保存到 GitHub =====
        async function saveToGitHub() {
            if (!currentDay || currentSpotIndex === null) return;

            const descField = document.getElementById('descField');
            const deepDescField = document.getElementById('deepDescField');
            const saveBtn = document.getElementById('saveBtn');

            const newDesc = descField.value.trim();
            const newDeepDesc = deepDescField.value.trim();

            if (!newDesc || !newDeepDesc) {
                showNotification('簡短介紹和詳細描述都不能為空', 'error');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner"></span> 保存中...';

            try {
                const pat = getPAT();

                // 更新本地數據
                tripData[currentDay].spots[currentSpotIndex].desc = newDesc;
                tripData[currentDay].spots[currentSpotIndex].deepDesc = newDeepDesc;

                // 生成新的 JS 代碼
                const newContent = generateTripJS();

                // 獲取當前文件 SHA
                const getResponse = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                    {
                        headers: {
                            'Authorization': `token ${pat}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );

                if (!getResponse.ok) throw new Error('無法獲取文件信息（PAT 可能無效）');

                const fileData = await getResponse.json();

                // 更新文件
                const updateResponse = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${pat}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `✏️ 編輯景點: ${tripData[currentDay].spots[currentSpotIndex].name}`,
                            content: utf8ToBase64(newContent),
                            sha: fileData.sha
                        })
                    }
                );

                if (!updateResponse.ok) {
                    const error = await updateResponse.json();
                    throw new Error(error.message || '更新失敗');
                }

                showNotification('✅ 成功保存到 GitHub！網站將在 30 秒內自動更新', 'success');
                markAsSaved();
            } catch(error) {
                showNotification('❌ 保存失敗: ' + error.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '💾 保存到 GitHub';
            }
        }

        // ===== 生成 JS 代碼 =====
        function generateTripJS() {
            const header = tripDataContent.substring(0, tripDataContent.indexOf('const TRIP = {'));
            const footer = tripDataContent.substring(tripDataContent.indexOf('};') + 2);
            const tripJson = JSON.stringify(tripData, null, 2);
            return `${header}const TRIP = ${tripJson};\n${footer}`;
        }

        // ===== 取得 PAT =====
        function getPAT() {
            let pat = localStorage.getItem('github_pat');
            if (!pat) {
                pat = prompt('🔑 首次使用需要 GitHub PAT\n\n1. 打開 https://github.com/settings/tokens\n2. 點「Generate new token」→「classic」\n3. 勾選「repo」權限\n4. 複製 Token 貼在這裡');
                if (pat) {
                    localStorage.setItem('github_pat', pat);
                } else {
                    throw new Error('需要 PAT 才能保存');
                }
            }
            return pat;
        }

        // ===== 通知 =====
        function showNotification(message, type = 'info') {
            const panel = document.getElementById('editorPanel');
            if (!panel) return;

            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            
            const content = panel.querySelector('.editor-content');
            if (content) {
                content.insertBefore(notification, content.firstChild);
                setTimeout(() => notification.remove(), 5000);
            }
        }

        // ===== 啟動 =====
        window.addEventListener('load', init);
    </script>
</body>
</html>
