<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程編輯器 Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            background: white;
            border-right: 1px solid #e5e5e5;
            overflow-y: auto;
            padding: 16px;
            box-shadow: 2px 0 4px rgba(0, 0, 0, 0.05);
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .day-btn, .spot-btn {
            display: block;
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 6px;
            border: 1px solid #e5e5e5;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 12px;
            color: #333;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .day-btn:hover, .spot-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .day-btn.active, .spot-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
            font-weight: 600;
        }

        /* ===== 编辑区 ===== */
        .editor-main {
            display: flex;
            flex-direction: column;
            background: white;
            overflow: hidden;
        }

        .editor-header {
            padding: 16px 24px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .editor-header h2 {
            font-size: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spot-icon {
            font-size: 32px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-badge.saved {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.unsaved {
            background: #fff3cd;
            color: #856404;
        }

        .editor-toolbar {
            padding: 12px 24px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .toolbar-btn {
            padding: 8px 12px;
            border: 1px solid #d0d0d0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        .color-picker {
            width: 28px;
            height: 28px;
            border: 1px solid #d0d0d0;
            cursor: pointer;
        }

        .editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-group label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        /* 简短介绍区域 - 单行 */
        .field-group.desc-field input {
            padding: 10px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            transition: border-color 0.2s;
        }

        .field-group.desc-field input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 详细描述区域 - 5行可滚动 */
        .field-group.deep-desc-field {
            flex: 1;
            min-height: 0;
        }

        .field-group.deep-desc-field textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            resize: none;
            height: 150px;
            transition: border-color 0.2s;
        }

        .field-group.deep-desc-field textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 其他字段 */
        .field-group input,
        .field-group textarea {
            padding: 10px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .field-group input:focus,
        .field-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 标签字段 */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: #e3e7ff;
            color: #667eea;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
        }

        .tag input {
            flex: 1;
            background: none;
            border: none;
            padding: 0;
            font-size: 12px;
            min-width: 100px;
        }

        .editor-footer {
            padding: 16px 24px;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e5e5e5;
            color: #333;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .notification {
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .notification.success {
            background: #d4edda;
            color: #155724;
        }

        .notification.error {
            background: #f8d7da;
            color: #721c24;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* nextStop JSON 编辑 */
        .json-editor {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid #e5e5e5;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #e5e5e5;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar"></div>

        <!-- 编辑器 -->
        <div class="editor-main" id="editorMain">
            <div class="empty-state">請在左側選擇一個景點開始編輯</div>
        </div>
    </div>

    <script>
        // ===== 配置 =====
        const GITHUB_OWNER = 'fisherchang01';
        const GITHUB_REPO = '2026iceland';
        const GITHUB_FILE = 'data/trip-details.js';

        // ===== 状态 =====
        let tripData = null;
        let currentDay = null;
        let currentSpotIndex = null;
        let hasChanges = false;

        // ===== UTF-8 Base64 编码 =====
        function utf8ToBase64(str) {
            try {
                return btoa(unescape(encodeURIComponent(str)));
            } catch(e) {
                const encoder = new TextEncoder();
                const data = encoder.encode(str);
                let binary = '';
                for (let i = 0; i < data.length; i++) {
                    binary += String.fromCharCode(data[i]);
                }
                return btoa(binary);
            }
        }

        // ===== 初始化 =====
        async function init() {
            await loadTripData();
            renderSidebar();
        }

        // ===== 加载数据 =====
        async function loadTripData() {
            try {
                const response = await fetch(
                    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_FILE}`
                );
                const content = await response.text();
                const match = content.match(/const TRIP = ({[\s\S]*?});/);
                if (!match) throw new Error('无法解析数据');
                eval(`tripData = ${match[1]}`);
            } catch(e) {
                console.error('加载失败:', e);
            }
        }

        // ===== 渲染侧边栏 =====
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';

            // 日期列表
            const daysSection = document.createElement('div');
            daysSection.innerHTML = '<div class="sidebar-title">📅 日期</div>';

            Object.keys(tripData).forEach((dayKey, idx) => {
                const day = tripData[dayKey];
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.textContent = `Day ${day.num}: ${day.title}`;
                btn.onclick = () => selectDay(dayKey);
                daysSection.appendChild(btn);
            });

            sidebar.appendChild(daysSection);

            // 景点列表容器
            const spotsSection = document.createElement('div');
            spotsSection.id = 'spotsSection';
            sidebar.appendChild(spotsSection);
        }

        // ===== 选择日期 =====
        function selectDay(dayKey) {
            currentDay = dayKey;
            currentSpotIndex = null;

            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(`Day ${tripData[dayKey].num}:`));
            });

            renderSpots();
        }

        // ===== 渲染景点列表 =====
        function renderSpots() {
            const section = document.getElementById('spotsSection');
            section.innerHTML = `<div class="sidebar-title">🏔️ 景點</div>`;

            const day = tripData[currentDay];
            if (!day.spots) return;

            day.spots.forEach((spot, idx) => {
                const btn = document.createElement('button');
                btn.className = 'spot-btn';
                btn.textContent = `${spot.icon} ${spot.name}`;
                btn.title = spot.name;
                btn.onclick = () => selectSpot(idx);
                section.appendChild(btn);
            });
        }

        // ===== 选择景点 =====
        function selectSpot(idx) {
            currentSpotIndex = idx;

            document.querySelectorAll('.spot-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === idx);
            });

            renderEditor();
        }

        // ===== 渲染编辑器 =====
        function renderEditor() {
            const day = tripData[currentDay];
            const spot = day.spots[currentSpotIndex];
            const main = document.getElementById('editorMain');

            const tagsHtml = Array.isArray(spot.tags) ? spot.tags.map(t => 
                `<span class="tag">${t} <button onclick="removeTag(${currentSpotIndex}, '${t}')">×</button></span>`
            ).join('') : '';

            const nextStopJson = spot.nextStop ? JSON.stringify(spot.nextStop, null, 2) : '{}';

            main.innerHTML = `
                <div class="editor-header">
                    <h2><span class="spot-icon">${spot.icon}</span>${spot.name}</h2>
                    <span class="status-badge saved" id="badge">✅ 已保存</span>
                </div>

                <div class="editor-toolbar">
                    <button class="toolbar-btn" onclick="insertFormatDesc('{bold}', '{/bold}')"><strong>B</strong></button>
                    <button class="toolbar-btn" onclick="insertFormatDesc('{italic}', '{/italic}')"><em>I</em></button>
                    <button class="toolbar-btn" onclick="insertFormatDesc('/n', '')">↵ 换行</button>
                    <button class="toolbar-btn" style="display:flex; align-items:center; gap:6px;">
                        🎨 <input type="color" class="color-picker" value="#ff0000" onchange="insertColorDesc(this.value)">
                    </button>
                </div>

                <div class="editor-content">
                    <div class="field-group desc-field">
                        <label>简短介绍 (desc)</label>
                        <input type="text" id="descInput" value="${escapeAttr(spot.desc || '')}" onchange="markChanged()">
                    </div>

                    <div class="field-group deep-desc-field">
                        <label>详细描述 (deepDesc)</label>
                        <textarea id="deepDescInput" onchange="markChanged()">${escapeAttr(spot.deepDesc || '')}</textarea>
                    </div>

                    <div class="field-group">
                        <label>标签 (tags)</label>
                        <div class="tags-container" id="tagsContainer">${tagsHtml}</div>
                        <input type="text" id="newTagInput" placeholder="输入后按 Enter 添加" onkeypress="addTagIfEnter(event)">
                    </div>

                    <div class="field-group">
                        <label>卫生间信息 (toilet)</label>
                        <input type="text" value="${escapeAttr(spot.toilet || '')}" onchange="updateField('toilet', this.value)">
                    </div>

                    <div class="field-group">
                        <label>地图 (map)</label>
                        <input type="text" value="${escapeAttr(spot.map || '')}" onchange="updateField('map', this.value)">
                    </div>

                    <div class="field-group">
                        <label>下一站 (nextStop) - JSON 格式</label>
                        <textarea style="height: 120px;" onchange="updateNextStop(this.value)">${nextStopJson}</textarea>
                    </div>
                </div>

                <div class="editor-footer">
                    <button class="btn btn-secondary" onclick="discardChanges()">放弃</button>
                    <button class="btn btn-primary" id="saveBtn" onclick="saveToGitHub()">💾 保存</button>
                </div>
            `;
        }

        // ===== 辅助函数 =====
        function escapeAttr(str) {
            return (str || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function markChanged() {
            hasChanges = true;
            const badge = document.getElementById('badge');
            if (badge) {
                badge.className = 'status-badge unsaved';
                badge.textContent = '✏️ 未保存';
            }
        }

        function insertFormatDesc(before, after) {
            const input = document.getElementById('descInput');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            const selected = text.substring(start, end) || '文本';
            input.value = text.substring(0, start) + before + selected + after + text.substring(end);
            markChanged();
        }

        function insertColorDesc(color) {
            const hex = color.substring(1);
            insertFormatDesc(`{#${hex}}`, '{/color}');
        }

        function addTagIfEnter(e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            const input = e.target;
            const tag = input.value.trim();
            if (!tag) return;

            const spot = tripData[currentDay].spots[currentSpotIndex];
            if (!Array.isArray(spot.tags)) spot.tags = [];
            if (!spot.tags.includes(tag)) {
                spot.tags.push(tag);
                markChanged();
                input.value = '';
                renderEditor();
            }
        }

        function removeTag(spotIdx, tag) {
            const spot = tripData[currentDay].spots[spotIdx];
            spot.tags = spot.tags.filter(t => t !== tag);
            markChanged();
            renderEditor();
        }

        function updateField(field, value) {
            tripData[currentDay].spots[currentSpotIndex][field] = value;
            markChanged();
        }

        function updateNextStop(json) {
            try {
                tripData[currentDay].spots[currentSpotIndex].nextStop = JSON.parse(json);
                markChanged();
            } catch(e) {
                console.error('JSON 错误:', e);
            }
        }

        function discardChanges() {
            if (hasChanges && !confirm('放弃未保存的变更？')) return;
            renderEditor();
        }

        // ===== 保存到 GitHub =====
        async function saveToGitHub() {
            if (!currentDay || currentSpotIndex === null) return;

            const descInput = document.getElementById('descInput');
            const deepDescInput = document.getElementById('deepDescInput');
            const saveBtn = document.getElementById('saveBtn');

            // 更新 spot 数据
            const spot = tripData[currentDay].spots[currentSpotIndex];
            spot.desc = descInput.value.trim();
            spot.deepDesc = deepDescInput.value.trim();

            // 保存按钮状态
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner"></span>保存中...';

            try {
                const pat = getPAT();
                
                // 生成新的 JS 代码
                const response = await fetch(
                    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_FILE}`
                );
                const oldContent = await response.text();
                const header = oldContent.substring(0, oldContent.indexOf('const TRIP = {'));
                const footer = oldContent.substring(oldContent.indexOf('};') + 2);
                const newContent = header + 'const TRIP = ' + JSON.stringify(tripData, null, 2) + ';\n' + footer;

                // 获取文件 SHA
                const getResp = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                    { headers: { 'Authorization': `token ${pat}` } }
                );
                const fileData = await getResp.json();

                // 更新文件
                const updateResp = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${pat}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `✏️ 编辑景点: ${spot.name}`,
                            content: utf8ToBase64(newContent),
                            sha: fileData.sha
                        })
                    }
                );

                if (!updateResp.ok) throw new Error('更新失败');

                showNotif('✅ 已保存到 GitHub！', 'success');
                hasChanges = false;
                document.getElementById('badge').className = 'status-badge saved';
                document.getElementById('badge').textContent = '✅ 已保存';

            } catch(e) {
                showNotif('❌ 错误: ' + e.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '💾 保存';
            }
        }

        function getPAT() {
            let pat = localStorage.getItem('github_pat');
            if (!pat) {
                pat = prompt('输入 GitHub Personal Access Token\n(https://github.com/settings/tokens)');
                if (pat) localStorage.setItem('github_pat', pat);
                else throw new Error('需要 PAT');
            }
            return pat;
        }

        function showNotif(msg, type) {
            const main = document.getElementById('editorMain');
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = msg;
            main.prepend(notif);
            setTimeout(() => notif.remove(), 4000);
        }

        // 启动
        window.addEventListener('load', init);
    </script>
</body>
</html>
