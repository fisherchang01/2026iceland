<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程編輯器 Pro - 一站式管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-height: 600px;
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .day-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 2px solid #e5e5e5;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }

        .day-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .day-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .spot-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 6px;
            border: 1px solid #e5e5e5;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            color: #555;
            transition: all 0.2s;
            padding-left: 16px;
        }

        .spot-btn:hover {
            background: #f0f0f0;
            border-color: #ccc;
        }

        .spot-btn.active {
            background: #e3e7ff;
            border-color: #667eea;
            color: #667eea;
            font-weight: 600;
        }

        .editor-panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e5e5;
        }

        .editor-header h2 {
            font-size: 20px;
            color: #333;
        }

        .editor-header .spot-icon {
            font-size: 32px;
            margin-right: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.unsaved {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.saved {
            background: #d4edda;
            color: #155724;
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 8px 12px;
            border: 1px solid #d0d0d0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        .toolbar-btn.color-btn {
            padding: 6px 10px;
        }

        .color-picker {
            width: 32px;
            height: 32px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            cursor: pointer;
        }

        .editor-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            min-height: 400px;
        }

        .editor-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .editor-field label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .preview-box {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            color: #333;
            border: 1px solid #e5e5e5;
            max-height: 150px;
            overflow-y: auto;
        }

        .colored-text {
            font-weight: 500;
        }

        .editor-footer {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #e5e5e5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #1565c0;
            margin-bottom: 16px;
        }

        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #856404;
            margin-bottom: 16px;
        }

        .success-box {
            background: #d4edda;
            border-left: 4px solid #28a745;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #155724;
            margin-bottom: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 行程編輯器 Pro</h1>
            <p>選擇景點 → 編輯內容 → 直接保存到 GitHub</p>
        </div>

        <div class="main-grid">
            <!-- Sidebar: 景點選擇 -->
            <div class="sidebar">
                <div class="sidebar-section" id="daysContainer"></div>
            </div>

            <!-- Main Panel: 編輯器 -->
            <div class="editor-panel" id="editorPanel">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                    </svg>
                    <p>請在左側選擇一個景點開始編輯</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 配置
        const GITHUB_OWNER = 'fisherchang01';
        const GITHUB_REPO = '2026iceland';
        const GITHUB_FILE = 'data/trip-details.js';

        let tripData = null;
        let currentDay = null;
        let currentSpotIndex = null;
        let hasChanges = false;
        let tripDataContent = '';

        // 初始化
        async function init() {
            await loadTripData();
            renderDaysList();
        }

        // 從 GitHub 加載 trip-details.js
        async function loadTripData() {
            try {
                const response = await fetch(
                    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_FILE}`
                );
                tripDataContent = await response.text();
                
                // 解析 JS 文件，提取 TRIP 對象
                const tripMatch = tripDataContent.match(/const TRIP = ({[\s\S]*?});/);
                if (!tripMatch) throw new Error('無法解析 TRIP 數據');
                
                eval(`tripData = ${tripMatch[1]}`);
                console.log('✅ 已加載行程數據', Object.keys(tripData).length, '天');
            } catch (error) {
                console.error('❌ 加載失敗:', error);
                showNotification('加載數據失敗: ' + error.message, 'error');
            }
        }

        // 渲染日期列表
        function renderDaysList() {
            const container = document.getElementById('daysContainer');
            container.innerHTML = '';

            const section = document.createElement('div');
            section.className = 'sidebar-section';

            const title = document.createElement('div');
            title.className = 'sidebar-title';
            title.textContent = '📅 選擇日期';
            section.appendChild(title);

            Object.keys(tripData).forEach((dayKey) => {
                const day = tripData[dayKey];
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.textContent = `Day ${day.num}: ${day.title}`;
                btn.onclick = () => selectDay(dayKey);
                section.appendChild(btn);
            });

            container.appendChild(section);
        }

        // 選擇日期
        function selectDay(dayKey) {
            currentDay = dayKey;
            currentSpotIndex = null;

            // 更新按鈕狀態
            document.querySelectorAll('.day-btn').forEach((btn, i) => {
                btn.classList.toggle('active', Object.keys(tripData)[i] === dayKey);
            });

            renderSpotsList();
            clearEditor();
        }

        // 渲染景點列表
        function renderSpotsList() {
            const container = document.getElementById('daysContainer');
            let spotsSection = container.querySelector('[data-spots]');
            
            if (!spotsSection) {
                spotsSection = document.createElement('div');
                spotsSection.className = 'sidebar-section';
                spotsSection.setAttribute('data-spots', 'true');
                container.appendChild(spotsSection);
            }

            const day = tripData[currentDay];
            spotsSection.innerHTML = `<div class="sidebar-title">🏔️ ${day.title}</div>`;

            if (!day.spots || day.spots.length === 0) {
                spotsSection.innerHTML += '<p style="color: #999; font-size: 13px;">此日期無景點</p>';
                return;
            }

            day.spots.forEach((spot, index) => {
                const btn = document.createElement('button');
                btn.className = 'spot-btn';
                btn.textContent = `${spot.icon || '📍'} ${spot.name}`;
                btn.onclick = () => selectSpot(index);
                spotsSection.appendChild(btn);
            });
        }

        // 選擇景點
        function selectSpot(spotIndex) {
            currentSpotIndex = spotIndex;

            document.querySelectorAll('.spot-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === spotIndex);
            });

            renderEditor();
        }

        // 渲染編輯器
        function renderEditor() {
            const day = tripData[currentDay];
            const spot = day.spots[currentSpotIndex];

            const panel = document.getElementById('editorPanel');
            panel.innerHTML = `
                <div class="editor-header">
                    <div>
                        <span class="spot-icon">${spot.icon || '📍'}</span>
                        <h2>${spot.name}</h2>
                    </div>
                    <span class="status-badge saved" id="statusBadge">已保存</span>
                </div>

                <div class="info-box">
                    📝 編輯此景點的簡短介紹（desc）和詳細描述（deepDesc）。編輯完成後點擊「保存到 GitHub」直接推送。
                </div>

                <div class="editor-toolbar">
                    <button class="toolbar-btn" onclick="insertMarkup('desc', '{bold}', '{/bold}')"><strong>B</strong></button>
                    <button class="toolbar-btn" onclick="insertMarkup('desc', '{italic}', '{/italic}')"><em>I</em></button>
                    <button class="toolbar-btn" onclick="insertMarkup('desc', '/n', '')">↵ 換行</button>
                    <button class="toolbar-btn color-btn">
                        顏色 <input type="color" class="color-picker" id="colorPicker" value="#ff0000" 
                                   onchange="applyColor()">
                    </button>
                </div>

                <div class="editor-content">
                    <div class="editor-field">
                        <label>簡短介紹 (desc) - 顯示在行程列表</label>
                        <textarea id="descField" placeholder="輸入簡短介紹...">${spot.desc || ''}</textarea>
                        <div class="preview-box" id="descPreview"></div>
                    </div>

                    <div class="editor-field">
                        <label>詳細描述 (deepDesc) - 點擊景點後顯示</label>
                        <textarea id="deepDescField" placeholder="輸入詳細描述...">${spot.deepDesc || ''}</textarea>
                        <div class="preview-box" id="deepDescPreview"></div>
                    </div>
                </div>

                <div class="editor-footer">
                    <button class="btn btn-secondary" onclick="discardChanges()">放棄變更</button>
                    <button class="btn btn-primary" id="saveBtn" onclick="saveToGitHub()">💾 保存到 GitHub</button>
                </div>
            `;

            // 綁定事件
            document.getElementById('descField').addEventListener('input', () => {
                updatePreview('desc');
                markAsChanged();
            });

            document.getElementById('deepDescField').addEventListener('input', () => {
                updatePreview('deep');
                markAsChanged();
            });

            updatePreview('desc');
            updatePreview('deep');
            markAsSaved();
        }

        // 更新預覽
        function updatePreview(field) {
            const textarea = document.getElementById(field === 'desc' ? 'descField' : 'deepDescField');
            const preview = document.getElementById(field === 'desc' ? 'descPreview' : 'deepDescPreview');
            preview.innerHTML = parseMarkup(textarea.value);
        }

        // 解析標記
        function parseMarkup(text) {
            if (!text) return '(空)';
            let html = text
                .replace(/\/n/g, '<br>')
                .replace(/\{#([0-9a-fA-F]{6})\}([^{]*?)\{\/color\}/g, 
                    '<span class="colored-text" style="color: #$1">$2</span>')
                .replace(/\{bold\}([^{]*?)\{\/bold\}/g, '<strong>$1</strong>')
                .replace(/\{italic\}([^{]*?)\{\/italic\}/g, '<em>$1</em>');
            return html;
        }

        // 应用颜色格式
        function applyColor() {
            const colorPicker = document.getElementById('colorPicker');
            const color = colorPicker.value.substring(1); // 移除 #
            insertMarkup('desc', `{#${color}}`, '{/color}');
        }
            const fieldId = field === 'desc' ? 'descField' : 'deepDescField';
            const textarea = document.getElementById(fieldId);
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const selected = text.substring(start, end) || '文本';

            const newText = text.substring(0, start) + before + selected + after + text.substring(end);
            textarea.value = newText;
            textarea.selectionStart = start + before.length;
            textarea.selectionEnd = start + before.length + selected.length;
            
            updatePreview(field);
            markAsChanged();
        }

        // 標記為已變更
        function markAsChanged() {
            hasChanges = true;
            const badge = document.getElementById('statusBadge');
            if (badge) {
                badge.className = 'status-badge unsaved';
                badge.textContent = '✏️ 未保存';
            }
        }

        // 標記為已保存
        function markAsSaved() {
            hasChanges = false;
            const badge = document.getElementById('statusBadge');
            if (badge) {
                badge.className = 'status-badge saved';
                badge.textContent = '✅ 已保存';
            }
        }

        // 清空編輯器
        function clearEditor() {
            const panel = document.getElementById('editorPanel');
            panel.innerHTML = `
                <div class="empty-state">
                    <p>選擇一個景點開始編輯</p>
                </div>
            `;
        }

        // 放棄變更
        function discardChanges() {
            if (hasChanges && !confirm('確定放棄未保存的變更？')) return;
            renderEditor();
        }

        // 保存到 GitHub
        async function saveToGitHub() {
            if (!currentDay || currentSpotIndex === null) return;

            const descField = document.getElementById('descField');
            const deepDescField = document.getElementById('deepDescField');
            const saveBtn = document.getElementById('saveBtn');

            const newDesc = descField.value;
            const newDeepDesc = deepDescField.value;

            // 驗證輸入
            if (!newDesc.trim() || !newDeepDesc.trim()) {
                alert('簡短介紹和詳細描述都不能為空');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<div class="spinner"></div> 保存中...';

            try {
                // 更新本地數據
                tripData[currentDay].spots[currentSpotIndex].desc = newDesc;
                tripData[currentDay].spots[currentSpotIndex].deepDesc = newDeepDesc;

                // 生成新的 JS 代碼
                const newContent = generateTripJS();

                // 推送到 GitHub
                await updateGitHubFile(newContent);

                showNotification('✅ 成功保存到 GitHub！', 'success');
                markAsSaved();
            } catch (error) {
                showNotification('❌ 保存失敗: ' + error.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '💾 保存到 GitHub';
            }
        }

        // 生成新的 trip-details.js 代碼
        function generateTripJS() {
            // 保留原始的 JS 文件頭和尾
            const header = tripDataContent.substring(0, tripDataContent.indexOf('const TRIP = {'));
            const footer = tripDataContent.substring(tripDataContent.indexOf('};') + 2);

            const tripJson = JSON.stringify(tripData, null, 2);
            return `${header}const TRIP = ${tripJson};\n${footer}`;
        }

        // 取得 PAT（從 localStorage 或提示用戶）
        function getPAT() {
            let pat = localStorage.getItem('github_pat');
            if (!pat) {
                pat = prompt('🔑 首次使用需要 GitHub PAT\n\n請輸入你的 Personal Access Token\n(會保存在本地，你可以隨時清除)\n\n如何取得 PAT:\n1. 打開 https://github.com/settings/tokens\n2. 點擊 "Generate new token"\n3. 選擇 "repo" 權限\n4. 複製 token 貼在這裡');
                if (pat) {
                    localStorage.setItem('github_pat', pat);
                } else {
                    throw new Error('需要 PAT 才能保存');
                }
            }
            return pat;
        }

        // 清除保存的 PAT
        function clearPAT() {
            if (confirm('確定要清除本地保存的 GitHub PAT 嗎？')) {
                localStorage.removeItem('github_pat');
                alert('✅ PAT 已清除');
            }
        }

        // 更新 GitHub 文件
        async function updateGitHubFile(newContent) {
            const pat = getPAT();

            // 獲取當前文件的 SHA
            const response = await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                {
                    headers: {
                        'Authorization': `token ${pat}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                }
            );

            if (!response.ok) throw new Error('無法獲取文件信息（可能是 PAT 無效）');

            const data = await response.json();
            const sha = data.sha;

            // 更新文件
            const updateResponse = await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${pat}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `✏️ 編輯景點: ${tripData[currentDay].spots[currentSpotIndex].name}`,
                        content: btoa(unescape(encodeURIComponent(newContent))),
                        sha: sha
                    })
                }
            );

            if (!updateResponse.ok) throw new Error('更新失敗');
        }

        // 通知
        function showNotification(message, type = 'info') {
            const box = document.createElement('div');
            box.className = type === 'success' ? 'success-box' : type === 'error' ? 'warning-box' : 'info-box';
            box.textContent = message;
            document.querySelector('.header').appendChild(box);
            setTimeout(() => box.remove(), 5000);
        }

        // 啟動
        window.addEventListener('load', init);
    </script>
</body>
</html>
