<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>極光儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #0a0f15 0%, #0f1419 50%, #0a0f15 100%);
      color: #e0e0e0;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    
    .container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 8px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    
    header {
      text-align: center;
      padding: 6px 0 8px 0;
      border-bottom: 1px solid rgba(77, 184, 212, 0.2);
      margin-bottom: 8px;
    }
    
    h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #4db8d4, #7fd4e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2px;
    }
    
    .update-time {
      font-size: 10px;
      color: #666;
    }
    
    .demo-badge {
      background: linear-gradient(135deg, rgba(255, 152, 0, 0.15) 0%, rgba(255, 193, 7, 0.15) 100%);
      border: 1px solid #ff9800;
      color: #ffc107;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      margin-bottom: 6px;
      text-align: center;
      font-weight: 500;
    }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
    }
    
    .card {
      background: linear-gradient(135deg, rgba(26, 35, 50, 0.9) 0%, rgba(20, 28, 42, 0.9) 100%);
      border: 1px solid rgba(77, 184, 212, 0.15);
      border-radius: 10px;
      padding: 10px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    .card-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    
    .card-small {
      padding: 8px;
    }
    
    /* 頂部 - 極光機率 + 太陽高度角 */
    .top-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 6px;
    }
    
    .aurora-box {
      background: linear-gradient(135deg, rgba(77, 184, 212, 0.2) 0%, rgba(77, 184, 212, 0.08) 100%);
      border: 1px solid rgba(77, 184, 212, 0.3);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    
    .aurora-emoji {
      font-size: 28px;
      margin-bottom: 2px;
    }
    
    .aurora-value {
      font-size: 24px;
      font-weight: 700;
      color: #4db8d4;
      line-height: 1;
    }
    
    .aurora-label {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }
    
    .sun-box {
      background: linear-gradient(135deg, rgba(255, 165, 0, 0.2) 0%, rgba(255, 165, 0, 0.08) 100%);
      border: 1px solid rgba(255, 165, 0, 0.3);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    
    .sun-emoji {
      font-size: 28px;
      margin-bottom: 2px;
    }
    
    .sun-value {
      font-size: 24px;
      font-weight: 700;
      color: #ffa500;
      line-height: 1;
    }
    
    .sun-label {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }
    
    /* 位置一行 */
    .location-line {
      background: linear-gradient(135deg, rgba(77, 184, 212, 0.1) 0%, rgba(77, 184, 212, 0.05) 100%);
      padding: 6px 8px;
      border-radius: 8px;
      border-left: 3px solid #4db8d4;
      margin-bottom: 6px;
      font-size: 11px;
      color: #4db8d4;
      line-height: 1.2;
    }
    
    .card-title {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .card-icon {
      font-size: 14px;
    }
    
    #kpChart {
      width: 100%;
      height: 180px;
      background: rgba(15, 20, 25, 0.5);
      border-radius: 6px;
      display: block;
    }
    
    .chart-label {
      font-size: 9px;
      color: #666;
      text-align: center;
      margin-top: 4px;
    }
    
    .gauges-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 3px;
    }
    
    .gauge-container {
      text-align: center;
    }
    
    .gauge {
      width: 100%;
      height: 100px;
      display: block;
      aspect-ratio: 1;
      margin: 0;
    }
    
    .gauge-value {
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      color: #4db8d4;
      line-height: 1;
    }
    
    .gauge-label {
      font-size: 18px;
      color: #888;
      margin-top: 0;
      font-weight: 600;
    }
    
    .weather-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 6px;
      margin-top: 6px;
      width: 100%;
    }
    
    .weather-item {
      padding: 8px;
      background: linear-gradient(135deg, rgba(77, 184, 212, 0.08) 0%, rgba(77, 184, 212, 0.03) 100%);
      border-radius: 8px;
      border: 1px solid rgba(77, 184, 212, 0.1);
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    
    .weather-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 50px;
    }
    
    .weather-emoji {
      font-size: 18px;
      display: block;
    }
    
    .weather-label {
      font-size: 18px;
      color: #888;
      font-weight: 600;
      text-align: center;
    }
    
    .weather-right {
      text-align: right;
    }
    
    .weather-value {
      font-size: 18px;
      font-weight: 600;
      color: #e0e0e0;
      line-height: 1.3;
    }
    
    .loading {
      text-align: center;
      padding: 30px 20px;
      color: #888;
    }
    
    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(77, 184, 212, 0.2);
      border-top-color: #4db8d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error {
      background: linear-gradient(135deg, rgba(244, 67, 54, 0.1) 0%, rgba(244, 67, 54, 0.05) 100%);
      border: 1px solid #f44336;
      color: #f44336;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    
    @media (max-width: 480px) {
      .container {
        max-width: 100%;
        padding: 6px;
      }
      h1 {
        font-size: 20px;
      }
      .aurora-value, .sun-value {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <h1>⛅ 極光儀表板</h1>
    <div class="update-time">更新: <span id="updateTime">載入中...</span></div>
  </header>

  <div id="errorContainer"></div>
  <div class="demo-badge">⚠️ 演示模式 - 使用模擬數據</div>

  <div id="dashboardContent" class="loading">
    <div class="spinner"></div>
    <p>載入中...</p>
  </div>

</div>

<script>

const CONFIG = {
  location: {
    name: '南部民宿（Selfoss）',
    lat: 63.93,
    lon: -20.85,
  },
};

function generateMockKpData() {
  const now = new Date();
  const data = [];
  for (let i = -12; i <= 36; i += 3) {
    const time = new Date(now.getTime() + i * 3600000);
    const hour = time.getHours();
    let kp = 2 + Math.sin((hour - 6) / 24 * Math.PI) * 3 + (Math.random() - 0.5) * 1;
    kp = Math.max(0, Math.min(9, kp));
    data.push([time.toISOString(), kp.toFixed(1)]);
  }
  return data;
}

function generateMockPlanetaryData() {
  const now = new Date();
  const data = [];
  for (let i = 0; i < 10; i++) {
    const time = new Date(now.getTime() - i * 3600000);
    const bz = -5 + Math.random() * 10;
    const bt = 5 + Math.random() * 10;
    data.push([time.toISOString(), i, bz.toFixed(1), bt.toFixed(1)]);
  }
  return data;
}

async function fetchSpaceWeather() {
  try {
    await fetch('https://api.open-meteo.com/v1/forecast?latitude=90&longitude=0&current=temperature_2m&timezone=auto');
  } catch (error) {
    console.log('使用模擬數據');
  }
  return {
    kpData: generateMockKpData(),
    planetaryData: generateMockPlanetaryData()
  };
}

async function fetchWeather() {
  try {
    const response = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.location.lat}&longitude=${CONFIG.location.lon}` +
      `&current=temperature_2m,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m` +
      `&timezone=auto`
    );
    const data = await response.json();
    return data.current || null;
  } catch (error) {
    return null;
  }
}

function calculateSunElevation(lat, lon, date = new Date()) {
  const J2000 = 2451545;
  const JD = date.getTime() / 86400000 + 2440588;
  const n = JD - J2000;
  
  const L = (280.46 + 0.9856474 * n) % 360;
  const g = (357.528 + 0.9856003 * n) % 360;
  const g_rad = g * Math.PI / 180;
  
  const lambda = L + 1.915 * Math.sin(g_rad) + 0.02 * Math.sin(2 * g_rad);
  const lambda_rad = lambda * Math.PI / 180;
  
  const epsilon = 23.4393 - 0.0000004 * n;
  const epsilon_rad = epsilon * Math.PI / 180;
  
  const alpha_rad = Math.atan2(Math.sin(lambda_rad) * Math.cos(epsilon_rad), Math.cos(lambda_rad));
  const delta_rad = Math.asin(Math.sin(epsilon_rad) * Math.sin(lambda_rad));
  
  const lat_rad = lat * Math.PI / 180;
  const lon_rad = lon * Math.PI / 180;
  
  const H = (date.getHours() + date.getMinutes() / 60) * 15 * Math.PI / 180 + lon_rad - alpha_rad;
  
  const h = Math.asin(
    Math.sin(delta_rad) * Math.sin(lat_rad) +
    Math.cos(delta_rad) * Math.cos(lat_rad) * Math.cos(H)
  );
  
  return (h * 180 / Math.PI);
}

function parseSpaceWeatherData(kpData, planetaryData) {
  const kpValues = kpData
    .map(d => ({
      time: new Date(d[0]),
      kp: parseFloat(d[1]),
    }))
    .filter(d => !isNaN(d.kp));
  
  const currentKp = kpValues.length > 0 ? kpValues[Math.floor(kpValues.length / 2)].kp : 2;
  const kpForProbability = kpValues.length > 0 ? Math.max(...kpValues.map(v => v.kp)) : 2;
  
  let auroraChance = 10;
  if (kpForProbability < 4) auroraChance = 10;
  else if (kpForProbability < 5) auroraChance = 30;
  else if (kpForProbability < 6) auroraChance = 50;
  else if (kpForProbability < 7) auroraChance = 70;
  else if (kpForProbability < 8) auroraChance = 85;
  else auroraChance = 95;
  
  const bzData = planetaryData.length > 0 ? planetaryData[0] : null;
  const bz = bzData ? parseFloat(bzData[2]) : 0;
  const bt = bzData ? parseFloat(bzData[3]) : 0;
  
  return { kpValues, currentKp, auroraChance, bz, bt };
}

function drawKpChart(canvas, kpValues) {
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  
  const gradient = ctx.createLinearGradient(0, 0, 0, height);
  gradient.addColorStop(0, 'rgba(15, 20, 25, 0.8)');
  gradient.addColorStop(1, 'rgba(10, 15, 21, 0.8)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
  
  ctx.strokeStyle = 'rgba(77, 184, 212, 0.1)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = (height / 5) * i;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
  
  const barWidth = Math.max(2, width / kpValues.length - 2);
  const padding = 8;
  const chartHeight = height - padding * 2;
  
  kpValues.forEach((item, idx) => {
    const x = padding + (width - padding * 2) * idx / (kpValues.length - 1);
    const kpHeight = (item.kp / 9) * chartHeight;
    
    if (item.kp < 4) ctx.fillStyle = '#3dbd67';
    else if (item.kp < 6) ctx.fillStyle = '#ffc107';
    else if (item.kp < 8) ctx.fillStyle = '#ff9800';
    else ctx.fillStyle = '#f44336';
    
    ctx.fillRect(x - barWidth / 2, height - padding - kpHeight, barWidth, kpHeight);
  });
  
  ctx.fillStyle = '#666';
  ctx.font = '9px Noto Sans SC';
  ctx.textAlign = 'center';
  kpValues.forEach((item, idx) => {
    if (idx % 3 === 0) {
      const x = padding + (width - padding * 2) * idx / (kpValues.length - 1);
      const hours = item.time.getHours();
      ctx.fillText(hours + 'h', x, height - 2);
    }
  });
}

function drawGauge(canvas, value, min, max) {
  const ctx = canvas.getContext('2d');
  const size = Math.min(canvas.width, canvas.height);
  const centerX = size / 2;
  const centerY = size / 2;
  const radius = size / 2 - 6;
  
  // 背景圓
  const bgGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
  bgGradient.addColorStop(0, 'rgba(30, 40, 55, 0.6)');
  bgGradient.addColorStop(1, 'rgba(20, 28, 42, 0.6)');
  ctx.fillStyle = bgGradient;
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
  ctx.fill();
  
  ctx.strokeStyle = 'rgba(77, 184, 212, 0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  const startAngle = Math.PI;
  const endAngle = 2 * Math.PI;
  const arcRadius = radius - 10;
  
  // 綠色段（50%）- 方形端點
  ctx.strokeStyle = '#3dbd67';
  ctx.lineWidth = 14;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.arc(centerX, centerY, arcRadius, startAngle, startAngle + (endAngle - startAngle) * 0.5);
  ctx.stroke();
  
  // 黃色段（25%）
  ctx.strokeStyle = '#ffc107';
  ctx.beginPath();
  ctx.arc(centerX, centerY, arcRadius, startAngle + (endAngle - startAngle) * 0.5, startAngle + (endAngle - startAngle) * 0.75);
  ctx.stroke();
  
  // 紅色段（25%）
  ctx.strokeStyle = '#f44336';
  ctx.beginPath();
  ctx.arc(centerX, centerY, arcRadius, startAngle + (endAngle - startAngle) * 0.75, endAngle);
  ctx.stroke();
  
  // 指針
  const normalizedValue = Math.max(min, Math.min(max, value));
  const ratio = (normalizedValue - min) / (max - min);
  const angle = startAngle + ratio * (endAngle - startAngle);
  
  ctx.strokeStyle = '#4db8d4';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(centerX, centerY);
  ctx.lineTo(centerX + Math.cos(angle) * (arcRadius - 1), centerY + Math.sin(angle) * (arcRadius - 1));
  ctx.stroke();
  
  // 中心點
  const dotGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 4);
  dotGradient.addColorStop(0, '#4db8d4');
  dotGradient.addColorStop(1, '#2a7a94');
  ctx.fillStyle = dotGradient;
  ctx.beginPath();
  ctx.arc(centerX, centerY, 4, 0, 2 * Math.PI);
  ctx.fill();
  
  ctx.strokeStyle = 'rgba(77, 184, 212, 0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(centerX, centerY, 3.5, 0, 2 * Math.PI);
  ctx.stroke();
}

async function renderDashboard() {
  const errorContainer = document.getElementById('errorContainer');
  const dashboardContent = document.getElementById('dashboardContent');
  
  try {
    errorContainer.innerHTML = '';
    
    const spaceWeather = await fetchSpaceWeather();
    const weather = await fetchWeather();
    const { kpValues, currentKp, auroraChance, bz, bt } = parseSpaceWeatherData(spaceWeather.kpData, spaceWeather.planetaryData);
    const sunElevation = calculateSunElevation(CONFIG.location.lat, CONFIG.location.lon);
    
    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('zh-Hans', { hour: '2-digit', minute: '2-digit', hour12: false });
    
    const html = `
      <div class="dashboard-grid">
        
        <!-- 最上面：極光機率 + 太陽高度角 -->
        <div class="top-info">
          <div class="aurora-box">
            <div class="aurora-emoji">${auroraChance > 70 ? '🎉' : auroraChance > 50 ? '👀' : auroraChance > 30 ? '🤔' : '😴'}</div>
            <div class="aurora-value">${auroraChance}%</div>
            <div class="aurora-label">極光機率</div>
          </div>
          <div class="sun-box">
            <div class="sun-emoji">${sunElevation < -6 ? '🌌' : sunElevation < 0 ? '🌅' : '☀️'}</div>
            <div class="sun-value">${sunElevation.toFixed(1)}°</div>
            <div class="sun-label">${sunElevation < -6 ? '最佳' : sunElevation < 0 ? '暮光' : '白天'}</div>
          </div>
        </div>
        
        <!-- 位置一行 -->
        <div class="location-line">
          📍 ${CONFIG.location.name} (${CONFIG.location.lat.toFixed(2)}°N, ${Math.abs(CONFIG.location.lon).toFixed(2)}°W)
        </div>
        
        <!-- KP 圖表 -->
        <div class="card">
          <div class="card-title"><span class="card-icon">📊</span>KP 指數趨勢</div>
          <canvas id="kpCanvas" width="400" height="200"></canvas>
          <div class="chart-label">過去12h + 未來36h（3小時間隔）</div>
        </div>
        
        <!-- 磁場參數 -->
        <div class="card">
          <div class="card-title"><span class="card-icon">🧲</span>磁場參數</div>
          <div class="gauges-grid">
            <div class="gauge-container">
              <canvas class="gauge" id="gaugeKp" width="100" height="100"></canvas>
              <div class="gauge-value">${currentKp.toFixed(1)}</div>
              <div class="gauge-label">Kp</div>
            </div>
            <div class="gauge-container">
              <canvas class="gauge" id="gaugeBz" width="100" height="100"></canvas>
              <div class="gauge-value">${bz.toFixed(1)}</div>
              <div class="gauge-label">Bz</div>
            </div>
            <div class="gauge-container">
              <canvas class="gauge" id="gaugeBt" width="100" height="100"></canvas>
              <div class="gauge-value">${bt.toFixed(1)}</div>
              <div class="gauge-label">Bt</div>
            </div>
          </div>
        </div>
        
        <!-- 天氣 -->
        <div class="card">
          <div class="card-title"><span class="card-icon">🌤️</span>當地天氣</div>
          <div class="weather-grid">
            <div class="weather-item">
              <div class="weather-left">
                <div class="weather-emoji">🌡️</div>
                <div class="weather-label">氣溫</div>
              </div>
              <div class="weather-right">
                <div class="weather-value">${weather ? weather.temperature_2m.toFixed(0) : '--'}°</div>
              </div>
            </div>
            <div class="weather-item">
              <div class="weather-left">
                <div class="weather-emoji">💨</div>
                <div class="weather-label">風速</div>
              </div>
              <div class="weather-right">
                <div class="weather-value">${weather ? weather.wind_speed_10m.toFixed(1) : '--'}</div>
              </div>
            </div>
            <div class="weather-item">
              <div class="weather-left">
                <div class="weather-emoji">☁️</div>
                <div class="weather-label">總雲</div>
              </div>
              <div class="weather-right">
                <div class="weather-value">${weather ? weather.cloud_cover : '--'}%</div>
              </div>
            </div>
            <div class="weather-item">
              <div class="weather-left">
                <div class="weather-emoji">⬇️</div>
                <div class="weather-label">低雲</div>
              </div>
              <div class="weather-right">
                <div class="weather-value">${weather ? weather.cloud_cover_low : '--'}%</div>
              </div>
            </div>
            <div class="weather-item">
              <div class="weather-left">
                <div class="weather-emoji">➡️</div>
                <div class="weather-label">中雲</div>
              </div>
              <div class="weather-right">
                <div class="weather-value">${weather ? weather.cloud_cover_mid : '--'}%</div>
              </div>
            </div>
            <div class="weather-item">
              <div class="weather-left">
                <div class="weather-emoji">⬆️</div>
                <div class="weather-label">高雲</div>
              </div>
              <div class="weather-right">
                <div class="weather-value">${weather ? weather.cloud_cover_high : '--'}%</div>
              </div>
            </div>
          </div>
        </div>
        
      </div>
    `;
    
    dashboardContent.innerHTML = html;
    dashboardContent.classList.remove('loading');
    
    setTimeout(() => {
      const kpCanvas = document.getElementById('kpCanvas');
      if (kpCanvas && kpValues.length > 0) drawKpChart(kpCanvas, kpValues);
      
      const gaugeKp = document.getElementById('gaugeKp');
      if (gaugeKp) drawGauge(gaugeKp, currentKp, 0, 9);
      
      const gaugeBz = document.getElementById('gaugeBz');
      if (gaugeBz) drawGauge(gaugeBz, bz, -20, 20);
      
      const gaugeBt = document.getElementById('gaugeBt');
      if (gaugeBt) drawGauge(gaugeBt, bt, 0, 50);
    }, 50);
    
  } catch (error) {
    console.error('Error:', error);
    errorContainer.innerHTML = `<div class="error">⚠️ ${error.message}</div>`;
    dashboardContent.innerHTML = '';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  renderDashboard();
  setInterval(renderDashboard, 15 * 60 * 1000);
});

</script>

</body>
</html>
