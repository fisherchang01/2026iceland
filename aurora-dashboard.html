<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2c5f6e" />
  <title>極光儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #0f1419;
      color: #e0e0e0;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
      border-bottom: 1px solid #1e3a47;
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #4db8d4;
    }
    
    .update-time {
      font-size: 12px;
      color: #888;
    }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .card {
      background: #1a2332;
      border: 1px solid #2a3f52;
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    
    .card-title {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    
    .card-large {
      grid-column: 1 / -1;
    }
    
    /* 太陽高度角 */
    .sun-elevation {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .sun-value {
      font-size: 36px;
      font-weight: 700;
      color: #ffa500;
    }
    
    .sun-status {
      font-size: 12px;
      color: #666;
      max-width: 150px;
    }
    
    /* Kp 指數圖表 */
    #kpChart {
      width: 100%;
      height: 200px;
      margin: 15px 0;
    }
    
    .chart-label {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 8px;
    }
    
    /* 儀表盤網格 */
    .gauges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    
    .gauge-container {
      text-align: center;
    }
    
    .gauge {
      width: 100%;
      height: 120px;
      margin: 0 auto;
    }
    
    .gauge-value {
      font-size: 20px;
      font-weight: 700;
      margin-top: 8px;
      color: #4db8d4;
    }
    
    .gauge-label {
      font-size: 12px;
      color: #888;
    }
    
    /* 極光機率 */
    .aurora-probability {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: rgba(77, 184, 212, 0.1);
      border-radius: 8px;
      border-left: 4px solid #4db8d4;
    }
    
    .probability-text {
      flex: 1;
    }
    
    .probability-value {
      font-size: 48px;
      font-weight: 700;
      color: #4db8d4;
    }
    
    .probability-label {
      font-size: 12px;
      color: #888;
    }
    
    /* 天氣資訊 */
    .weather-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 15px;
    }
    
    .weather-item {
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      border: 1px solid #2a3f52;
    }
    
    .weather-item-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    
    .weather-item-value {
      font-size: 18px;
      font-weight: 600;
      color: #e0e0e0;
    }
    
    /* 狀態指示器 */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
    }
    
    .status-good {
      background: rgba(61, 189, 103, 0.2);
      color: #3dbd67;
      border: 1px solid #3dbd67;
    }
    
    .status-fair {
      background: rgba(255, 193, 7, 0.2);
      color: #ffc107;
      border: 1px solid #ffc107;
    }
    
    .status-poor {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
      border: 1px solid #f44336;
    }
    
    /* 載入動畫 */
    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    
    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid #2a3f52;
      border-top-color: #4db8d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error {
      background: rgba(244, 67, 54, 0.1);
      border: 1px solid #f44336;
      color: #f44336;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .info-note {
      font-size: 11px;
      color: #666;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #2a3f52;
    }
    
    /* 響應式 */
    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .gauges-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      
      .sun-value {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <h1>⛅ 極光儀表板</h1>
    <div class="update-time">
      最後更新: <span id="updateTime">載入中...</span>
    </div>
  </header>

  <div id="errorContainer"></div>

  <div id="dashboardContent" class="loading">
    <div class="spinner"></div>
    <p>正在加載極光預報數據...</p>
  </div>

</div>

<script>

// ═══ 設定 ═══
const CONFIG = {
  location: {
    name: '南部民宿（Selfoss 附近）',
    lat: 63.93,
    lon: -20.85,
  },
  noaaBaseUrl: 'https://services.swpc.noaa.gov/products/json',
};

// ═══ API 調用 ═══
async function fetchSpaceWeather() {
  try {
    // NOAA 3-hour Kp Index forecast
    const kpResponse = await fetch(`${CONFIG.noaaBaseUrl}/3-day-forecast.json`);
    const kpData = await kpResponse.json();
    
    // NOAA Planetary K-index
    const planetaryResponse = await fetch(`${CONFIG.noaaBaseUrl}/planetary-k-index.json`);
    const planetaryData = await planetaryResponse.json();
    
    return { kpData, planetaryData };
  } catch (error) {
    console.error('NOAA API error:', error);
    throw new Error('無法獲取太空天氣數據');
  }
}

async function fetchWeather() {
  // 使用 Open-Meteo（免費 API，無需認證）
  try {
    const response = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.location.lat}&longitude=${CONFIG.location.lon}` +
      `&current=temperature_2m,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m` +
      `&timezone=auto`
    );
    const data = await response.json();
    return data.current;
  } catch (error) {
    console.error('Weather API error:', error);
    return null;
  }
}

// ═══ 計算太陽高度角 ═══
function calculateSunElevation(lat, lon, date = new Date()) {
  // 簡化的太陽高度角計算（足夠精確用於極光預報）
  const J2000 = 2451545;
  const JD = date.getTime() / 86400000 + 2440588;
  const n = JD - J2000;
  
  const L = (280.46 + 0.9856474 * n) % 360;
  const g = (357.528 + 0.9856003 * n) % 360;
  const g_rad = g * Math.PI / 180;
  
  const lambda = L + 1.915 * Math.sin(g_rad) + 0.02 * Math.sin(2 * g_rad);
  const lambda_rad = lambda * Math.PI / 180;
  
  const epsilon = 23.4393 - 0.0000004 * n;
  const epsilon_rad = epsilon * Math.PI / 180;
  
  const alpha_rad = Math.atan2(Math.sin(lambda_rad) * Math.cos(epsilon_rad), Math.cos(lambda_rad));
  const delta_rad = Math.asin(Math.sin(epsilon_rad) * Math.sin(lambda_rad));
  
  const lat_rad = lat * Math.PI / 180;
  const lon_rad = lon * Math.PI / 180;
  
  const H = (date.getHours() + date.getMinutes() / 60) * 15 * Math.PI / 180 + lon_rad - alpha_rad;
  
  const h = Math.asin(
    Math.sin(delta_rad) * Math.sin(lat_rad) +
    Math.cos(delta_rad) * Math.cos(lat_rad) * Math.cos(H)
  );
  
  return (h * 180 / Math.PI);
}

// ═══ 解析 NOAA 數據 ═══
function parseNoaaData(kpData, planetaryData) {
  // Kp 指數（3 小時）
  const kpValues = kpData
    .slice(0, 32) // 過去 24h + 未來 72h = 32 個 3 小時間隔
    .map(d => ({
      time: new Date(d[0]),
      kp: parseFloat(d[1]),
    }));
  
  // 取得最新的 Kp 值
  const currentKp = kpValues[kpValues.length - 1]?.kp || 0;
  
  // 計算極光機率（簡化模型）
  // Kp < 4: 很低  | Kp 4-5: 低  | Kp 6-7: 中  | Kp 8+: 高
  const kpForProbability = Math.max(...kpValues.slice(-8).map(v => v.kp)); // 最近 24h 最大 Kp
  let auroraChance = 0;
  if (kpForProbability < 4) auroraChance = 10;
  else if (kpForProbability < 5) auroraChance = 30;
  else if (kpForProbability < 6) auroraChance = 50;
  else if (kpForProbability < 7) auroraChance = 70;
  else if (kpForProbability < 8) auroraChance = 85;
  else auroraChance = 95;
  
  // 磁場分量（从 planetaryData 提取）
  const bz = parseFloat(planetaryData[planetaryData.length - 1]?.[2] || 0);
  const bt = parseFloat(planetaryData[planetaryData.length - 1]?.[3] || 0);
  
  return { kpValues, currentKp, auroraChance, bz, bt };
}

// ═══ 繪製 Canvas 圖表 ═══
function drawKpChart(canvas, kpValues) {
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  
  // 清空
  ctx.fillStyle = '#1a2332';
  ctx.fillRect(0, 0, width, height);
  
  // 繪製背景網格
  ctx.strokeStyle = '#2a3f52';
  ctx.lineWidth = 1;
  
  for (let i = 0; i <= 5; i++) {
    const y = (height / 5) * i;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
  
  // 計算條寬
  const barWidth = width / kpValues.length - 2;
  const padding = 20;
  const chartHeight = height - padding * 2;
  
  // 繪製柱子
  kpValues.forEach((item, idx) => {
    const x = (width / kpValues.length) * idx + 1;
    const kpHeight = (item.kp / 9) * chartHeight;
    
    // 根據 Kp 值著色
    if (item.kp < 4) ctx.fillStyle = '#3dbd67'; // 綠
    else if (item.kp < 6) ctx.fillStyle = '#ffc107'; // 黃
    else if (item.kp < 8) ctx.fillStyle = '#ff9800'; // 橙
    else ctx.fillStyle = '#f44336'; // 紅
    
    ctx.fillRect(x, height - padding - kpHeight, barWidth, kpHeight);
  });
  
  // X 軸標籤（每隔 4 個顯示一個）
  ctx.fillStyle = '#666';
  ctx.font = '11px Noto Sans SC';
  ctx.textAlign = 'center';
  
  kpValues.forEach((item, idx) => {
    if (idx % 4 === 0) {
      const x = (width / kpValues.length) * idx + (width / kpValues.length) / 2;
      const timeStr = item.time.toLocaleTimeString('zh-Hans', { 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: false
      });
      ctx.fillText(timeStr, x, height - 5);
    }
  });
}

// ═══ 繪製儀表盤 ═══
function drawGauge(canvas, value, min, max, label) {
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  const centerX = width / 2;
  const centerY = height / 2;
  const radius = Math.min(width, height) / 2 - 10;
  
  // 背景圓
  ctx.fillStyle = '#2a3f52';
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
  ctx.fill();
  
  // 刻度弧（180 度）
  const startAngle = Math.PI;
  const endAngle = 2 * Math.PI;
  
  // 綠色段（良好）
  ctx.strokeStyle = '#3dbd67';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius - 15, startAngle, startAngle + (endAngle - startAngle) / 3);
  ctx.stroke();
  
  // 黃色段（警告）
  ctx.strokeStyle = '#ffc107';
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius - 15, startAngle + (endAngle - startAngle) / 3, startAngle + 2 * (endAngle - startAngle) / 3);
  ctx.stroke();
  
  // 紅色段（危險）
  ctx.strokeStyle = '#f44336';
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius - 15, startAngle + 2 * (endAngle - startAngle) / 3, endAngle);
  ctx.stroke();
  
  // 指針
  const normalizedValue = Math.max(min, Math.min(max, value));
  const ratio = (normalizedValue - min) / (max - min);
  const angle = startAngle + ratio * (endAngle - startAngle);
  
  ctx.strokeStyle = '#4db8d4';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(centerX, centerY);
  ctx.lineTo(
    centerX + Math.cos(angle) * (radius - 25),
    centerY + Math.sin(angle) * (radius - 25)
  );
  ctx.stroke();
  
  // 中心點
  ctx.fillStyle = '#1a2332';
  ctx.beginPath();
  ctx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
  ctx.fill();
}

// ═══ 主渲染函數 ═══
async function renderDashboard() {
  const errorContainer = document.getElementById('errorContainer');
  const dashboardContent = document.getElementById('dashboardContent');
  
  try {
    // 獲取數據
    const spaceWeather = await fetchSpaceWeather();
    const weather = await fetchWeather();
    
    const { kpValues, currentKp, auroraChance, bz, bt } = parseNoaaData(
      spaceWeather.kpData,
      spaceWeather.planetaryData
    );
    
    const sunElevation = calculateSunElevation(CONFIG.location.lat, CONFIG.location.lon);
    
    // 更新時間
    document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-Hans');
    
    // 構建 HTML
    let html = `
      <div class="dashboard-grid">
        
        <!-- 太陽高度角 -->
        <div class="card">
          <div class="card-title">太陽高度角</div>
          <div class="sun-elevation">
            <div>
              <div class="sun-value">${sunElevation.toFixed(1)}°</div>
              <div class="sun-status">
                ${sunElevation < -6 ? '天文暮光中 ⭐' : 
                  sunElevation < -0.833 ? '民間暮光中' : 
                  sunElevation < 0 ? '航海暮光中' : '白天'}
              </div>
            </div>
          </div>
          <div class="info-note">
            ${sunElevation < -6 ? '✅ 極光觀測條件良好' : '⚠️ 可能看不到極光（太陽未完全落下）'}
          </div>
        </div>
        
        <!-- Kp 指數圖表 -->
        <div class="card card-large">
          <div class="card-title">Kp 指數（過去 24h + 未來 72h，3 小時間隔）</div>
          <canvas id="kpCanvas" width="800" height="200"></canvas>
          <div class="chart-label">過去 24 小時觀測，未來 72 小時預報</div>
        </div>
        
        <!-- 磁場參數儀表盤 -->
        <div class="card card-large">
          <div class="card-title">磁場參數</div>
          <div class="gauges-grid">
            <div class="gauge-container">
              <canvas class="gauge" id="gaugeKp" width="120" height="120"></canvas>
              <div class="gauge-value">${currentKp.toFixed(1)}</div>
              <div class="gauge-label">Kp 指數</div>
            </div>
            <div class="gauge-container">
              <canvas class="gauge" id="gaugeBz" width="120" height="120"></canvas>
              <div class="gauge-value">${bz.toFixed(1)}</div>
              <div class="gauge-label">Bz (nT)</div>
            </div>
            <div class="gauge-container">
              <canvas class="gauge" id="gaugeBt" width="120" height="120"></canvas>
              <div class="gauge-value">${bt.toFixed(1)}</div>
              <div class="gauge-label">Bt (nT)</div>
            </div>
          </div>
        </div>
        
        <!-- 極光機率 -->
        <div class="card">
          <div class="aurora-probability">
            <div>
              <div class="probability-label">此地點極光機率</div>
              <div class="probability-value">${auroraChance}%</div>
              <div class="probability-label">NOAA OVATION 模型（根據當地磁場參數預估）</div>
            </div>
          </div>
        </div>
        
        <!-- 天氣資訊 -->
        <div class="card">
          <div class="card-title">該地點天氣</div>
          <div class="weather-grid">
            <div class="weather-item">
              <div class="weather-item-label">氣溫</div>
              <div class="weather-item-value">${weather ? weather.temperature_2m.toFixed(1) + ' °C' : 'N/A'}</div>
            </div>
            <div class="weather-item">
              <div class="weather-item-label">低雲</div>
              <div class="weather-item-value">${weather ? weather.cloud_cover_low + ' %' : 'N/A'}</div>
            </div>
            <div class="weather-item">
              <div class="weather-item-label">中雲</div>
              <div class="weather-item-value">${weather ? weather.cloud_cover_mid + ' %' : 'N/A'}</div>
            </div>
            <div class="weather-item">
              <div class="weather-item-label">高雲</div>
              <div class="weather-item-value">${weather ? weather.cloud_cover_high + ' %' : 'N/A'}</div>
            </div>
            <div class="weather-item">
              <div class="weather-item-label">有效遮蔽率</div>
              <div class="weather-item-value">${weather ? weather.cloud_cover + ' %' : 'N/A'}</div>
            </div>
            <div class="weather-item">
              <div class="weather-item-label">風速</div>
              <div class="weather-item-value">${weather ? weather.wind_speed_10m.toFixed(1) + ' m/s' : 'N/A'}</div>
            </div>
          </div>
        </div>
        
      </div>
    `;
    
    dashboardContent.innerHTML = html;
    dashboardContent.classList.remove('loading');
    
    // 繪製圖表
    const kpCanvas = document.getElementById('kpCanvas');
    drawKpChart(kpCanvas, kpValues);
    
    const gaugeKp = document.getElementById('gaugeKp');
    drawGauge(gaugeKp, currentKp, 0, 9, 'Kp');
    
    const gaugeBz = document.getElementById('gaugeBz');
    drawGauge(gaugeBz, bz, -20, 20, 'Bz');
    
    const gaugeBt = document.getElementById('gaugeBt');
    drawGauge(gaugeBt, bt, 0, 50, 'Bt');
    
  } catch (error) {
    console.error('Dashboard error:', error);
    errorContainer.innerHTML = `
      <div class="error">
        <strong>⚠️ 錯誤:</strong> ${error.message}
        <div style="font-size: 12px; margin-top: 8px;">
          請稍後重試，或檢查網路連接。
        </div>
      </div>
    `;
    dashboardContent.innerHTML = '';
  }
}

// ═══ 初始化 ═══
document.addEventListener('DOMContentLoaded', () => {
  renderDashboard();
  
  // 每 15 分鐘自動更新一次
  setInterval(renderDashboard, 15 * 60 * 1000);
});

</script>

</body>
</html>
