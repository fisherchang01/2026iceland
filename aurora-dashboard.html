<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2c5f6e" />
  <title>極光儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #0f1419;
      color: #e0e0e0;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
      border-bottom: 1px solid #1e3a47;
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #4db8d4;
    }
    
    .update-time {
      font-size: 12px;
      color: #888;
    }
    
    .demo-badge {
      background: rgba(255, 152, 0, 0.2);
      border: 1px solid #ff9800;
      color: #ffc107;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .card {
      background: #1a2332;
      border: 1px solid #2a3f52;
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    
    .card-title {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    
    .card-large {
      grid-column: 1 / -1;
    }
    
    .sun-elevation {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .sun-value {
      font-size: 36px;
      font-weight: 700;
      color: #ffa500;
    }
    
    .sun-status {
      font-size: 12px;
      color: #666;
      max-width: 150px;
    }
    
    #kpChart {
      width: 100%;
      height: 200px;
      margin: 15px 0;
      background: #0f1419;
      border-radius: 4px;
    }
    
    .chart-label {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 8px;
    }
    
    .gauges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    
    .gauge-container {
      text-align: center;
    }
    
    .gauge {
      width: 100%;
      height: 120px;
      margin: 0 auto;
    }
    
    .gauge-value {
      font-size: 20px;
      font-weight: 700;
      margin-top: 8px;
      color: #4db8d4;
    }
    
    .gauge-label {
      font-size: 12px;
      color: #888;
    }
    
    .aurora-probability {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: rgba(77, 184, 212, 0.1);
      border-radius: 8px;
      border-left: 4px solid #4db8d4;
    }
    
    .probability-value {
      font-size: 48px;
      font-weight: 700;
      color: #4db8d4;
    }
    
    .probability-label {
      font-size: 12px;
      color: #888;
    }
    
    .weather-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 15px;
    }
    
    .weather-item {
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      border: 1px solid #2a3f52;
    }
    
    .weather-item-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    
    .weather-item-value {
      font-size: 18px;
      font-weight: 600;
      color: #e0e0e0;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    
    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid #2a3f52;
      border-top-color: #4db8d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error {
      background: rgba(244, 67, 54, 0.1);
      border: 1px solid #f44336;
      color: #f44336;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .info-note {
      font-size: 11px;
      color: #666;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #2a3f52;
    }
    
    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 24px;
      }
      .gauges-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .sun-value {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <h1>⛅ 極光儀表板</h1>
    <div class="update-time">
      最後更新: <span id="updateTime">載入中...</span>
    </div>
  </header>

  <div id="errorContainer"></div>
  <div id="dashboardContent" class="loading">
    <div class="spinner"></div>
    <p>正在加載極光預報數據...</p>
  </div>

</div>

<script>

// ═══ 設定 ═══
const CONFIG = {
  location: {
    name: '南部民宿（Selfoss 附近）',
    lat: 63.93,
    lon: -20.85,
  },
};

// ═══ 模擬數據生成 ═══
function generateMockKpData() {
  const now = new Date();
  const data = [];
  
  for (let i = -24; i < 72; i += 3) {
    const time = new Date(now.getTime() + i * 3600000);
    const hour = time.getHours();
    let kp = 2 + Math.sin((hour - 6) / 24 * Math.PI) * 3 + (Math.random() - 0.5) * 1;
    kp = Math.max(0, Math.min(9, kp));
    data.push([time.toISOString(), kp.toFixed(1)]);
  }
  
  return data;
}

function generateMockPlanetaryData() {
  const now = new Date();
  const data = [];
  
  for (let i = 0; i < 10; i++) {
    const time = new Date(now.getTime() - i * 3600000);
    const bz = -5 + Math.random() * 10;
    const bt = 5 + Math.random() * 10;
    data.push([time.toISOString(), i, bz.toFixed(1), bt.toFixed(1)]);
  }
  
  return data;
}

// ═══ API 調用 ═══
async function fetchSpaceWeather() {
  try {
    const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=90&longitude=0&current=temperature_2m&timezone=auto');
    if (!response.ok) throw new Error('API failed');
    console.log('實時 API 連接成功');
  } catch (error) {
    console.log('使用模擬數據（演示模式）');
  }
  
  return {
    kpData: generateMockKpData(),
    planetaryData: generateMockPlanetaryData()
  };
}

async function fetchWeather() {
  try {
    const response = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.location.lat}&longitude=${CONFIG.location.lon}` +
      `&current=temperature_2m,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m` +
      `&timezone=auto`
    );
    const data = await response.json();
    return data.current || null;
  } catch (error) {
    console.error('Weather API error:', error);
    return null;
  }
}

// ═══ 計算太陽高度角 ═══
function calculateSunElevation(lat, lon, date = new Date()) {
  const J2000 = 2451545;
  const JD = date.getTime() / 86400000 + 2440588;
  const n = JD - J2000;
  
  const L = (280.46 + 0.9856474 * n) % 360;
  const g = (357.528 + 0.9856003 * n) % 360;
  const g_rad = g * Math.PI / 180;
  
  const lambda = L + 1.915 * Math.sin(g_rad) + 0.02 * Math.sin(2 * g_rad);
  const lambda_rad = lambda * Math.PI / 180;
  
  const epsilon = 23.4393 - 0.0000004 * n;
  const epsilon_rad = epsilon * Math.PI / 180;
  
  const alpha_rad = Math.atan2(Math.sin(lambda_rad) * Math.cos(epsilon_rad), Math.cos(lambda_rad));
  const delta_rad = Math.asin(Math.sin(epsilon_rad) * Math.sin(lambda_rad));
  
  const lat_rad = lat * Math.PI / 180;
  const lon_rad = lon * Math.PI / 180;
  
  const H = (date.getHours() + date.getMinutes() / 60) * 15 * Math.PI / 180 + lon_rad - alpha_rad;
  
  const h = Math.asin(
    Math.sin(delta_rad) * Math.sin(lat_rad) +
    Math.cos(delta_rad) * Math.cos(lat_rad) * Math.cos(H)
  );
  
  return (h * 180 / Math.PI);
}

// ═══ 解析數據 ═══
function parseSpaceWeatherData(kpData, planetaryData) {
  const kpValues = kpData
    .slice(0, 32)
    .map(d => ({
      time: new Date(d[0]),
      kp: parseFloat(d[1]),
    }))
    .filter(d => !isNaN(d.kp));
  
  const currentKp = kpValues.length > 0 ? kpValues[kpValues.length - 1].kp : 2;
  const kpForProbability = kpValues.length > 0 ? Math.max(...kpValues.slice(-8).map(v => v.kp)) : 2;
  
  let auroraChance = 10;
  if (kpForProbability < 4) auroraChance = 10;
  else if (kpForProbability < 5) auroraChance = 30;
  else if (kpForProbability < 6) auroraChance = 50;
  else if (kpForProbability < 7) auroraChance = 70;
  else if (kpForProbability < 8) auroraChance = 85;
  else auroraChance = 95;
  
  const bzData = planetaryData.length > 0 ? planetaryData[0] : null;
  const bz = bzData ? parseFloat(bzData[2]) : 0;
  const bt = bzData ? parseFloat(bzData[3]) : 0;
  
  return { kpValues, currentKp, auroraChance, bz, bt };
}

// ═══ 繪製 Kp 圖表 ═══
function drawKpChart(canvas, kpValues) {
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  
  ctx.fillStyle = '#1a2332';
  ctx.fillRect(0, 0, width, height);
  
  ctx.strokeStyle = '#2a3f52';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = (height / 5) * i;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
  
  const barWidth = width / kpValues.length - 2;
  const padding = 20;
  const chartHeight = height - padding * 2;
  
  kpValues.forEach((item, idx) => {
    const x = (width / kpValues.length) * idx + 1;
    const kpHeight = (item.kp / 9) * chartHeight;
    
    if (item.kp < 4) ctx.fillStyle = '#3dbd67';
    else if (item.kp < 6) ctx.fillStyle = '#ffc107';
    else if (item.kp < 8) ctx.fillStyle = '#ff9800';
    else ctx.fillStyle = '#f44336';
    
    ctx.fillRect(x, height - padding - kpHeight, barWidth, kpHeight);
  });
  
  ctx.fillStyle = '#666';
  ctx.font = '11px Noto Sans SC';
  ctx.textAlign = 'center';
  kpValues.forEach((item, idx) => {
    if (idx % 4 === 0) {
      const x = (width / kpValues.length) * idx + (width / kpValues.length) / 2;
      const timeStr = item.time.toLocaleTimeString('zh-Hans', { hour: '2-digit', minute: '2-digit', hour12: false });
      ctx.fillText(timeStr, x, height - 5);
    }
  });
}

// ═══ 繪製儀表盤 ═══
function drawGauge(canvas, value, min, max) {
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  const centerX = width / 2;
  const centerY = height / 2;
  const radius = Math.min(width, height) / 2 - 10;
  
  ctx.fillStyle = '#2a3f52';
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
  ctx.fill();
  
  const startAngle = Math.PI;
  const endAngle = 2 * Math.PI;
  
  ctx.strokeStyle = '#3dbd67';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius - 15, startAngle, startAngle + (endAngle - startAngle) / 3);
  ctx.stroke();
  
  ctx.strokeStyle = '#ffc107';
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius - 15, startAngle + (endAngle - startAngle) / 3, startAngle + 2 * (endAngle - startAngle) / 3);
  ctx.stroke();
  
  ctx.strokeStyle = '#f44336';
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius - 15, startAngle + 2 * (endAngle - startAngle) / 3, endAngle);
  ctx.stroke();
  
  const normalizedValue = Math.max(min, Math.min(max, value));
  const ratio = (normalizedValue - min) / (max - min);
  const angle = startAngle + ratio * (endAngle - startAngle);
  
  ctx.strokeStyle = '#4db8d4';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(centerX, centerY);
  ctx.lineTo(centerX + Math.cos(angle) * (radius - 25), centerY + Math.sin(angle) * (radius - 25));
  ctx.stroke();
  
  ctx.fillStyle = '#1a2332';
  ctx.beginPath();
  ctx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
  ctx.fill();
}

// ═══ 主渲染函數 ═══
async function renderDashboard() {
  const errorContainer = document.getElementById('errorContainer');
  const dashboardContent = document.getElementById('dashboardContent');
  
  try {
    errorContainer.innerHTML = '';
    
    const spaceWeather = await fetchSpaceWeather();
    const weather = await fetchWeather();
    const { kpValues, currentKp, auroraChance, bz, bt } = parseSpaceWeatherData(spaceWeather.kpData, spaceWeather.planetaryData);
    const sunElevation = calculateSunElevation(CONFIG.location.lat, CONFIG.location.lon);
    
    document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-Hans');
    
    const html = `
      <div class="demo-badge">
        ⚠️ 演示模式 - 使用模擬數據（實時數據 API 暫不可用）
      </div>
      <div class="dashboard-grid">
        
        <div class="card">
          <div class="card-title">太陽高度角</div>
          <div class="sun-elevation">
            <div>
              <div class="sun-value">${sunElevation.toFixed(1)}°</div>
              <div class="sun-status">
                ${sunElevation < -6 ? '天文暮光中 ⭐' : sunElevation < -0.833 ? '民間暮光中' : sunElevation < 0 ? '航海暮光中' : '白天'}
              </div>
            </div>
          </div>
          <div class="info-note">
            ${sunElevation < -6 ? '✅ 極光觀測條件良好' : '⚠️ 可能看不到極光（太陽未完全落下）'}
          </div>
        </div>
        
        <div class="card card-large">
          <div class="card-title">Kp 指數（過去 24h + 未來 72h）</div>
          <canvas id="kpCanvas" width="800" height="200"></canvas>
          <div class="chart-label">過去 24 小時觀測，未來 72 小時預報</div>
        </div>
        
        <div class="card card-large">
          <div class="card-title">磁場參數</div>
          <div class="gauges-grid">
            <div class="gauge-container">
              <canvas class="gauge" id="gaugeKp" width="120" height="120"></canvas>
              <div class="gauge-value">${currentKp.toFixed(1)}</div>
              <div class="gauge-label">Kp 指數</div>
            </div>
            <div class="gauge-container">
              <canvas class="gauge" id="gaugeBz" width="120" height="120"></canvas>
              <div class="gauge-value">${bz.toFixed(1)}</div>
              <div class="gauge-label">Bz (nT)</div>
            </div>
            <div class="gauge-container">
              <canvas class="gauge" id="gaugeBt" width="120" height="120"></canvas>
              <div class="gauge-value">${bt.toFixed(1)}</div>
              <div class="gauge-label">Bt (nT)</div>
            </div>
          </div>
        </div>
        
        <div class="card">
          <div class="aurora-probability">
            <div>
              <div class="probability-label">此地點極光機率</div>
              <div class="probability-value">${auroraChance}%</div>
              <div class="probability-label">根據當地磁場參數預估</div>
            </div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-title">該地點天氣</div>
          <div class="weather-grid">
            <div class="weather-item">
              <div class="weather-item-label">氣溫</div>
              <div class="weather-item-value">${weather ? weather.temperature_2m.toFixed(1) + ' °C' : 'N/A'}</div>
            </div>
            <div class="weather-item">
              <div class="weather-item-label">低雲</div>
              <div class="weather-item-value">${weather ? weather.cloud_cover_low + ' %' : 'N/A'}</div>
            </div>
            <div class="weather-item">
              <div class="weather-item-label">中雲</div>
              <div class="weather-item-value">${weather ? weather.cloud_cover_mid + ' %' : 'N/A'}</div>
            </div>
            <div class="weather-item">
              <div class="weather-item-label">高雲</div>
              <div class="weather-item-value">${weather ? weather.cloud_cover_high + ' %' : 'N/A'}</div>
            </div>
            <div class="weather-item">
              <div class="weather-item-label">有效遮蔽率</div>
              <div class="weather-item-value">${weather ? weather.cloud_cover + ' %' : 'N/A'}</div>
            </div>
            <div class="weather-item">
              <div class="weather-item-label">風速</div>
              <div class="weather-item-value">${weather ? weather.wind_speed_10m.toFixed(1) + ' m/s' : 'N/A'}</div>
            </div>
          </div>
        </div>
        
      </div>
    `;
    
    dashboardContent.innerHTML = html;
    dashboardContent.classList.remove('loading');
    
    setTimeout(() => {
      const kpCanvas = document.getElementById('kpCanvas');
      if (kpCanvas) drawKpChart(kpCanvas, kpValues);
      
      const gaugeKp = document.getElementById('gaugeKp');
      if (gaugeKp) drawGauge(gaugeKp, currentKp, 0, 9);
      
      const gaugeBz = document.getElementById('gaugeBz');
      if (gaugeBz) drawGauge(gaugeBz, bz, -20, 20);
      
      const gaugeBt = document.getElementById('gaugeBt');
      if (gaugeBt) drawGauge(gaugeBt, bt, 0, 50);
    }, 100);
    
  } catch (error) {
    console.error('Dashboard error:', error);
    errorContainer.innerHTML = `
      <div class="error">
        <strong>⚠️ 錯誤:</strong> ${error.message}<br>
        <div style="font-size: 12px; margin-top: 8px;">
          請稍後重試，或檢查網路連接。
        </div>
      </div>
    `;
    dashboardContent.innerHTML = '';
  }
}

// ═══ 初始化 ═══
document.addEventListener('DOMContentLoaded', () => {
  renderDashboard();
  setInterval(renderDashboard, 15 * 60 * 1000);
});

</script>

</body>
</html>
